name: ExyliaDisplays
version: '${version}'
main: net.exylia.exyliaDisplays.ExyliaDisplaysPlugin
api-version: '1.21'
authors: [ DiGround ]
website: https://github.com/Exylia-Plugins/ExyliaDisplays
description: Holograms and NPCs with shared click interactions, animations and conditions, edited in game or in YAML.

# Kept up to date by ExyliaLib from this repository's GitHub releases.
exylia-updates: Exylia-Plugins/ExyliaDisplays
# The oldest ExyliaLib this build runs on; ExyliaLib holds back an update that needs a newer one.
exylia-lib: '${exyliaLibVersion}'

folia-supported: true

depend:
  - packetevents

softdepend:
  # Required, but soft so this plugin still starts without it: it then downloads ExyliaLib
  # and asks for a restart.
  - ExyliaLib
  - PlaceholderAPI
  # Read by /holoadmin import and /npcadmin import; never changed. Listed so they load first when both are
  # installed during a move.
  - DecentHolograms
  - HolographicDisplays
  - FancyHolograms
  - Citizens
  - FancyNpcs
  # The name this plugin had before it grew NPCs; its holograms.yml is copied over on first start.
  - ExyliaHolograms

permissions:
  exyliadisplays.holograms:
    description: Create, edit, move and import holograms with /holo and /holoadmin.
    default: op
  exyliadisplays.npcs:
    description: Create, edit, move and import NPCs with /npc and /npcadmin.
    default: op
  exyliadisplays.admin:
    description: Every module, plus /displays reload and modules.
    default: op
    children:
      exyliadisplays.holograms: true
      exyliadisplays.npcs: true
  exyliadisplays.*:
    description: Every ExyliaDisplays permission.
    default: op
    children:
      exyliadisplays.admin: true
  # The permission this plugin had as ExyliaHolograms keeps working.
  exyliaholograms.admin:
    description: The ExyliaHolograms name of exyliadisplays.holograms.
    default: op
    children:
      exyliadisplays.holograms: true

libraries:
  # The same list ExyliaLib declares, in the same order and the same versions.
  # The server's library loader fetches each one once and shares it, so a plugin
  # naming a driver it never opens itself costs nothing, while a plugin missing
  # one that ExyliaLib later needs is a server that starts and then cannot write.
  - 'io.github.revxrsal:lamp.common:4.0.0-rc.17'
  - 'io.github.revxrsal:lamp.bukkit:4.0.0-rc.17'
  - 'com.github.ben-manes.caffeine:caffeine:3.2.4'
  - 'com.zaxxer:HikariCP:5.1.0'
  - 'com.h2database:h2:2.2.224'
  - 'com.mysql:mysql-connector-j:8.4.0'
  - 'org.mariadb.jdbc:mariadb-java-client:3.4.1'
  - 'org.postgresql:postgresql:42.7.4'
  - 'org.mongodb:mongodb-driver-sync:4.11.1'
  - 'redis.clients:jedis:5.1.0'
  - 'org.apache.commons:commons-pool2:2.12.0'
