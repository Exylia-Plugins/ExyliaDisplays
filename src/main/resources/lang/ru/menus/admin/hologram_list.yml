# НЕ РЕДАКТИРОВАТЬ — ПЕРЕСОЗДАЁТСЯ ПРИ КАЖДОМ ЗАПУСКЕ.
#
# Все голограммы сервера и кнопка создания новой.

title: "{primary}&lГОЛОГРАММЫ {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Больше нет голограмм"
    lore:
      - ""
      - " {letters_black}▎ {letters}Создай, чтобы она появилась здесь."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%holo_icon%"
    name: "{primary}&l%holo_name%"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Текст {letters_black}» %holo_preview%"
      - " {letters_black}▎ {letters}Мир {letters_black}» {info}%holo_world%"
      - " {letters_black}▎ {letters}Позиция {letters_black}» {info}%holo_xyz%"
      - " {letters_black}▎ {letters}Строки {letters_black}» {info}%holo_lines%"
      - ""
      - "{secondary}Статус:"
      - " {letters_black}▎ {letters}Статус {letters_black}» %holo_status%"
      - ""
      - "{warning}➥ ЛКМ {letters_black}» {letters}изменить"
      - "{warning}➥ Shift+ЛКМ {letters_black}» {letters}телепорт"
      - "{error}➥ ПКМ {letters_black}» {letters}удалить"
      - ""
    actions:
      - "left: exyliadisplays:holo_edit"
      - "shift_left: exyliadisplays:holo_row_teleport"
      - "right: exyliadisplays:holo_row_delete"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← ПРЕД. СТРАНИЦА'
      lore:
        - ""
        - " {letters_black}▎ {letters}Страница {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lСЛЕД. СТРАНИЦА →'
      lore:
        - ""
        - " {letters_black}▎ {letters}Страница {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - 'next_page'

items:
  create:
    slot: 45
    material: NETHER_STAR
    name: "{primary}&lСОЗДАТЬ ГОЛОГРАММУ"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Новая голограмма там, где ты,"
      - " {letters_black}▎ {letters}из {highlight}готового шаблона{letters}."
      - ""
      - "{warning}➥ Нажми, чтобы создать"
      - ""
    actions:
      - "exyliadisplays:holo_create"

  info:
    slot: 49
    material: BOOK
    name: "{primary}&lГОЛОГРАММЫ"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Голограммы {letters_black}» {info}%holo_count%"
      - ""
      - "{secondary}Совет:"
      - " {letters_black}▎ {letters}Всё это есть и в файле"
      - " {letters_black}▎ {highlight}holograms.yml{letters}, и сохранение"
      - " {letters_black}▎ {letters}файла применяет его сразу."
      - ""
