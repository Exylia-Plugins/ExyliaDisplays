# НЕ РЕДАКТИРОВАТЬ — ПЕРЕСОЗДАЁТСЯ ПРИ КАЖДОМ ЗАПУСКЕ.
#
# Один NPC: его статус и карточка на каждую часть.

title: "{primary}&lNPC {letters_black}» {highlight}%npc_name%"
size: 36
type: SIMPLE

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: "%npc_icon%"
    name: "<gradient:{primary}:{secondary_light}>%npc_name%</gradient>"
    lore:
      - "{letters_black}Статус NPC"
      - ""
      - "{primary}✦ Информация"
      - "  {letters_black}· {info}{icon:sign} {letters}Подпись{letters_black}: %npc_preview%"
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:redstone} {letters}Статус{letters_black}: %status%"
      - "  {letters_black}· {info}{icon:eye} {letters}Видят сейчас{letters_black}: {info}%npc_viewers% {letters}игроков"
      - ""
      - "{primary}{icon:click} ЛКМ {letters_black}· {letters}показать или скрыть"
      - "{primary}{icon:right_click} ПКМ {letters_black}· {letters}переименовать"
    actions:
      - "left: exyliadisplays:npc_toggle"
      - "right: exyliadisplays:npc_rename"

  appearance:
    slot: 11
    material: ARMOR_STAND
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Внешность</gradient>"
    lore:
      - "{letters_black}Настройка NPC"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Скин, поза, размер и контур."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:tag} {letters}Скин{letters_black}: %skin%"
      - "  {letters_black}· {info}{icon:tag} {letters}Поза{letters_black}: {info}%pose%"
      - "  {letters_black}· {info}{icon:iron} {letters}Масштаб{letters_black}: {info}%scale%"
      - "  {letters_black}· {info}{icon:glint} {letters}Свечение{letters_black}: %glow%"
      - ""
      - "{primary}{icon:click} ЛКМ {letters_black}· {letters}скин"
      - "{primary}{icon:right_click} ПКМ {letters_black}· {letters}поза, размер, контур и посадка"
    actions:
      - "left: exyliadisplays:npc_appearance"
      - "right: exyliadisplays:npc_appearance_body"

  equipment:
    slot: 12
    material: DIAMOND_CHESTPLATE
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Экипировка</gradient>"
    lore:
      - "{letters_black}Настройка NPC"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Что он носит и держит —"
      - " {letters}берётся из {highlight}твоей руки{letters}."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:armor} {letters}Носит{letters_black}: %equipment%"
      - ""
      - "{primary}{icon:click} Нажми, чтобы открыть"
    actions:
      - "exyliadisplays:npc_open_equipment"

  label:
    slot: 14
    material: NAME_TAG
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Подпись</gradient>"
    lore:
      - "{letters_black}Настройка NPC"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Строки над головой, со всеми"
      - " {letters}их {highlight}тегами голограмм{letters}, или целая"
      - " {letters}голограмма, следующая за ним."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:sign} {letters}Подпись{letters_black}: %label%"
      - "  {letters_black}· {info}{icon:iron} {letters}Отступ{letters_black}: {info}%npc_height% {letters}блоков"
      - "  {letters_black}· {info}{icon:book} {letters}Голограмма{letters_black}: %link%"
      - ""
      - "{primary}{icon:click} ЛКМ {letters_black}· {letters}изменить подпись"
      - "{primary}{icon:right_click} ПКМ {letters_black}· {letters}связать голограмму"
    actions:
      - "left: exyliadisplays:npc_label"
      - "right: exyliadisplays:npc_link"

  animations:
    slot: 15
    material: FEATHER
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Анимации</gradient>"
    lore:
      - "{letters_black}Настройка NPC"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Жесты: {highlight}помахать{letters}, {highlight}кивнуть{letters},"
      - " {highlight}поклониться{letters}... или {highlight}выступление"
      - " {letters}всем телом, по клику, сам по себе"
      - " {letters}или чтобы поприветствовать игрока."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:click} {letters}ЛКМ{letters_black}: %anim_left%"
      - "  {letters_black}· {info}{icon:right_click} {letters}ПКМ{letters_black}: %anim_right%"
      - "  {letters_black}· {info}{icon:note} {letters}Сам по себе{letters_black}: %anim_idle% {letters_black}· {info}%anim_idle_every%"
      - "  {letters_black}· {info}{icon:note} {letters}Приветствие{letters_black}: %anim_greet% {letters_black}· {info}%anim_greet_range% {letters}блоков"
      - "  {letters_black}· {info}{icon:check} {letters}Сидит{letters_black}: %sitting%"
      - "  {letters_black}· {info}{icon:compass} {letters}Выступления ближе{letters_black}: {info}%anim_perform_range% {letters}блоков"
      - "  {letters_black}· {info}{icon:note} {letters}Idle по кругу{letters_black}: %anim_idle_continuous%"
      - "  {letters_black}· {info}{icon:tag} {letters}Группа{letters_black}: %group%"
      - "  {letters_black}· {info}{icon:redstone} {letters}Состояние{letters_black}: %npc_motion%"
      - ""
      - "{primary}{icon:click} ЛКМ {letters_black}· {letters}что играет по клику"
      - "{primary}{icon:right_click} ПКМ {letters_black}· {letters}idle, приветствие и группа"
      - "{primary}{icon:click} Shift+ЛКМ {letters_black}· {letters}выбрать выступление"
      - "{primary}{icon:right_click} Shift+ПКМ {letters_black}· {letters}пауза или продолжить"
    actions:
      - "left: exyliadisplays:npc_animations"
      - "right: exyliadisplays:npc_animations_auto"
      - "shift_left: exyliadisplays:npc_open_performances"
      - "shift_right: exyliadisplays:npc_pause_toggle"

  interactions:
    slot: 21
    material: LEVER
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Взаимодействия</gradient>"
    lore:
      - "{letters_black}Настройка NPC"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Что делает клик: отправить на"
      - " {letters}сервер, выполнить команды,"
      - " {highlight}сказать {letters}в облачке, взмахнуть"
      - " {letters}рукой; {highlight}ЛКМ {letters}и {highlight}ПКМ {letters}отдельно."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:book} {letters}По клику{letters_black}: %actions%"
      - "  {letters_black}· {info}{icon:tag} {letters}Используют{letters_black}: %use_permission%"
      - "  {letters_black}· {info}{icon:clock} {letters}Перезарядка{letters_black}: {info}%cooldown%s"
      - "  {letters_black}· {info}{icon:check} {letters}Смотрит на кликнувшего{letters_black}: %face_clicker%"
      - ""
      - "{primary}{icon:click} ЛКМ {letters_black}· {letters}что делает клик"
      - "{primary}{icon:right_click} ПКМ {letters_black}· {letters}кто может использовать и как часто"
    actions:
      - "left: exyliadisplays:npc_interactions"
      - "right: exyliadisplays:npc_interactions_rules"

  visibility:
    slot: 22
    material: ENDER_EYE
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Видимость</gradient>"
    lore:
      - "{letters_black}Настройка NPC"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Куда поворачивается голова, кто"
      - " {letters}его видит и с какого расстояния."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:eye} {letters}Взгляд{letters_black}: {info}%look%"
      - "  {letters_black}· {info}{icon:compass} {letters}Радиус поворота{letters_black}: {info}%look_range% {letters}блоков"
      - "  {letters_black}· {info}{icon:key} {letters}Видят{letters_black}: %permission%"
      - "  {letters_black}· {info}{icon:compass} {letters}Дальность{letters_black}: {info}%view_distance% {letters}блоков"
      - ""
      - "{primary}{icon:click} Нажми, чтобы изменить"
    actions:
      - "exyliadisplays:npc_visibility"

  location:
    slot: 23
    material: COMPASS
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Местоположение</gradient>"
    lore:
      - "{letters_black}Настройка NPC"
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:map} {letters}Мир{letters_black}: {info}%world%"
      - "  {letters_black}· {info}{icon:compass} {letters}Позиция{letters_black}: {info}%xyz%"
      - "  {letters_black}· {info}{icon:compass} {letters}Направление{letters_black}: {info}%yaw%° {letters_black}· {info}%pitch%°"
      - ""
      - "{primary}{icon:click} ЛКМ {letters_black}· {letters}точная позиция и поворот"
      - "{primary}{icon:right_click} ПКМ {letters_black}· {letters}переместить · встань там и sneak-клик"
      - "{primary}{icon:click} Shift+ЛКМ {letters_black}· {letters}по центру блока"
      - "{primary}{icon:right_click} Shift+ПКМ {letters_black}· {letters}повернуть ко мне"
    actions:
      - "left: exyliadisplays:npc_location"
      - "right: exyliadisplays:npc_move_here"
      - "shift_left: exyliadisplays:npc_centre"
      - "shift_right: exyliadisplays:npc_face_me"

  teleport:
    slot: 27
    material: ENDER_PEARL
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Телепорт</gradient>"
    lore:
      - "{letters_black}Действие NPC"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Переместиться к нему, лицом к нему."
      - ""
      - "{primary}{icon:click} Нажми для телепорта"
    actions:
      - "exyliadisplays:npc_teleport"

  clone:
    slot: 28
    material: PAPER
    name: "{letters}NPC {letters_black}▸ <gradient:{success}:{success_light}>Дублировать</gradient>"
    lore:
      - "{letters_black}Действие NPC"
      - ""
      - "{success}✎ Информация"
      - " {letters}Копия под новым именем"
      - " {letters}на том же месте."
      - ""
      - "{success}{icon:click} Нажми, чтобы дублировать"
    actions:
      - "exyliadisplays:npc_clone"

  adjust:
    slot: 29
    material: SPYGLASS
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Точная настройка</gradient>"
    lore:
      - "{letters_black}Действие NPC"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Двигай, вращай и масштабируй"
      - " {highlight}колёсиком мыши{letters}, глядя на объект."
      - ""
      - "{primary}✦ Управление"
      - "  {letters_black}· {letters}Колёсико{letters_black}: {info}изменить значение"
      - "  {letters_black}· {letters}Присед + колёсико{letters_black}: {info}размер шага"
      - "  {letters_black}· {letters}F{letters_black}: {info}следующая ось"
      - "  {letters_black}· {letters}Присед + клик{letters_black}: {info}привязка"
      - "  {letters_black}· {letters}Клик{letters_black}: {info}сохранить"
      - ""
      - "{primary}{icon:click} Нажми, чтобы начать"
    actions:
      - "exyliadisplays:npc_adjust"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Назад {letters_black}▸ <gradient:{error}:{error_light}>NPC</gradient>"
    lore:
      - "{error}{icon:click} Нажми, чтобы вернуться"
    actions:
      - "exyliadisplays:npc_open_list"

  undo:
    slot: 33
    material: CLOCK
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Отменить</gradient>"
    lore:
      - "{letters_black}Действие NPC"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Отменяет последнее"
      - " {letters}изменение, сделанное здесь,"
      - " {letters}командой или в файле."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:iron} {letters}Можно отменить{letters_black}: {info}%npc_undo%"
      - ""
      - "{primary}{icon:click} Нажми, чтобы отменить"
    actions:
      - "exyliadisplays:npc_undo"

  delete:
    slot: 35
    material: BARRIER
    name: "{letters}NPC {letters_black}▸ <gradient:{error}:{error_light}>Удалить</gradient>"
    lore:
      - "{letters_black}Опасная зона"
      - ""
      - "{error}✎ Информация"
      - " {letters}Удаляет его навсегда."
      - ""
      - "{error}{icon:click} Нажми, чтобы удалить"
      - "{letters_black}Потребуется подтверждение."
    actions:
      - "exyliadisplays:npc_delete"
