# НЕ РЕДАКТИРОВАТЬ — ПЕРЕСОЗДАЁТСЯ ПРИ КАЖДОМ ЗАПУСКЕ.
#
# Строки одной голограммы, сверху вниз.

title: "{primary}&lСТРОКИ {letters_black}» {highlight}%holo_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Больше нет строк"
    lore:
      - "{letters_black}Добавь текст, предмет, блок или голову ниже."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%line_icon%"
    name: "{letters}Строка {letters_black}▸ <gradient:{primary}:{secondary_light}>#%line_number%</gradient>"
    lore:
      - "{letters_black}Строка голограммы"
      - ""
      - "{primary}✎ Текст"
      - " {letters}%line_text%"
      - ""
      - "{primary}✦ Теги"
      - " {info}%line_tags%%line_style%"
      - ""
      - "{primary}» ЛКМ {letters_black}· {letters}изменить текст"
      - "{primary}» ПКМ {letters_black}· {letters}стиль, движение, видимость"
      - "{primary}» Shift+ЛКМ {letters_black}· {letters}выше"
      - "{primary}» Shift+ПКМ {letters_black}· {letters}ниже"
      - "{primary}» F {letters_black}· {letters}дублировать"
      - "{error}» Q {letters_black}· {letters}убрать"
      - "{letters_black}Потребуется подтверждение."
    actions:
      - "left: exyliadisplays:holo_line_text"
      - "right: exyliadisplays:holo_line_style"
      - "shift_left: exyliadisplays:holo_line_up"
      - "shift_right: exyliadisplays:holo_line_down"
      - "swap: exyliadisplays:holo_line_duplicate"
      - "drop: exyliadisplays:holo_line_delete"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Страница {letters_black}▸ <gradient:{error}:{error_light}>← Предыдущая</gradient>"
      lore:
        - "  {letters_black}· {letters}Страница{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Страница {letters_black}▸ <gradient:{success}:{success_light}>Следующая →</gradient>"
      lore:
        - "  {letters_black}· {letters}Страница{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  add-text:
    slot: 45
    material: OAK_SIGN
    name: "{letters}Строки {letters_black}▸ <gradient:{success}:{success_light}>Добавить текст</gradient>"
    lore:
      - "{letters_black}Новая строка"
      - ""
      - "{success}✎ Информация"
      - " {letters}Новая строка в самом низу."
      - ""
      - "{success}» Нажми, чтобы написать"
    actions:
      - "exyliadisplays:holo_add_line"

  add-item:
    slot: 46
    material: ITEM_FRAME
    name: "{letters}Строки {letters_black}▸ <gradient:{success}:{success_light}>Добавить предмет</gradient>"
    lore:
      - "{letters_black}Новая строка"
      - ""
      - "{success}✎ Информация"
      - " {letters}Парящий предмет, лицом к игроку."
      - ""
      - "{success}» Нажми, чтобы выбрать"
    actions:
      - "exyliadisplays:holo_add_item"

  add-block:
    slot: 47
    material: GRASS_BLOCK
    name: "{letters}Строки {letters_black}▸ <gradient:{success}:{success_light}>Добавить блок</gradient>"
    lore:
      - "{letters_black}Новая строка"
      - ""
      - "{success}✎ Информация"
      - " {letters}Парящий блок; включи {highlight}вращение {letters}в"
      - " {letters}его стиле, чтобы он крутился."
      - ""
      - "{success}» Нажми, чтобы выбрать"
    actions:
      - "exyliadisplays:holo_add_block"

  add-head:
    slot: 51
    material: PLAYER_HEAD
    name: "{letters}Строки {letters_black}▸ <gradient:{success}:{success_light}>Добавить голову</gradient>"
    lore:
      - "{letters_black}Новая строка"
      - ""
      - "{success}✎ Информация"
      - " {letters}Голова игрока — по нику, UUID,"
      - " {letters}текстуре или URL скина. Меняй"
      - " {letters}её величину через {highlight}размер{letters}."
      - ""
      - "{success}» Нажми, чтобы выбрать"
    actions:
      - "exyliadisplays:holo_add_head"

  pages:
    slot: 52
    material: BOOK
    name: "{letters}Строки {letters_black}▸ <gradient:{primary}:{secondary_light}>Страница</gradient> {letters_black}[{info}%holo_page%{letters_black}/{info}%holo_pages%{letters_black}]"
    lore:
      - "{letters_black}Страницы голограммы"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Каждый игрок видит одну страницу"
      - " {letters}за раз; клик {highlight}[PAGE] next {letters}листает."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:paper} {letters}Редактируется{letters_black}: {info}стр. %holo_page%"
      - "  {letters_black}· {info}{icon:clock} {letters}Листает каждые{letters_black}: {info}%holo_page_interval% тиков"
      - ""
      - "{primary}» ЛКМ {letters_black}· {letters}следующая страница"
      - "{primary}» ПКМ {letters_black}· {letters}предыдущая страница"
      - "{primary}» Shift+ЛКМ {letters_black}· {letters}добавить страницу"
      - "{primary}» Shift+ПКМ {letters_black}· {letters}действия клика этой страницы"
      - "{error}» Q {letters_black}· {letters}убрать эту страницу"
      - "{letters_black}Потребуется подтверждение."
    actions:
      - "left: exyliadisplays:holo_page_next"
      - "right: exyliadisplays:holo_page_previous"
      - "shift_left: exyliadisplays:holo_page_add"
      - "shift_right: exyliadisplays:holo_page_click"
      - "drop: exyliadisplays:holo_page_delete"

  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Назад {letters_black}▸ <gradient:{error}:{error_light}>Голограмма</gradient>"
    lore:
      - "{error}» Нажми, чтобы вернуться"
    actions:
      - "exyliadisplays:holo_open_hub"

  all-lines:
    slot: 53
    material: WRITABLE_BOOK
    name: "{letters}Строки {letters_black}▸ <gradient:{primary}:{secondary_light}>Изменить всё сразу</gradient>"
    lore:
      - "{letters_black}Действие голограммы"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Все строки в одном окне, по"
      - " {letters}одной в ряд: самый быстрый"
      - " {letters}способ написать всю"
      - " {letters}голограмму, вместе с тегами."
      - ""
      - "{primary}» Нажми, чтобы открыть"
    actions:
      - "exyliadisplays:holo_all_lines"
