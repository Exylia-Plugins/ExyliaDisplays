# НЕ РЕДАКТИРОВАТЬ — ПЕРЕСОЗДАЁТСЯ ПРИ КАЖДОМ ЗАПУСКЕ.
#
# Что носит NPC: карточка на каждый слот, заполняется предметом из руки.

title: "{primary}&lЭКИПИРОВКА {letters_black}» {highlight}%npc_name%"
size: 36
type: SIMPLE

filler:
