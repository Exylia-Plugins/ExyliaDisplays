      - " {letters_black}▎ {letters}чтобы надеть его. Чары, краска"
      - " {letters_black}▎ {letters}и кастомный вид сохраняются."
      - ""
      - "{secondary}Статус:"
      - " {letters_black}▎ {letters}Носит {letters_black}» %equipment%"
      - ""

  head:
    slot: 10
    material: "%npc_eq_head%"
    name: "{primary}&lГОЛОВА"
    lore:
