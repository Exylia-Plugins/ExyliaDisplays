# НЕ РЕДАКТИРОВАТЬ — ПЕРЕСОЗДАЁТСЯ ПРИ КАЖДОМ ЗАПУСКЕ.
#
# Выступления, которые может сыграть NPC: одиночные эмоции ExyliaEmotes и файлы анимаций
# из plugins/ExyliaDisplays/animations. Строку можно назначить на триггер или проверить.

title: "{primary}&lВЫСТУПЛЕНИЯ {letters_black}» {highlight}%npc_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Больше нет выступлений"
    lore:
      - ""
      - " {letters_black}▎ {letters}Установи {highlight}ExyliaEmotes{letters} или положи файлы"
      - " {letters_black}▎ {letters}анимаций в {highlight}plugins/ExyliaDisplays/animations{letters}."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%perf_icon%"
    name: "%perf_name%"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Тип {letters_black}» %perf_kind%"
      - " {letters_black}▎ {letters}Запись {letters_black}» {info}%perf_value%"
      - ""
      - "{warning}➥ ЛКМ {letters_black}» {letters}назначить на триггер"
      - "{warning}➥ ПКМ {letters_black}» {letters}проверить сейчас"
      - ""
    actions:
      - "left: exyliadisplays:npc_perform_pick"
      - "right: exyliadisplays:npc_perform_try"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← ПРЕД. СТРАНИЦА'
      lore:
        - ""
        - " {letters_black}▎ {letters}Страница {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lСЛЕД. СТРАНИЦА →'
      lore:
        - ""
        - " {letters_black}▎ {letters}Страница {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - 'next_page'

items:
  info:
    slot: 45
    material: BOOK
    name: "{primary}&lВЫСТУПЛЕНИЯ"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Доступно {letters_black}» {info}%perf_count%"
      - ""
      - "{secondary}Совет:"
      - " {letters_black}▎ {letters}Выступление — анимация всего тела."
      - " {letters_black}▎ {letters}Его видят игроки ближе"
      - " {letters_black}▎ {info}%anim_perform_range% {letters}блоков; сидящий NPC"
      - " {letters_black}▎ {letters}никогда не выступает."
      - ""

  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lНАЗАД'
    lore:
      - ""
      - " {letters_black}▎ {letters}Возврат к NPC."
      - ""
      - "{warning}➥ Нажми, чтобы вернуться"
      - ""
    actions:
      - "exyliadisplays:npc_open_hub"
