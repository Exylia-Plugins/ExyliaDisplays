# НЕ РЕДАКТИРОВАТЬ — ПЕРЕСОЗДАЁТСЯ ПРИ КАЖДОМ ЗАПУСКЕ.
#
# Выступления, которые может сыграть NPC: одиночные эмоции ExyliaEmotes и файлы анимаций
# из plugins/ExyliaDisplays/animations. Строку можно назначить на триггер или проверить.

title: "{primary}&lВЫСТУПЛЕНИЯ {letters_black}» {highlight}%npc_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Больше нет выступлений"
    lore:
      - "{letters_black}Установи {highlight}ExyliaEmotes{letters_black} или положи файлы"
      - "{letters_black}анимаций в {highlight}plugins/ExyliaDisplays/animations{letters_black}."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%perf_icon%"
    name: "{letters}Выступление {letters_black}▸ %perf_name%"
    lore:
      - "{letters_black}Выступление NPC"
      - ""
      - "{info}✦ Информация"
      - "  {letters_black}· {info}{icon:tag} {letters}Тип{letters_black}: %perf_kind%"
      - "  {letters_black}· {info}{icon:quill} {letters}Запись{letters_black}: {info}%perf_value%"
      - ""
      - "{info}» ЛКМ {letters_black}· {letters}назначить на триггер"
      - "{info}» ПКМ {letters_black}· {letters}проверить сейчас"
    actions:
      - "left: exyliadisplays:npc_perform_pick"
      - "right: exyliadisplays:npc_perform_try"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Страница {letters_black}▸ <gradient:{error}:{error_light}>← Предыдущая</gradient>"
      lore:
        - "  {letters_black}· {letters}Страница{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Страница {letters_black}▸ <gradient:{success}:{success_light}>Следующая →</gradient>"
      lore:
        - "  {letters_black}· {letters}Страница{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  info:
    slot: 45
    material: BOOK
    name: "<gradient:{primary}:{secondary_light}>Выступления</gradient>"
    lore:
      - "{letters_black}Обзор"
      - ""
      - "{primary}✦ Информация"
      - "  {letters_black}· {info}{icon:iron} {letters}Доступно{letters_black}: {info}%perf_count%"
      - ""
      - "{primary}✎ Совет"
      - " {letters}Выступление — анимация всего"
      - " {letters}тела. Его видят игроки ближе"
      - " {info}%anim_perform_range% {letters}блоков;"
      - " {letters}сидящий NPC никогда не выступает."

  playback:
    slot: 46
    material: JUKEBOX
    name: "{letters}Выступления {letters_black}▸ <gradient:{primary}:{secondary_light}>Воспроизведение</gradient>"
    lore:
      - "{letters_black}Настройка NPC"
      - ""
      - "{primary}✎ Информация"
      - " {letters}На паузе он ничего не играет"
      - " {letters}сам: ни idle, ни приветствия,"
      - " {letters}ни анимаций по клику. Клики и"
      - " {letters}их действия работают."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:redstone} {letters}Состояние{letters_black}: %npc_motion%"
      - "  {letters_black}· {info}{icon:note} {letters}Выступает сейчас{letters_black}: %npc_performing%"
      - ""
      - "{primary}» ЛКМ {letters_black}· {letters}пауза или продолжить"
      - "{primary}» ПКМ {letters_black}· {letters}остановить то, что играет"
    actions:
      - "left: exyliadisplays:npc_playback_toggle"
      - "right: exyliadisplays:npc_stop"

  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Назад {letters_black}▸ <gradient:{error}:{error_light}>NPC</gradient>"
    lore:
      - "{error}» Нажми, чтобы вернуться"
    actions:
      - "exyliadisplays:npc_open_hub"
