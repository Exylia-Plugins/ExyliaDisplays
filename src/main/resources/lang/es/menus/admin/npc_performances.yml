# NO EDITAR — SE REGENERA EN CADA ARRANQUE.
#
# Las actuaciones que puede reproducir un NPC: los emotes individuales de ExyliaEmotes y los
# archivos de animación de plugins/ExyliaDisplays/animations. Una fila va a uno de sus disparadores o se prueba.

title: "{primary}&lACTUACIONES {letters_black}» {highlight}%npc_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No hay más actuaciones"
    lore:
      - "{letters_black}Instala {highlight}ExyliaEmotes{letters_black}, o deja archivos"
      - "{letters_black}de animación en {highlight}plugins/ExyliaDisplays/animations{letters_black}."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Primera página"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Última página →"

pagination:
  slots: '0-35'

  item_template:
    material: "%perf_icon%"
    name: "{letters}Actuación {letters_black}▸ %perf_name%"
    lore:
      - "{letters_black}Actuación del NPC"
      - ""
      - "{info}✦ Información"
      - "  {letters_black}· {info}{icon:tag} {letters}Tipo{letters_black}: %perf_kind%"
      - "  {letters_black}· {info}{icon:quill} {letters}Se escribe{letters_black}: {info}%perf_value%"
      - ""
      - "{info}{icon:click} Clic izquierdo {letters_black}· {letters}ponerla en un disparador"
      - "{info}{icon:right_click} Clic derecho {letters_black}· {letters}probarla ahora"
    actions:
      - "left: exyliadisplays:npc_perform_pick"
      - "right: exyliadisplays:npc_perform_try"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{error}:{error_light}>← Anterior</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{success}:{success_light}>Siguiente →</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  info:
    slot: 45
    material: BOOK
    name: "<gradient:{primary}:{secondary_light}>Actuaciones</gradient>"
    lore:
      - "{letters_black}Resumen"
      - ""
      - "{primary}✦ Información"
      - "  {letters_black}· {info}{icon:iron} {letters}Disponibles{letters_black}: {info}%perf_count%"
      - ""
      - "{primary}✎ Consejo"
      - " {letters}Una actuación es una animación de"
      - " {letters}cuerpo entero. Se ve a menos de"
      - " {info}%anim_perform_range% {letters}bloques;"
      - " {letters}un NPC sentado nunca actúa."

  playback:
    slot: 46
    material: JUKEBOX
    name: "{letters}Actuaciones {letters_black}▸ <gradient:{primary}:{secondary_light}>Reproducción</gradient>"
    lore:
      - "{letters_black}Ajuste del NPC"
      - ""
      - "{primary}✎ Información"
      - " {letters}En pausa no hace nada por su"
      - " {letters}cuenta: ni idle, ni saludo, ni"
      - " {letters}animación de clic. Los clics y"
      - " {letters}sus acciones siguen funcionando."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:redstone} {letters}Estado{letters_black}: %npc_motion%"
      - "  {letters_black}· {info}{icon:note} {letters}Actuando ahora{letters_black}: %npc_performing%"
      - ""
      - "{primary}{icon:click} Clic izquierdo {letters_black}· {letters}pausar o reanudar"
      - "{primary}{icon:right_click} Clic derecho {letters_black}· {letters}detener lo que reproduce"
    actions:
      - "left: exyliadisplays:npc_playback_toggle"
      - "right: exyliadisplays:npc_stop"

  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Volver {letters_black}▸ <gradient:{error}:{error_light}>NPC</gradient>"
    lore:
      - "{error}{icon:click} Clic para volver"
    actions:
      - "exyliadisplays:npc_open_hub"
