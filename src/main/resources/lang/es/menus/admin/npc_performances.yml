# NO EDITAR — SE REGENERA EN CADA ARRANQUE.
#
# Las actuaciones que puede reproducir un NPC: los emotes individuales de ExyliaEmotes y los
# archivos de animación de plugins/ExyliaDisplays/animations. Una fila va a uno de sus disparadores o se prueba.

title: "{primary}&lACTUACIONES {letters_black}» {highlight}%npc_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No hay más actuaciones"
    lore:
      - ""
      - " {letters_black}▎ {letters}Instala {highlight}ExyliaEmotes{letters}, o deja archivos"
      - " {letters_black}▎ {letters}de animación en {highlight}plugins/ExyliaDisplays/animations{letters}."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%perf_icon%"
    name: "%perf_name%"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Tipo {letters_black}» %perf_kind%"
      - " {letters_black}▎ {letters}Se escribe {letters_black}» {info}%perf_value%"
      - ""
      - "{warning}➥ Clic izquierdo {letters_black}» {letters}ponerla en un disparador"
      - "{warning}➥ Clic derecho {letters_black}» {letters}probarla ahora"
      - ""
    actions:
      - "left: exyliadisplays:npc_perform_pick"
      - "right: exyliadisplays:npc_perform_try"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PÁGINA ANTERIOR'
      lore:
        - ""
        - " {letters_black}▎ {letters}Página {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lPÁGINA SIGUIENTE →'
      lore:
        - ""
        - " {letters_black}▎ {letters}Página {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - 'next_page'

items:
  info:
    slot: 45
    material: BOOK
    name: "{primary}&lACTUACIONES"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Disponibles {letters_black}» {info}%perf_count%"
      - ""
      - "{secondary}Consejo:"
      - " {letters_black}▎ {letters}Una actuación es una animación de"
      - " {letters_black}▎ {letters}cuerpo entero. Se ve a menos de"
      - " {letters_black}▎ {info}%anim_perform_range% {letters}bloques; un NPC sentado"
      - " {letters_black}▎ {letters}nunca actúa."
      - ""

  playback:
    slot: 46
    material: JUKEBOX
    name: "{primary}&lREPRODUCCIÓN"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}En pausa no hace nada por su cuenta:"
      - " {letters_black}▎ {letters}ni idle, ni saludo, ni animación de clic."
      - " {letters_black}▎ {letters}Los clics y sus acciones siguen funcionando."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Estado {letters_black}» %npc_motion%"
      - " {letters_black}▎ {letters}Actuando ahora {letters_black}» %npc_performing%"
      - ""
      - "{warning}➥ Clic izquierdo {letters_black}» {letters}pausar o reanudar"
      - "{warning}➥ Clic derecho {letters_black}» {letters}detener lo que reproduce"
      - ""
    actions:
      - "left: exyliadisplays:npc_playback_toggle"
      - "right: exyliadisplays:npc_stop"

  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lVOLVER'
    lore:
      - ""
      - " {letters_black}▎ {letters}Vuelve al NPC."
      - ""
      - "{warning}➥ Clic para volver"
      - ""
    actions:
      - "exyliadisplays:npc_open_hub"
