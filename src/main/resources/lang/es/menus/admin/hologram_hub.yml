      - ""
      - "{primary}✎ Información"
      - " {letters}Va encima de un {highlight}jugador {letters}o un {highlight}mob{letters},"
      - " {letters}moviéndose con él vaya donde vaya."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:tag} {letters}Montado en{letters_black}: %attached%"
      - "  {letters_black}· {info}{icon:iron} {letters}Altura{letters_black}: {info}%attach_offset%"
      - ""
      - "{primary}{icon:click} Clic izquierdo {letters_black}· {letters}elegir dónde va montado"
      - "{primary}{icon:right_click} Clic derecho {letters_black}· {letters}volver a su ubicación"
    actions:
      - "left: exyliadisplays:holo_attach"
      - "right: exyliadisplays:holo_detach"

  leaderboard:
    slot: 24
    material: GOLDEN_HELMET
    glow: "%holo_board_glow%"
    name: "{letters}Holograma {letters_black}▸ <gradient:{highlight}:{warning_light}>Ranking</gradient>"
    lore:
      - "{letters_black}Ajuste del holograma"
      - ""
      - "{highlight}✎ Información"
      - " {letters}Lo convierte en una {highlight}lista de tops {letters}que"
      - " {letters}guarda sus propios valores: bajas,"
      - " {letters}tiempo jugado, dinero y más."
      - ""
      - "{highlight}✦ Estado"
      - "  {letters_black}· {highlight}{icon:star} {letters}Puestos{letters_black}: %holo_board%"
      - "  {letters_black}· {highlight}{icon:book} {letters}Lugares{letters_black}: {highlight}%holo_board_rows%"
      - ""
      - "{highlight}{icon:click} Clic izquierdo {letters_black}· {letters}estadísticas, períodos y filas"
      - "{letters_black}Cada estadística y período es una página."
      - "{highlight}{icon:right_click} Clic derecho {letters_black}· {letters}activar o desactivar"
      - "{letters_black}Sus propias líneas se guardan para después."
    actions:
      - "left: exyliadisplays:holo_leaderboard"
      - "right: exyliadisplays:holo_leaderboard_toggle"

  teleport:
    slot: 27
    material: ENDER_PEARL
    name: "{letters}Holograma {letters_black}▸ <gradient:{primary}:{secondary_light}>Teletransporte</gradient>"
    lore:
      - "{letters_black}Acción del holograma"
      - ""
      - "{primary}✎ Información"
      - " {letters}Ir hasta él, mirándolo."
      - ""
      - "{primary}{icon:click} Clic para ir"
    actions:
      - "exyliadisplays:holo_teleport"

  clone:
    slot: 28
    material: PAPER
    name: "{letters}Holograma {letters_black}▸ <gradient:{success}:{success_light}>Duplicar</gradient>"
    lore:
      - "{letters_black}Acción del holograma"
      - ""
      - "{success}✎ Información"
      - " {letters}Una copia con otro nombre,"
      - " {letters}en el mismo sitio."
      - ""
      - "{success}{icon:click} Clic para duplicar"
    actions:
      - "exyliadisplays:holo_clone"

  adjust:
    slot: 29
    material: SPYGLASS
    name: "{letters}Holograma {letters_black}▸ <gradient:{primary}:{secondary_light}>Ajuste fino</gradient>"
    lore:
      - "{letters_black}Acción del holograma"
      - ""
      - "{primary}✎ Información"
      - " {letters}Muévelo, gíralo y escálalo con la"
      - " {highlight}rueda del ratón {letters}mientras lo miras."
      - ""
      - "{primary}✦ Controles"
      - "  {letters_black}· {letters}Rueda{letters_black}: {info}cambiar el valor"
      - "  {letters_black}· {letters}Agachado + rueda{letters_black}: {info}tamaño del paso"
      - "  {letters_black}· {letters}F{letters_black}: {info}siguiente eje"
      - "  {letters_black}· {letters}Agachado + clic{letters_black}: {info}encajar"
      - "  {letters_black}· {letters}Clic{letters_black}: {info}guardar"
      - ""
      - "{primary}{icon:click} Clic para empezar"
    actions:
      - "exyliadisplays:holo_adjust"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Volver {letters_black}▸ <gradient:{error}:{error_light}>Hologramas</gradient>"
    lore:
      - "{error}{icon:click} Clic para volver"
    actions:
      - "exyliadisplays:holo_open_list"

  templates:
    slot: 32
    material: PAINTING
    name: "{letters}Holograma {letters_black}▸ <gradient:{primary}:{secondary_light}>Plantillas</gradient>"
    lore:
      - "{letters_black}Ajuste del holograma"
      - ""
      - "{primary}✎ Información"
      - " {letters}Guarda este aspecto para reusarlo,"
      - " {letters}o vístelo con uno guardado."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:book} {letters}Plantillas guardadas{letters_black}: {info}%holo_templates%"
      - ""
      - "{primary}{icon:click} Clic izquierdo {letters_black}· {letters}guardar este aspecto"
      - "{primary}{icon:right_click} Clic derecho {letters_black}· {letters}aplicar una plantilla"
    actions:
      - "left: exyliadisplays:holo_template_save"
      - "right: exyliadisplays:holo_template_apply"

  undo:
    slot: 33
    material: CLOCK
    name: "{letters}Holograma {letters_black}▸ <gradient:{primary}:{secondary_light}>Deshacer</gradient>"
    lore:
      - "{letters_black}Acción del holograma"
      - ""
      - "{primary}✎ Información"
      - " {letters}Revierte el último cambio, hecho"
      - " {letters}aquí, por comando o en el archivo."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:iron} {letters}Cambios por deshacer{letters_black}: {info}%holo_undo%"
      - ""
      - "{primary}{icon:click} Clic para deshacer"
    actions:
      - "exyliadisplays:holo_undo"

  delete:
    slot: 35
    material: BARRIER
    name: "{letters}Holograma {letters_black}▸ <gradient:{error}:{error_light}>Eliminar</gradient>"
    lore:
      - "{letters_black}Zona de peligro"
      - ""
      - "{error}✎ Información"
      - " {letters}Lo elimina para siempre."
      - ""
      - "{error}{icon:click} Clic para eliminar"
      - "{letters_black}Se te pedirá confirmación."
    actions:
      - "exyliadisplays:holo_delete"
