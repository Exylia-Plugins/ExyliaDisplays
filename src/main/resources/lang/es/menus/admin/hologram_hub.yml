# NO EDITAR — SE REGENERA EN CADA ARRANQUE.
#
# Un holograma: su estado y una tarjeta para cada parte.

title: "{primary}&lHOLOGRAMA {letters_black}» {highlight}%holo_name%"
size: 45
type: SIMPLE

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: "%holo_toggle_icon%"
    name: "{primary}&l%holo_name%"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Dice {letters_black}» %holo_preview%"
      - " {letters_black}▎ {letters}Líneas {letters_black}» {info}%lines%"
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Estado {letters_black}» %status%"
      - ""
      - "{warning}➥ Clic izquierdo {letters_black}» {letters}mostrar u ocultar"
      - "{warning}➥ Clic derecho {letters_black}» {letters}renombrar"
      - ""
    actions:
      - "left: exyliadisplays:holo_toggle"
      - "right: exyliadisplays:holo_rename"

  lines:
    slot: 20
    material: WRITABLE_BOOK
    name: "{primary}&lLÍNEAS"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Texto, ítems y bloques, cada uno con"
      - " {letters_black}▎ {highlight}tamaño{letters}, {highlight}movimiento {letters}y {highlight}quién lo ve{letters}."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Líneas {letters_black}» {info}%lines%"
      - ""
      - "{warning}➥ Clic para editar"
      - ""
    actions:
      - "exyliadisplays:holo_open_lines"

  appearance:
    slot: 21
    material: GLOW_INK_SAC
    name: "{primary}&lAPARIENCIA"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Cómo se dibuja todo el holograma."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Orientación {letters_black}» {info}%holo_billboard%"
      - " {letters_black}▎ {letters}Escala {letters_black}» {info}%holo_scale%"
      - " {letters_black}▎ {letters}Espaciado {letters_black}» {info}%holo_spacing%"
      - " {letters_black}▎ {letters}Sombra {letters_black}» %holo_shadow%"
      - ""
      - "{warning}➥ Clic para editar"
      - ""
    actions:
      - "exyliadisplays:holo_appearance"

  visibility:
    slot: 22
    material: ENDER_EYE
    name: "{primary}&lVISIBILIDAD"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Quién lo ve, desde qué distancia y"
      - " {letters_black}▎ {letters}cada cuánto se actualiza."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Lo ven {letters_black}» %permission%"
      - " {letters_black}▎ {letters}Distancia {letters_black}» {info}%view_distance%"
      - " {letters_black}▎ {letters}Por jugador {letters_black}» %per_player%"
      - " {letters_black}▎ {letters}Actualiza {letters_black}» {info}%holo_interval% {letters}ticks"
      - ""
      - "{warning}➥ Clic para editar"
      - ""
    actions:
      - "exyliadisplays:holo_visibility"

  click:
    slot: 23
    material: LEVER
    name: "{primary}&lACCIONES AL CLIC"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Qué hace un clic: enviar a un servidor,"
      - " {letters_black}▎ {letters}ejecutar comandos, mostrar mensajes,"
      - " {letters_black}▎ {letters}sonar, con {highlight}izquierdo {letters}y {highlight}derecho {letters}aparte."
      - " {letters_black}▎ {letters}Crece un poco al mirarlo."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Al clic {letters_black}» %click%"
      - " {letters_black}▎ {letters}Crece a {letters_black}» {info}%holo_hover%x"
      - ""
      - "{warning}➥ Clic para editar"
      - ""
    actions:
      - "exyliadisplays:holo_click"

  location:
    slot: 24
    material: COMPASS
    name: "{primary}&lUBICACIÓN"
    lore:
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Mundo {letters_black}» {info}%world%"
      - " {letters_black}▎ {letters}Posición {letters_black}» {info}%xyz%"
      - " {letters_black}▎ {letters}Orientación {letters_black}» {info}%facing%"
      - ""
      - "{warning}➥ Clic izquierdo {letters_black}» {letters}posición y rotación exactas"
      - "{warning}➥ Clic derecho {letters_black}» {letters}mover aquí"
      - "{warning}➥ Shift + clic izquierdo {letters_black}» {letters}centrar en su bloque"
      - "{warning}➥ Shift + clic derecho {letters_black}» {letters}girar hacia mí"
      - ""
    actions:
      - "left: exyliadisplays:holo_location"
      - "right: exyliadisplays:holo_move_here"
      - "shift_left: exyliadisplays:holo_centre"
      - "shift_right: exyliadisplays:holo_face"

  teleport:
    slot: 36
    material: ENDER_PEARL
    name: "{primary}&lTELETRANSPORTE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Ir hasta él, mirándolo."
      - ""
      - "{warning}➥ Clic para ir"
      - ""
    actions:
      - "exyliadisplays:holo_teleport"

  clone:
    slot: 37
    material: PAPER
    name: "{primary}&lDUPLICAR"
    lore:
      - ""
      - " {letters_black}▎ {letters}Una copia con otro nombre,"
      - " {letters_black}▎ {letters}en el mismo sitio."
      - ""
      - "{warning}➥ Clic para duplicar"
      - ""
    actions:
      - "exyliadisplays:holo_clone"

  back:
    slot: 40
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lVOLVER'
    lore:
      - ""
      - " {letters_black}▎ {letters}Vuelve a todos los hologramas."
      - ""
      - "{warning}➥ Clic para volver"
      - ""
    actions:
      - "exyliadisplays:holo_open_list"

  delete:
    slot: 44
    material: BARRIER
    name: "{error}&lELIMINAR"
    lore:
      - ""
      - " {letters_black}▎ {letters}Lo elimina para siempre."
      - " {letters_black}Se te pedirá confirmación."
      - ""
      - "{error}➥ Clic para eliminar"
      - ""
    actions:
      - "exyliadisplays:holo_delete"
