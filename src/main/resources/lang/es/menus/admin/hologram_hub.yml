# NO EDITAR — SE REGENERA EN CADA ARRANQUE.
#
# Un holograma: su estado y una tarjeta para cada parte.

title: "{primary}&lHOLOGRAMA {letters_black}» {highlight}%holo_name%"
size: 36
type: SIMPLE

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: "%holo_toggle_icon%"
    name: "<gradient:{primary}:{secondary_light}>%holo_name%</gradient>"
    lore:
      - "{letters_black}Estado del holograma"
      - ""
      - "{primary}✦ Información"
      - "  {letters_black}· {info}{icon:sign} {letters}Dice{letters_black}: %holo_preview%"
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:redstone} {letters}Estado{letters_black}: %status%"
      - "  {letters_black}· {info}{icon:eye} {letters}Lo ven ahora{letters_black}: {info}%holo_viewers% {letters}jugadores"
      - ""
      - "{primary}{icon:click} Clic izquierdo {letters_black}· {letters}mostrar u ocultar"
      - "{primary}{icon:right_click} Clic derecho {letters_black}· {letters}renombrar"
    actions:
      - "left: exyliadisplays:holo_toggle"
      - "right: exyliadisplays:holo_rename"

  lines:
    slot: 11
    material: WRITABLE_BOOK
    name: "{letters}Holograma {letters_black}▸ <gradient:{primary}:{secondary_light}>Líneas</gradient>"
    lore:
      - "{letters_black}Ajuste del holograma"
      - ""
      - "{primary}✎ Información"
      - " {letters}Texto, ítems y"
      - " {letters}bloques, cada uno con"
      - " {highlight}tamaño{letters}, {highlight}movimiento {letters}y {highlight}quién lo ve{letters}."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:book} {letters}Líneas{letters_black}: {info}%lines%"
      - ""
      - "{primary}{icon:click} Clic para editar"
    actions:
      - "exyliadisplays:holo_open_lines"

  appearance:
    slot: 12
    material: GLOW_INK_SAC
    name: "{letters}Holograma {letters_black}▸ <gradient:{primary}:{secondary_light}>Apariencia</gradient>"
    lore:
      - "{letters_black}Ajuste del holograma"
      - ""
      - "{primary}✎ Información"
      - " {letters}Cómo se dibuja todo el holograma."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:compass} {letters}Orientación{letters_black}: {info}%holo_billboard%"
      - "  {letters_black}· {info}{icon:iron} {letters}Escala{letters_black}: {info}%holo_scale%"
      - "  {letters_black}· {info}{icon:iron} {letters}Espaciado{letters_black}: {info}%holo_spacing%"
      - "  {letters_black}· {info}{icon:redstone} {letters}Sombra{letters_black}: %holo_shadow%"
      - ""
      - "{primary}{icon:click} Clic izquierdo {letters_black}· {letters}forma y tamaño"
      - "{primary}{icon:right_click} Clic derecho {letters_black}· {letters}color y luz"
    actions:
      - "left: exyliadisplays:holo_appearance"
      - "right: exyliadisplays:holo_appearance_light"

  distance:
    slot: 14
    material: TARGET
    name: "{letters}Holograma {letters_black}▸ <gradient:{primary}:{secondary_light}>Tamaño por distancia</gradient>"
    lore:
      - "{letters_black}Ajuste del holograma"
      - ""
      - "{primary}✎ Información"
      - " {letters}Crece con la distancia de"
      - " {letters}cada jugador, para seguir"
      - " {highlight}legible {letters}desde lejos."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:iron} {letters}Crece{letters_black}: %holo_distance%"
      - ""
      - "{primary}{icon:click} Clic para editar"
    actions:
      - "exyliadisplays:holo_distance_scale"

  visibility:
    slot: 15
    material: ENDER_EYE
    name: "{letters}Holograma {letters_black}▸ <gradient:{primary}:{secondary_light}>Visibilidad</gradient>"
    lore:
      - "{letters_black}Ajuste del holograma"
      - ""
      - "{primary}✎ Información"
      - " {letters}Quién lo ve, desde qué distancia"
      - " {letters}y cada cuánto se actualiza."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:key} {letters}Lo ven{letters_black}: %permission%"
      - "  {letters_black}· {info}{icon:compass} {letters}Distancia{letters_black}: {info}%view_distance%"
      - "  {letters_black}· {info}{icon:eye} {letters}Por jugador{letters_black}: %per_player%"
      - "  {letters_black}· {info}{icon:clock} {letters}Actualiza{letters_black}: {info}%holo_interval% {letters}ticks"
      - "  {letters_black}· {info}{icon:eye} {letters}Jugadores{letters_black}: %visibility%"
      - ""
      - "{primary}{icon:click} Clic izquierdo {letters_black}· {letters}editar"
      - "{primary}{icon:right_click} Clic derecho {letters_black}· {letters}todos o solo jugadores elegidos"
    actions:
      - "left: exyliadisplays:holo_visibility"
      - "right: exyliadisplays:holo_visibility_mode"

  click:
    slot: 20
    material: LEVER
    name: "{letters}Holograma {letters_black}▸ <gradient:{primary}:{secondary_light}>Acciones al clic</gradient>"
    lore:
      - "{letters_black}Ajuste del holograma"
      - ""
      - "{primary}✎ Información"
      - " {letters}Qué hace un clic,"
      - " {letters}cómo se ve el {highlight}panel"
      - " {highlight}de botón {letters}y los {highlight}botones {letters}que"
      - " {letters}ejecutan las líneas con {highlight}<button:nombre>{letters}."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:book} {letters}Al clic{letters_black}: %click%"
      - "  {letters_black}· {info}{icon:eye} {letters}Aspecto{letters_black}: %holo_click_style%"
      - "  {letters_black}· {info}{icon:iron} {letters}Botones{letters_black}: %holo_buttons%"
      - "  {letters_black}· {info}{icon:iron} {letters}Crece a{letters_black}: {info}%holo_hover%x"
      - ""
      - "{primary}{icon:click} Clic izquierdo {letters_black}· {letters}acciones"
      - "{primary}{icon:right_click} Clic derecho {letters_black}· {letters}aspecto y sonido"
      - "{primary}{icon:click} Shift-clic {letters_black}· {letters}botones"
    actions:
      - "left: exyliadisplays:holo_click"
      - "right: exyliadisplays:holo_click_look"
      - "shift_left: exyliadisplays:holo_buttons"
      - "shift_right: exyliadisplays:holo_buttons"

  location:
    slot: 21
    material: COMPASS
    name: "{letters}Holograma {letters_black}▸ <gradient:{primary}:{secondary_light}>Ubicación</gradient>"
    lore:
      - "{letters_black}Ajuste del holograma"
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:map} {letters}Mundo{letters_black}: {info}%world%"
      - "  {letters_black}· {info}{icon:compass} {letters}Posición{letters_black}: {info}%xyz%"
      - "  {letters_black}· {info}{icon:compass} {letters}Orientación{letters_black}: {info}%facing%"
      - ""
      - "{primary}{icon:click} Clic izquierdo {letters_black}· {letters}posición y rotación exactas"
      - "{primary}{icon:right_click} Clic derecho {letters_black}· {letters}moverlo · ve allí y sneak-clic"
      - "{primary}{icon:click} Shift + clic izquierdo {letters_black}· {letters}centrar en su bloque"
      - "{primary}{icon:right_click} Shift + clic derecho {letters_black}· {letters}girar hacia mí"
    actions:
      - "left: exyliadisplays:holo_location"
      - "right: exyliadisplays:holo_move_here"
      - "shift_left: exyliadisplays:holo_centre"
      - "shift_right: exyliadisplays:holo_face"

  attach:
    slot: 23
    material: LEAD
    name: "{letters}Holograma {letters_black}▸ <gradient:{primary}:{secondary_light}>Montado en</gradient>"
    lore:
