# NO EDITAR — SE REGENERA EN CADA ARRANQUE.
#
# Lo que lleva un NPC: una tarjeta por hueco, rellenada con el objeto de tu mano.

title: "{primary}&lEQUIPAMIENTO {letters_black}» {highlight}%npc_name%"
size: 27
type: SIMPLE

filler:
