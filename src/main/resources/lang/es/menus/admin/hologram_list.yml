# NO EDITAR — SE REGENERA EN CADA ARRANQUE.
#
# Todos los hologramas del servidor, y el botón para crear uno nuevo.

title: "{primary}&lHOLOGRAMAS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No hay más hologramas"
    lore:
      - "{letters_black}Crea uno para verlo aquí."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%holo_icon%"
    name: "{letters}Holograma {letters_black}▸ <gradient:{primary}:{secondary_light}>%holo_name%</gradient>"
    lore:
      - "{letters_black}Holograma"
      - ""
      - "{primary}✦ Información"
      - "  {letters_black}· {info}{icon:sign} {letters}Dice{letters_black}: %holo_preview%"
      - "  {letters_black}· {info}{icon:map} {letters}Mundo{letters_black}: {info}%holo_world%"
      - "  {letters_black}· {info}{icon:compass} {letters}Posición{letters_black}: {info}%holo_xyz%"
      - "  {letters_black}· {info}{icon:book} {letters}Líneas{letters_black}: {info}%holo_lines%"
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:redstone} {letters}Estado{letters_black}: %holo_status%"
      - ""
      - "{primary}» Clic izquierdo {letters_black}· {letters}editar"
      - "{primary}» Shift + clic izquierdo {letters_black}· {letters}teletransportarse"
      - "{error}» Clic derecho {letters_black}· {letters}eliminar"
      - "{letters_black}Se te pedirá confirmación."
    actions:
      - "left: exyliadisplays:holo_edit"
      - "shift_left: exyliadisplays:holo_row_teleport"
      - "right: exyliadisplays:holo_row_delete"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{error}:{error_light}>← Anterior</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{success}:{success_light}>Siguiente →</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  create:
    slot: 45
    material: NETHER_STAR
    name: "{letters}Hologramas {letters_black}▸ <gradient:{success}:{success_light}>Crear holograma</gradient>"
    lore:
      - "{letters_black}Nuevo holograma"
      - ""
      - "{success}✎ Información"
      - " {letters}Un holograma nuevo donde estás,"
      - " {letters}desde una {highlight}plantilla lista{letters}."
      - ""
      - "{success}» Clic para crear"
    actions:
      - "exyliadisplays:holo_create"

  info:
    slot: 49
    material: BOOK
    name: "<gradient:{primary}:{secondary_light}>Hologramas</gradient>"
    lore:
      - "{letters_black}Resumen"
      - ""
      - "{primary}✦ Información"
      - "  {letters_black}· {info}{icon:iron} {letters}Hologramas{letters_black}: {info}%holo_count%"
      - ""
      - "{primary}✎ Consejo"
      - " {letters}Todo lo de aquí también está en"
      - " {highlight}holograms.yml{letters}, y guardar ese"
      - " {letters}archivo lo aplica al instante."

  settings:
    slot: 53
    material: "COMPARATOR"
    name: "{letters}Displays {letters_black}▸ <gradient:{primary}:{secondary_light}>Ajustes</gradient>"
    lore:
      - "{letters_black}Ajustes del plugin"
      - ""
      - "{primary}✎ Información"
      - " {letters}Cambia los ajustes del plugin"
      - " {letters}sin editar sus {highlight}archivos{letters}."
      - ""
      - "{primary}» Clic {letters_black}· {letters}Abrir ajustes"
    actions:
      - "exyliadisplays:holo_settings"
