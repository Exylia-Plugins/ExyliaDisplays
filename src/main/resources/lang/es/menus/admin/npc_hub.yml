# NO EDITAR — SE REGENERA EN CADA ARRANQUE.
#
# Un NPC: su estado y una tarjeta para cada parte.

title: "{primary}&lNPC {letters_black}» {highlight}%npc_name%"
size: 36
type: SIMPLE

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: "%npc_icon%"
    name: "<gradient:{primary}:{secondary_light}>%npc_name%</gradient>"
    lore:
      - "{letters_black}Estado del NPC"
      - ""
      - "{primary}✦ Información"
      - "  {letters_black}· {info}{icon:sign} {letters}Etiqueta{letters_black}: %npc_preview%"
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:redstone} {letters}Estado{letters_black}: %status%"
      - "  {letters_black}· {info}{icon:eye} {letters}Lo ven ahora{letters_black}: {info}%npc_viewers% {letters}jugadores"
      - ""
      - "{primary}{icon:click} Clic izquierdo {letters_black}· {letters}mostrar u ocultar"
      - "{primary}{icon:right_click} Clic derecho {letters_black}· {letters}renombrar"
    actions:
      - "left: exyliadisplays:npc_toggle"
      - "right: exyliadisplays:npc_rename"

  appearance:
    slot: 11
    material: ARMOR_STAND
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Apariencia</gradient>"
    lore:
      - "{letters_black}Ajuste del NPC"
      - ""
      - "{primary}✎ Información"
      - " {letters}Su skin, postura,"
      - " {letters}tamaño y contorno."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:tag} {letters}Skin{letters_black}: %skin%"
      - "  {letters_black}· {info}{icon:tag} {letters}Postura{letters_black}: {info}%pose%"
      - "  {letters_black}· {info}{icon:iron} {letters}Escala{letters_black}: {info}%scale%"
      - "  {letters_black}· {info}{icon:glint} {letters}Brillo{letters_black}: %glow%"
      - ""
      - "{primary}{icon:click} Clic izquierdo {letters_black}· {letters}skin"
      - "{primary}{icon:right_click} Clic derecho {letters_black}· {letters}postura, tamaño, contorno y sentado"
    actions:
      - "left: exyliadisplays:npc_appearance"
      - "right: exyliadisplays:npc_appearance_body"

  equipment:
    slot: 12
    material: DIAMOND_CHESTPLATE
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Equipamiento</gradient>"
    lore:
      - "{letters_black}Ajuste del NPC"
      - ""
      - "{primary}✎ Información"
      - " {letters}Lo que lleva puesto y en la"
      - " {letters}mano, tomado de {highlight}tu mano{letters}."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:armor} {letters}Lleva{letters_black}: %equipment%"
      - ""
      - "{primary}{icon:click} Clic para abrir"
    actions:
      - "exyliadisplays:npc_open_equipment"

  label:
    slot: 14
    material: NAME_TAG
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Etiqueta</gradient>"
    lore:
      - "{letters_black}Ajuste del NPC"
      - ""
      - "{primary}✎ Información"
      - " {letters}Las líneas sobre su cabeza, con"
      - " {letters}cada {highlight}etiqueta de holograma{letters}, o un"
      - " {letters}holograma entero que lo sigue."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:sign} {letters}Etiqueta{letters_black}: %label%"
      - "  {letters_black}· {info}{icon:iron} {letters}Separación{letters_black}: {info}%npc_height% {letters}bloques"
      - "  {letters_black}· {info}{icon:book} {letters}Holograma{letters_black}: %link%"
      - ""
      - "{primary}{icon:click} Clic izquierdo {letters_black}· {letters}editar la etiqueta"
      - "{primary}{icon:right_click} Clic derecho {letters_black}· {letters}vincular un holograma"
    actions:
      - "left: exyliadisplays:npc_label"
      - "right: exyliadisplays:npc_link"

  animations:
    slot: 15
    material: FEATHER
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Animaciones</gradient>"
    lore:
      - "{letters_black}Ajuste del NPC"
      - ""
      - "{primary}✎ Información"
      - " {letters}Gestos que hace: {highlight}saludar{letters}, {highlight}asentir{letters},"
      - " {highlight}reverencia{letters}... o una {highlight}actuación"
      - " {letters}de cuerpo entero, al hacer"
      - " {letters}clic, por su cuenta o para"
      - " {letters}saludar a quien se acerca."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:click} {letters}Clic izquierdo{letters_black}: %anim_left%"
      - "  {letters_black}· {info}{icon:right_click} {letters}Clic derecho{letters_black}: %anim_right%"
      - "  {letters_black}· {info}{icon:note} {letters}Por su cuenta{letters_black}: %anim_idle% {letters_black}· {info}%anim_idle_every%"
      - "  {letters_black}· {info}{icon:note} {letters}Saludo{letters_black}: %anim_greet% {letters_black}· {info}%anim_greet_range% {letters}bloques"
      - "  {letters_black}· {info}{icon:check} {letters}Sentado{letters_black}: %sitting%"
      - "  {letters_black}· {info}{icon:compass} {letters}Actuaciones a menos de{letters_black}: {info}%anim_perform_range% {letters}bloques"
      - "  {letters_black}· {info}{icon:note} {letters}Idle en bucle{letters_black}: %anim_idle_continuous%"
      - "  {letters_black}· {info}{icon:tag} {letters}Grupo{letters_black}: %group%"
      - "  {letters_black}· {info}{icon:redstone} {letters}Estado{letters_black}: %npc_motion%"
      - ""
      - "{primary}{icon:click} Clic izquierdo {letters_black}· {letters}qué hace al recibir un clic"
      - "{primary}{icon:right_click} Clic derecho {letters_black}· {letters}idle, saludo y grupo"
      - "{primary}{icon:click} Shift + clic izquierdo {letters_black}· {letters}elegir una actuación"
      - "{primary}{icon:right_click} Shift + clic derecho {letters_black}· {letters}pausar o reanudar"
    actions:
      - "left: exyliadisplays:npc_animations"
      - "right: exyliadisplays:npc_animations_auto"
      - "shift_left: exyliadisplays:npc_open_performances"
      - "shift_right: exyliadisplays:npc_pause_toggle"

  interactions:
    slot: 21
    material: LEVER
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Interacciones</gradient>"
    lore:
      - "{letters_black}Ajuste del NPC"
      - ""
      - "{primary}✎ Información"
      - " {letters}Qué hace un clic: enviar a un"
      - " {letters}servidor, ejecutar comandos,"
      - " {highlight}hablar {letters}en un bocadillo, mover"
      - " {letters}el brazo, con {highlight}izquierdo {letters}y"
      - " {highlight}derecho {letters}aparte."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:book} {letters}Al hacer clic{letters_black}: %actions%"
      - "  {letters_black}· {info}{icon:tag} {letters}Lo usan{letters_black}: %use_permission%"
      - "  {letters_black}· {info}{icon:clock} {letters}Espera{letters_black}: {info}%cooldown%s"
      - "  {letters_black}· {info}{icon:check} {letters}Mira a quien clica{letters_black}: %face_clicker%"
      - ""
      - "{primary}{icon:click} Clic izquierdo {letters_black}· {letters}qué hace un clic"
      - "{primary}{icon:right_click} Clic derecho {letters_black}· {letters}quién puede usarlo y cada cuánto"
    actions:
      - "left: exyliadisplays:npc_interactions"
      - "right: exyliadisplays:npc_interactions_rules"

  visibility:
    slot: 22
    material: ENDER_EYE
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Visibilidad</gradient>"
    lore:
      - "{letters_black}Ajuste del NPC"
      - ""
      - "{primary}✎ Información"
      - " {letters}Hacia dónde gira la cabeza, quién"
      - " {letters}lo ve y desde qué distancia."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:eye} {letters}Mira{letters_black}: {info}%look%"
      - "  {letters_black}· {info}{icon:compass} {letters}Alcance de giro{letters_black}: {info}%look_range% {letters}bloques"
      - "  {letters_black}· {info}{icon:key} {letters}Lo ven{letters_black}: %permission%"
      - "  {letters_black}· {info}{icon:compass} {letters}Distancia{letters_black}: {info}%view_distance% {letters}bloques"
      - ""
      - "{primary}{icon:click} Clic para editar"
    actions:
      - "exyliadisplays:npc_visibility"

  location:
    slot: 23
    material: COMPASS
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Ubicación</gradient>"
    lore:
      - "{letters_black}Ajuste del NPC"
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:map} {letters}Mundo{letters_black}: {info}%world%"
      - "  {letters_black}· {info}{icon:compass} {letters}Posición{letters_black}: {info}%xyz%"
      - "  {letters_black}· {info}{icon:compass} {letters}Orientación{letters_black}: {info}%yaw%° {letters_black}· {info}%pitch%°"
      - ""
      - "{primary}{icon:click} Clic izquierdo {letters_black}· {letters}posición y giro exactos"
      - "{primary}{icon:right_click} Clic derecho {letters_black}· {letters}moverlo · ve allí y sneak-clic"
      - "{primary}{icon:click} Shift + clic izquierdo {letters_black}· {letters}centrar en su bloque"
      - "{primary}{icon:right_click} Shift + clic derecho {letters_black}· {letters}que me mire"
    actions:
      - "left: exyliadisplays:npc_location"
      - "right: exyliadisplays:npc_move_here"
      - "shift_left: exyliadisplays:npc_centre"
      - "shift_right: exyliadisplays:npc_face_me"

  teleport:
    slot: 27
    material: ENDER_PEARL
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Teletransporte</gradient>"
    lore:
      - "{letters_black}Acción del NPC"
      - ""
      - "{primary}✎ Información"
      - " {letters}Ir hasta él, mirándolo."
      - ""
      - "{primary}{icon:click} Clic para teletransportarse"
    actions:
      - "exyliadisplays:npc_teleport"

  clone:
    slot: 28
    material: PAPER
    name: "{letters}NPC {letters_black}▸ <gradient:{success}:{success_light}>Duplicar</gradient>"
    lore:
      - "{letters_black}Acción del NPC"
      - ""
      - "{success}✎ Información"
      - " {letters}Una copia con otro nombre,"
      - " {letters}en el mismo sitio."
      - ""
      - "{success}{icon:click} Clic para duplicar"
    actions:
      - "exyliadisplays:npc_clone"

  adjust:
    slot: 29
    material: SPYGLASS
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Ajuste fino</gradient>"
    lore:
      - "{letters_black}Acción del NPC"
      - ""
      - "{primary}✎ Información"
      - " {letters}Muévelo, gíralo y escálalo con la"
      - " {highlight}rueda del ratón {letters}mientras lo miras."
      - ""
      - "{primary}✦ Controles"
      - "  {letters_black}· {letters}Rueda{letters_black}: {info}cambiar el valor"
      - "  {letters_black}· {letters}Agachado + rueda{letters_black}: {info}tamaño del paso"
      - "  {letters_black}· {letters}F{letters_black}: {info}siguiente eje"
      - "  {letters_black}· {letters}Agachado + clic{letters_black}: {info}encajar"
      - "  {letters_black}· {letters}Clic{letters_black}: {info}guardar"
      - ""
      - "{primary}{icon:click} Clic para empezar"
    actions:
      - "exyliadisplays:npc_adjust"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Volver {letters_black}▸ <gradient:{error}:{error_light}>NPCs</gradient>"
    lore:
      - "{error}{icon:click} Clic para volver"
    actions:
      - "exyliadisplays:npc_open_list"

  undo:
    slot: 33
    material: CLOCK
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Deshacer</gradient>"
    lore:
      - "{letters_black}Acción del NPC"
      - ""
      - "{primary}✎ Información"
      - " {letters}Revierte el último cambio, hecho"
      - " {letters}aquí, por comando o en el archivo."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:iron} {letters}Cambios por deshacer{letters_black}: {info}%npc_undo%"
      - ""
      - "{primary}{icon:click} Clic para deshacer"
    actions:
      - "exyliadisplays:npc_undo"

  delete:
    slot: 35
    material: BARRIER
    name: "{letters}NPC {letters_black}▸ <gradient:{error}:{error_light}>Eliminar</gradient>"
    lore:
      - "{letters_black}Zona de peligro"
      - ""
      - "{error}✎ Información"
      - " {letters}Lo borra para siempre."
      - ""
      - "{error}{icon:click} Clic para eliminar"
      - "{letters_black}Se te pedirá confirmación."
    actions:
      - "exyliadisplays:npc_delete"
