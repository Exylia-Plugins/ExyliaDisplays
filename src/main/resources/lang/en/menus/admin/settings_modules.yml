# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Which parts of the plugin run. Changes apply after a restart.

title: "{primary}&lSETTINGS {letters_black}» {highlight}Modules"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: REDSTONE_TORCH
    name: "<gradient:{primary}:{secondary_light}>Modules</gradient>"
    lore:
      - "{letters_black}Modules settings"
      - ""
      - "{primary}✎ Information"
      - " {letters}Switch a module off to stop it"
      - " {letters}loading. Applies on restart."

  modules-holograms:
    slot: 12
    material: NAME_TAG
    name: "{letters}Modules {letters_black}▸ <gradient:{primary}:{secondary_light}>Holograms</gradient>"
    lore:
      - "{letters_black}Modules setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Off: no holograms, commands or"
      - " {letters}menus. Needs a restart."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Module{letters_black}: %modules_modules_holograms%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %modules_modules_holograms_default%"
      - ""
      - "%modules_modules_holograms_click%"
    actions:
      - "exyliadisplays:setting modules modules.holograms"

  modules-leaderboards:
    slot: 13
    material: LECTERN
    name: "{letters}Modules {letters_black}▸ <gradient:{primary}:{secondary_light}>Leaderboards</gradient>"
    lore:
      - "{letters_black}Modules setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Off: boards stop updating and"
      - " {letters}show nothing. Needs a restart."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Module{letters_black}: %modules_modules_leaderboards%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %modules_modules_leaderboards_default%"
      - ""
      - "%modules_modules_leaderboards_click%"
    actions:
      - "exyliadisplays:setting modules modules.leaderboards"

  modules-npcs:
    slot: 14
    material: ARMOR_STAND
    name: "{letters}Modules {letters_black}▸ <gradient:{primary}:{secondary_light}>NPCs</gradient>"
    lore:
      - "{letters_black}Modules setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Off: no NPCs, commands or"
      - " {letters}menus. Needs a restart."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Module{letters_black}: %modules_modules_npcs%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %modules_modules_npcs_default%"
      - ""
      - "%modules_modules_npcs_click%"
    actions:
      - "exyliadisplays:setting modules modules.npcs"

