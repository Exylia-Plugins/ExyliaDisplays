# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The hologram settings an admin tunes. Everything else is in config.yml.

title: "{primary}&lSETTINGS {letters_black}» {highlight}Holograms"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: NAME_TAG
    name: "<gradient:{primary}:{secondary_light}>Holograms</gradient>"
    lore:
      - "{letters_black}Holograms settings"
      - ""
      - "{primary}✎ Information"
      - " {letters}Where new holograms stand and"
      - " {letters}how far they are seen."

  holograms-spawn-height:
    slot: 12
    material: LADDER
    name: "{letters}Holograms {letters_black}▸ <gradient:{primary}:{secondary_light}>Spawn height</gradient>"
    lore:
      - "{letters_black}Holograms setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}How far above your feet a new"
      - " {letters}hologram stands, in blocks."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:map} {letters}Height{letters_black}: %holograms_holograms_spawn_height%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %holograms_holograms_spawn_height_default%"
      - ""
      - "%holograms_holograms_spawn_height_click%"
    actions:
      - "exyliadisplays:setting holograms holograms.spawn-height"

  holograms-default-view-distance:
    slot: 13
    material: SPYGLASS
    name: "{letters}Holograms {letters_black}▸ <gradient:{primary}:{secondary_light}>View distance</gradient>"
    lore:
      - "{letters_black}Holograms setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}How far away a new hologram"
      - " {letters}is seen, in blocks."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:compass} {letters}Distance{letters_black}: %holograms_holograms_default_view_distance%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %holograms_holograms_default_view_distance_default%"
      - ""
      - "%holograms_holograms_default_view_distance_click%"
    actions:
      - "exyliadisplays:setting holograms holograms.default-view-distance"

  holograms-near-radius:
    slot: 14
    material: COMPASS
    name: "{letters}Holograms {letters_black}▸ <gradient:{primary}:{secondary_light}>Near radius</gradient>"
    lore:
      - "{letters_black}Holograms setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}The radius {highlight}/holoadmin near"
      - " {letters}{letters}uses when none is given."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:compass} {letters}Radius{letters_black}: %holograms_holograms_near_radius%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %holograms_holograms_near_radius_default%"
      - ""
      - "%holograms_holograms_near_radius_click%"
    actions:
      - "exyliadisplays:setting holograms holograms.near-radius"

