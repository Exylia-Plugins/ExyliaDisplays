# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One hologram's lines, top first.

title: "{primary}&lLINES {letters_black}» {highlight}%holo_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No more lines"
    lore:
      - "{letters_black}Add text, an item, a block or a head below."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%line_icon%"
    name: "{letters}Line {letters_black}▸ <gradient:{primary}:{secondary_light}>#%line_number%</gradient>"
    lore:
      - "{letters_black}Hologram line"
      - ""
      - "{primary}✎ Reads"
      - " {letters}%line_text%"
      - ""
      - "{primary}✦ Tags"
      - " {info}%line_tags%%line_style%"
      - ""
      - "{primary}» Left-click {letters_black}· {letters}edit text"
      - "{primary}» Right-click {letters_black}· {letters}style, motion, visibility"
      - "{primary}» Shift-left-click {letters_black}· {letters}move up"
      - "{primary}» Shift-right-click {letters_black}· {letters}move down"
      - "{primary}» F {letters_black}· {letters}duplicate"
      - "{error}» Q {letters_black}· {letters}remove"
      - "{letters_black}You will be asked to confirm."
    actions:
      - "left: exyliadisplays:holo_line_text"
      - "right: exyliadisplays:holo_line_style"
      - "shift_left: exyliadisplays:holo_line_up"
      - "shift_right: exyliadisplays:holo_line_down"
      - "swap: exyliadisplays:holo_line_duplicate"
      - "drop: exyliadisplays:holo_line_delete"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{error}:{error_light}>← Previous</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{success}:{success_light}>Next →</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  add-text:
    slot: 45
    material: OAK_SIGN
    name: "{letters}Lines {letters_black}▸ <gradient:{success}:{success_light}>Add text</gradient>"
    lore:
      - "{letters_black}New line"
      - ""
      - "{success}✎ Information"
      - " {letters}A new line at the bottom."
      - ""
      - "{success}» Click to write it"
    actions:
      - "exyliadisplays:holo_add_line"

  add-item:
    slot: 46
    material: ITEM_FRAME
    name: "{letters}Lines {letters_black}▸ <gradient:{success}:{success_light}>Add item</gradient>"
    lore:
      - "{letters_black}New line"
      - ""
      - "{success}✎ Information"
      - " {letters}A floating item, facing the player."
      - ""
      - "{success}» Click to pick it"
    actions:
      - "exyliadisplays:holo_add_item"

  add-block:
    slot: 47
    material: GRASS_BLOCK
    name: "{letters}Lines {letters_black}▸ <gradient:{success}:{success_light}>Add block</gradient>"
    lore:
      - "{letters_black}New line"
      - ""
      - "{success}✎ Information"
      - " {letters}A floating block; give it {highlight}spin"
      - " {letters}from its style to turn it."
      - ""
      - "{success}» Click to pick it"
    actions:
      - "exyliadisplays:holo_add_block"

  add-head:
    slot: 51
    material: PLAYER_HEAD
    name: "{letters}Lines {letters_black}▸ <gradient:{success}:{success_light}>Add head</gradient>"
    lore:
      - "{letters_black}New line"
      - ""
      - "{success}✎ Information"
      - " {letters}A player head, by name, UUID,"
      - " {letters}texture or skin URL. Make it"
      - " {letters}small or large with its {highlight}size{letters}."
      - ""
      - "{success}» Click to pick it"
    actions:
      - "exyliadisplays:holo_add_head"

  pages:
    slot: 52
    material: BOOK
    name: "{letters}Lines {letters_black}▸ <gradient:{primary}:{secondary_light}>Page</gradient> {letters_black}[{info}%holo_page%{letters_black}/{info}%holo_pages%{letters_black}]"
    lore:
      - "{letters_black}Hologram pages"
      - ""
      - "{primary}✎ Information"
      - " {letters}Each player sees one"
      - " {letters}page at a time; a {highlight}[PAGE]"
      - " {highlight}next {letters}click turns it."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:paper} {letters}Editing{letters_black}: {info}page %holo_page%"
      - "  {letters_black}· {info}{icon:clock} {letters}Turns every{letters_black}: {info}%holo_page_interval% ticks"
      - ""
      - "{primary}» Left-click {letters_black}· {letters}next page"
      - "{primary}» Right-click {letters_black}· {letters}previous page"
      - "{primary}» Shift-left-click {letters_black}· {letters}add a page"
      - "{primary}» Shift-right-click {letters_black}· {letters}this page's click actions"
      - "{error}» Q {letters_black}· {letters}remove this page"
      - "{letters_black}You will be asked to confirm."
    actions:
      - "left: exyliadisplays:holo_page_next"
      - "right: exyliadisplays:holo_page_previous"
      - "shift_left: exyliadisplays:holo_page_add"
      - "shift_right: exyliadisplays:holo_page_click"
      - "drop: exyliadisplays:holo_page_delete"

  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Back {letters_black}▸ <gradient:{error}:{error_light}>Hologram</gradient>"
    lore:
      - "{error}» Click to go back"
    actions:
      - "exyliadisplays:holo_open_hub"

  all-lines:
    slot: 53
    material: WRITABLE_BOOK
    name: "{letters}Lines {letters_black}▸ <gradient:{primary}:{secondary_light}>Edit all at once</gradient>"
    lore:
      - "{letters_black}Hologram action"
      - ""
      - "{primary}✎ Information"
      - " {letters}Every line in one box, one per"
      - " {letters}row: the fastest way to write a"
      - " {letters}whole hologram, tags included."
      - ""
      - "{primary}» Click to open"
    actions:
      - "exyliadisplays:holo_all_lines"
