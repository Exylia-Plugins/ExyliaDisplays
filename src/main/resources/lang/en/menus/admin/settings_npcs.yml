# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The NPC settings an admin tunes. Everything else is in config.yml.

title: "{primary}&lSETTINGS {letters_black}» {highlight}NPCs"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: ARMOR_STAND
    name: "<gradient:{primary}:{secondary_light}>NPCs</gradient>"
    lore:
      - "{letters_black}NPCs settings"
      - ""
      - "{primary}✎ Information"
      - " {letters}How new NPCs look, face and"
      - " {letters}speak."

  npcs-default-view-distance:
    slot: 10
    material: SPYGLASS
    name: "{letters}NPCs {letters_black}▸ <gradient:{primary}:{secondary_light}>View distance</gradient>"
    lore:
      - "{letters_black}NPCs setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}How far away a new NPC is"
      - " {letters}seen, in blocks."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:compass} {letters}Distance{letters_black}: %npcs_npcs_default_view_distance%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %npcs_npcs_default_view_distance_default%"
      - ""
      - "%npcs_npcs_default_view_distance_click%"
    actions:
      - "exyliadisplays:setting npcs npcs.default-view-distance"

  npcs-default-look:
