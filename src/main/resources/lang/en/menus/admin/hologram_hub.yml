# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One hologram: its state, and a card for each part of it.

title: "{primary}&lHOLOGRAM {letters_black}» {highlight}%holo_name%"
size: 45
type: SIMPLE

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: "%holo_toggle_icon%"
    name: "{primary}&l%holo_name%"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Reads {letters_black}» %holo_preview%"
      - " {letters_black}▎ {letters}Lines {letters_black}» {info}%lines%"
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}State {letters_black}» %status%"
      - ""
      - "{warning}➥ Left-click {letters_black}» {letters}show or hide"
      - "{warning}➥ Right-click {letters_black}» {letters}rename"
      - ""
    actions:
      - "left: exyliadisplays:holo_toggle"
      - "right: exyliadisplays:holo_rename"

  lines:
    slot: 19
    material: WRITABLE_BOOK
    name: "{primary}&lLINES"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Text, items and blocks, each with"
      - " {letters_black}▎ {highlight}size{letters}, {highlight}motion {letters}and {highlight}who sees it{letters}."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Lines {letters_black}» {info}%lines%"
      - ""
      - "{warning}➥ Click to edit"
      - ""
    actions:
      - "exyliadisplays:holo_open_lines"

  appearance:
    slot: 20
    material: GLOW_INK_SAC
    name: "{primary}&lAPPEARANCE"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}How the whole hologram is drawn."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Facing {letters_black}» {info}%holo_billboard%"
      - " {letters_black}▎ {letters}Scale {letters_black}» {info}%holo_scale%"
      - " {letters_black}▎ {letters}Spacing {letters_black}» {info}%holo_spacing%"
      - " {letters_black}▎ {letters}Shadow {letters_black}» %holo_shadow%"
      - ""
      - "{warning}➥ Left-click {letters_black}» {letters}shape and size"
      - "{warning}➥ Right-click {letters_black}» {letters}colour and light"
      - ""
    actions:
      - "left: exyliadisplays:holo_appearance"
      - "right: exyliadisplays:holo_appearance_light"

  visibility:
    slot: 21
    material: ENDER_EYE
    name: "{primary}&lVISIBILITY"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Who sees it, from how far, and"
      - " {letters_black}▎ {letters}how often it refreshes."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Seen by {letters_black}» %permission%"
      - " {letters_black}▎ {letters}Distance {letters_black}» {info}%view_distance%"
      - " {letters_black}▎ {letters}Per player {letters_black}» %per_player%"
      - " {letters_black}▎ {letters}Refresh {letters_black}» {info}%holo_interval% {letters}ticks"
      - " {letters_black}▎ {letters}Players {letters_black}» %visibility%"
      - ""
      - "{warning}➥ Left-click {letters_black}» {letters}edit"
      - "{warning}➥ Right-click {letters_black}» {letters}everyone or only chosen players"
      - ""
    actions:
      - "left: exyliadisplays:holo_visibility"
      - "right: exyliadisplays:holo_visibility_mode"

  click:
    slot: 23
    material: LEVER
    name: "{primary}&lCLICK ACTIONS"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}What a click does: send to a server,"
      - " {letters_black}▎ {letters}run commands, show messages, play"
      - " {letters_black}▎ {letters}sounds, with {highlight}left {letters}and {highlight}right {letters}apart."
      - " {letters_black}▎ {letters}It grows a little while looked at."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}On click {letters_black}» %click%"
      - " {letters_black}▎ {letters}Grows to {letters_black}» {info}%holo_hover%x"
      - ""
      - "{warning}➥ Click to edit"
      - ""
    actions:
      - "exyliadisplays:holo_click"

  location:
    slot: 24
    material: COMPASS
    name: "{primary}&lLOCATION"
    lore:
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}World {letters_black}» {info}%world%"
      - " {letters_black}▎ {letters}Position {letters_black}» {info}%xyz%"
      - " {letters_black}▎ {letters}Facing {letters_black}» {info}%facing%"
      - ""
      - "{warning}➥ Left-click {letters_black}» {letters}exact position and rotation"
      - "{warning}➥ Right-click {letters_black}» {letters}move here"
      - "{warning}➥ Shift-left-click {letters_black}» {letters}centre on its block"
      - "{warning}➥ Shift-right-click {letters_black}» {letters}turn to face me"
      - ""
    actions:
      - "left: exyliadisplays:holo_location"
      - "right: exyliadisplays:holo_move_here"
      - "shift_left: exyliadisplays:holo_centre"
      - "shift_right: exyliadisplays:holo_face"

  attach:
    slot: 25
    material: LEAD
    name: "{primary}&lATTACHED TO"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Rides a {highlight}player {letters}or a {highlight}mob{letters},"
      - " {letters_black}▎ {letters}moving with it wherever it goes."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Rides {letters_black}» %attached%"
      - " {letters_black}▎ {letters}Height {letters_black}» {info}%attach_offset%"
      - ""
      - "{warning}➥ Left-click {letters_black}» {letters}choose what it rides"
      - "{warning}➥ Right-click {letters_black}» {letters}back to its location"
      - ""
    actions:
      - "left: exyliadisplays:holo_attach"
      - "right: exyliadisplays:holo_detach"

  teleport:
    slot: 36
    material: ENDER_PEARL
    name: "{primary}&lTELEPORT"
    lore:
      - ""
      - " {letters_black}▎ {letters}Go to it, facing it."
      - ""
      - "{warning}➥ Click to teleport"
      - ""
    actions:
      - "exyliadisplays:holo_teleport"

  clone:
    slot: 37
    material: PAPER
    name: "{primary}&lDUPLICATE"
    lore:
      - ""
      - " {letters_black}▎ {letters}A copy under a new name,"
      - " {letters_black}▎ {letters}in the same place."
      - ""
      - "{warning}➥ Click to duplicate"
      - ""
    actions:
      - "exyliadisplays:holo_clone"

  adjust:
    slot: 38
    material: SPYGLASS
    name: "{primary}&lFINE ADJUST"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Move, turn and scale it with the"
      - " {letters_black}▎ {highlight}mouse wheel {letters}while you look at it."
      - ""
      - "{secondary}Controls:"
      - " {letters_black}▎ {letters}Scroll {letters_black}» {info}change the value"
      - " {letters_black}▎ {letters}Sneak + scroll {letters_black}» {info}step size"
      - " {letters_black}▎ {letters}F {letters_black}» {info}next axis"
      - " {letters_black}▎ {letters}Sneak + click {letters_black}» {info}snap"
      - " {letters_black}▎ {letters}Click {letters_black}» {info}save"
      - ""
      - "{warning}➥ Click to start"
      - ""
    actions:
      - "exyliadisplays:holo_adjust"

  back:
    slot: 40
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - ""
      - " {letters_black}▎ {letters}Returns to every hologram."
      - ""
      - "{warning}➥ Click to go back"
      - ""
    actions:
      - "exyliadisplays:holo_open_list"

  templates:
    slot: 41
    material: PAINTING
    name: "{primary}&lTEMPLATES"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Keep this look to reuse it, or"
      - " {letters_black}▎ {letters}dress it as a saved one."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Saved templates {letters_black}» {info}%holo_templates%"
      - ""
      - "{warning}➥ Left-click {letters_black}» {letters}save this look"
      - "{warning}➥ Right-click {letters_black}» {letters}apply a template"
      - ""
    actions:
      - "left: exyliadisplays:holo_template_save"
      - "right: exyliadisplays:holo_template_apply"

  undo:
    slot: 42
    material: CLOCK
    name: "{primary}&lUNDO"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Takes back the last change, made"
      - " {letters_black}▎ {letters}here, by command or in the file."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Changes to undo {letters_black}» {info}%holo_undo%"
      - ""
      - "{warning}➥ Click to undo"
      - ""
    actions:
      - "exyliadisplays:holo_undo"

  delete:
    slot: 44
    material: BARRIER
    name: "{error}&lDELETE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Removes it for good."
      - " {letters_black}You will be asked to confirm."
      - ""
      - "{error}➥ Click to delete"
      - ""
    actions:
      - "exyliadisplays:holo_delete"
