# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One hologram: its state, and a card for each part of it.

title: "{primary}&lHOLOGRAM {letters_black}» {highlight}%holo_name%"
size: 36
type: SIMPLE

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: "%holo_toggle_icon%"
    name: "<gradient:{primary}:{secondary_light}>%holo_name%</gradient>"
    lore:
      - "{letters_black}Hologram status"
      - ""
      - "{primary}✦ Information"
      - "  {letters_black}· {info}{icon:sign} {letters}Reads{letters_black}: %holo_preview%"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}State{letters_black}: %status%"
      - "  {letters_black}· {info}{icon:eye} {letters}Seen by now{letters_black}: {info}%holo_viewers% {letters}players"
      - ""
      - "{primary}{icon:click} Left-click {letters_black}· {letters}show or hide"
      - "{primary}{icon:right_click} Right-click {letters_black}· {letters}rename"
    actions:
      - "left: exyliadisplays:holo_toggle"
      - "right: exyliadisplays:holo_rename"

  lines:
    slot: 11
    material: WRITABLE_BOOK
    name: "{letters}Hologram {letters_black}▸ <gradient:{primary}:{secondary_light}>Lines</gradient>"
    lore:
      - "{letters_black}Hologram setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Text, items and blocks, each with"
      - " {highlight}size{letters}, {highlight}motion {letters}and {highlight}who sees it{letters}."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:book} {letters}Lines{letters_black}: {info}%lines%"
      - ""
      - "{primary}{icon:click} Click to edit"
    actions:
      - "exyliadisplays:holo_open_lines"

  appearance:
    slot: 12
    material: GLOW_INK_SAC
    name: "{letters}Hologram {letters_black}▸ <gradient:{primary}:{secondary_light}>Appearance</gradient>"
    lore:
      - "{letters_black}Hologram setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}How the whole hologram is drawn."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:compass} {letters}Facing{letters_black}: {info}%holo_billboard%"
      - "  {letters_black}· {info}{icon:iron} {letters}Scale{letters_black}: {info}%holo_scale%"
      - "  {letters_black}· {info}{icon:iron} {letters}Spacing{letters_black}: {info}%holo_spacing%"
      - "  {letters_black}· {info}{icon:redstone} {letters}Shadow{letters_black}: %holo_shadow%"
      - ""
      - "{primary}{icon:click} Left-click {letters_black}· {letters}shape and size"
      - "{primary}{icon:right_click} Right-click {letters_black}· {letters}colour and light"
    actions:
      - "left: exyliadisplays:holo_appearance"
      - "right: exyliadisplays:holo_appearance_light"

  distance:
    slot: 14
    material: TARGET
    name: "{letters}Hologram {letters_black}▸ <gradient:{primary}:{secondary_light}>Size by distance</gradient>"
    lore:
      - "{letters_black}Hologram setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Grows with each viewer's"
      - " {letters}distance, so it stays"
      - " {highlight}readable {letters}from far away."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:iron} {letters}Grows{letters_black}: %holo_distance%"
      - ""
      - "{primary}{icon:click} Click to edit"
    actions:
      - "exyliadisplays:holo_distance_scale"

  visibility:
    slot: 15
    material: ENDER_EYE
    name: "{letters}Hologram {letters_black}▸ <gradient:{primary}:{secondary_light}>Visibility</gradient>"
    lore:
      - "{letters_black}Hologram setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Who sees it, from how far,"
      - " {letters}and how often it refreshes."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:key} {letters}Seen by{letters_black}: %permission%"
      - "  {letters_black}· {info}{icon:compass} {letters}Distance{letters_black}: {info}%view_distance%"
      - "  {letters_black}· {info}{icon:eye} {letters}Per player{letters_black}: %per_player%"
      - "  {letters_black}· {info}{icon:clock} {letters}Refresh{letters_black}: {info}%holo_interval% {letters}ticks"
      - "  {letters_black}· {info}{icon:eye} {letters}Players{letters_black}: %visibility%"
      - ""
      - "{primary}{icon:click} Left-click {letters_black}· {letters}edit"
      - "{primary}{icon:right_click} Right-click {letters_black}· {letters}everyone or only chosen players"
    actions:
      - "left: exyliadisplays:holo_visibility"
      - "right: exyliadisplays:holo_visibility_mode"

  click:
    slot: 20
    material: LEVER
    name: "{letters}Hologram {letters_black}▸ <gradient:{primary}:{secondary_light}>Click actions</gradient>"
    lore:
      - "{letters_black}Hologram setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}What a click does, how the {highlight}button"
      - " {highlight}panel {letters}looks, and the {highlight}buttons"
      - " {letters}single lines run with {highlight}<button:name>{letters}."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:book} {letters}On click{letters_black}: %click%"
      - "  {letters_black}· {info}{icon:eye} {letters}Look{letters_black}: %holo_click_style%"
      - "  {letters_black}· {info}{icon:iron} {letters}Buttons{letters_black}: %holo_buttons%"
      - "  {letters_black}· {info}{icon:iron} {letters}Grows to{letters_black}: {info}%holo_hover%x"
      - ""
      - "{primary}{icon:click} Left-click {letters_black}· {letters}actions"
      - "{primary}{icon:right_click} Right-click {letters_black}· {letters}look and sound"
      - "{primary}{icon:click} Shift-click {letters_black}· {letters}buttons"
    actions:
      - "left: exyliadisplays:holo_click"
      - "right: exyliadisplays:holo_click_look"
      - "shift_left: exyliadisplays:holo_buttons"
      - "shift_right: exyliadisplays:holo_buttons"

  location:
    slot: 21
    material: COMPASS
    name: "{letters}Hologram {letters_black}▸ <gradient:{primary}:{secondary_light}>Location</gradient>"
    lore:
      - "{letters_black}Hologram setting"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:map} {letters}World{letters_black}: {info}%world%"
      - "  {letters_black}· {info}{icon:compass} {letters}Position{letters_black}: {info}%xyz%"
      - "  {letters_black}· {info}{icon:compass} {letters}Facing{letters_black}: {info}%facing%"
      - ""
      - "{primary}{icon:click} Left-click {letters_black}· {letters}exact position and rotation"
      - "{primary}{icon:right_click} Right-click {letters_black}· {letters}move it · walk there, sneak-click"
      - "{primary}{icon:click} Shift-left-click {letters_black}· {letters}centre on its block"
      - "{primary}{icon:right_click} Shift-right-click {letters_black}· {letters}turn to face me"
    actions:
      - "left: exyliadisplays:holo_location"
      - "right: exyliadisplays:holo_move_here"
      - "shift_left: exyliadisplays:holo_centre"
      - "shift_right: exyliadisplays:holo_face"

  attach:
    slot: 23
    material: LEAD
    name: "{letters}Hologram {letters_black}▸ <gradient:{primary}:{secondary_light}>Attached to</gradient>"
    lore:
      - "{letters_black}Hologram setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Rides a {highlight}player {letters}or a {highlight}mob{letters}, moving"
      - " {letters}with it wherever it goes."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:tag} {letters}Rides{letters_black}: %attached%"
      - "  {letters_black}· {info}{icon:iron} {letters}Height{letters_black}: {info}%attach_offset%"
      - ""
      - "{primary}{icon:click} Left-click {letters_black}· {letters}choose what it rides"
      - "{primary}{icon:right_click} Right-click {letters_black}· {letters}back to its location"
    actions:
      - "left: exyliadisplays:holo_attach"
      - "right: exyliadisplays:holo_detach"

  leaderboard:
    slot: 24
    material: GOLDEN_HELMET
    glow: "%holo_board_glow%"
    name: "{letters}Hologram {letters_black}▸ <gradient:{highlight}:{warning_light}>Leaderboard</gradient>"
    lore:
      - "{letters_black}Hologram setting"
      - ""
      - "{highlight}✎ Information"
      - " {letters}Turns it into a {highlight}top list {letters}that"
      - " {letters}keeps its own values: kills,"
      - " {letters}play time, money and more."
      - ""
      - "{highlight}✦ Status"
      - "  {letters_black}· {highlight}{icon:star} {letters}Ranks{letters_black}: %holo_board%"
      - "  {letters_black}· {highlight}{icon:book} {letters}Places{letters_black}: {highlight}%holo_board_rows%"
      - ""
      - "{highlight}{icon:click} Left-click {letters_black}· {letters}stats, periods and rows"
      - "{letters_black}Each stat and period is a page."
      - "{highlight}{icon:right_click} Right-click {letters_black}· {letters}turn on or off"
      - "{letters_black}Its own lines are kept for later."
    actions:
      - "left: exyliadisplays:holo_leaderboard"
      - "right: exyliadisplays:holo_leaderboard_toggle"

  teleport:
    slot: 27
    material: ENDER_PEARL
    name: "{letters}Hologram {letters_black}▸ <gradient:{primary}:{secondary_light}>Teleport</gradient>"
    lore:
      - "{letters_black}Hologram action"
      - ""
      - "{primary}✎ Information"
      - " {letters}Go to it, facing it."
      - ""
      - "{primary}{icon:click} Click to teleport"
    actions:
      - "exyliadisplays:holo_teleport"

  clone:
    slot: 28
    material: PAPER
    name: "{letters}Hologram {letters_black}▸ <gradient:{success}:{success_light}>Duplicate</gradient>"
    lore:
      - "{letters_black}Hologram action"
      - ""
      - "{success}✎ Information"
      - " {letters}A copy under a new name,"
      - " {letters}in the same place."
      - ""
      - "{success}{icon:click} Click to duplicate"
    actions:
      - "exyliadisplays:holo_clone"

  adjust:
    slot: 29
    material: SPYGLASS
    name: "{letters}Hologram {letters_black}▸ <gradient:{primary}:{secondary_light}>Fine adjust</gradient>"
    lore:
      - "{letters_black}Hologram action"
      - ""
      - "{primary}✎ Information"
      - " {letters}Move, turn and scale it with the"
      - " {highlight}mouse wheel {letters}while you look at it."
      - ""
      - "{primary}✦ Controls"
      - "  {letters_black}· {letters}Scroll{letters_black}: {info}change the value"
      - "  {letters_black}· {letters}Sneak + scroll{letters_black}: {info}step size"
      - "  {letters_black}· {letters}F{letters_black}: {info}next axis"
      - "  {letters_black}· {letters}Sneak + click{letters_black}: {info}snap"
      - "  {letters_black}· {letters}Click{letters_black}: {info}save"
      - ""
      - "{primary}{icon:click} Click to start"
    actions:
      - "exyliadisplays:holo_adjust"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Back {letters_black}▸ <gradient:{error}:{error_light}>Holograms</gradient>"
    lore:
      - "{error}{icon:click} Click to go back"
    actions:
      - "exyliadisplays:holo_open_list"

  templates:
    slot: 32
    material: PAINTING
    name: "{letters}Hologram {letters_black}▸ <gradient:{primary}:{secondary_light}>Templates</gradient>"
    lore:
      - "{letters_black}Hologram setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Keep this look to reuse it,"
      - " {letters}or dress it as a saved one."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:book} {letters}Saved templates{letters_black}: {info}%holo_templates%"
      - ""
      - "{primary}{icon:click} Left-click {letters_black}· {letters}save this look"
      - "{primary}{icon:right_click} Right-click {letters_black}· {letters}apply a template"
    actions:
      - "left: exyliadisplays:holo_template_save"
      - "right: exyliadisplays:holo_template_apply"

  undo:
    slot: 33
    material: CLOCK
    name: "{letters}Hologram {letters_black}▸ <gradient:{primary}:{secondary_light}>Undo</gradient>"
    lore:
      - "{letters_black}Hologram action"
      - ""
      - "{primary}✎ Information"
      - " {letters}Takes back the last change, made"
      - " {letters}here, by command or in the file."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:iron} {letters}Changes to undo{letters_black}: {info}%holo_undo%"
      - ""
      - "{primary}{icon:click} Click to undo"
    actions:
      - "exyliadisplays:holo_undo"

  delete:
    slot: 35
    material: BARRIER
    name: "{letters}Hologram {letters_black}▸ <gradient:{error}:{error_light}>Delete</gradient>"
    lore:
      - "{letters_black}Danger zone"
      - ""
      - "{error}✎ Information"
      - " {letters}Removes it for good."
      - ""
      - "{error}{icon:click} Click to delete"
      - "{letters_black}You will be asked to confirm."
    actions:
      - "exyliadisplays:holo_delete"
