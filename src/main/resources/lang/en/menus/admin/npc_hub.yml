# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One NPC: its state, and a card for each part of it.

title: "{primary}&lNPC {letters_black}» {highlight}%npc_name%"
size: 45
type: SIMPLE

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: "%npc_icon%"
    name: "{primary}&l%npc_name%"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Label {letters_black}» %npc_preview%"
      - " {letters_black}▎ {letters}Skin {letters_black}» %skin%"
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}State {letters_black}» %status%"
      - " {letters_black}▎ {letters}Seen by now {letters_black}» {info}%npc_viewers% {letters}players"
      - ""
      - "{warning}➥ Left-click {letters_black}» {letters}show or hide"
      - "{warning}➥ Right-click {letters_black}» {letters}rename"
      - ""
    actions:
      - "left: exyliadisplays:npc_toggle"
      - "right: exyliadisplays:npc_rename"

  appearance:
    slot: 19
    material: ARMOR_STAND
    name: "{primary}&lAPPEARANCE"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Its skin, pose, size and outline."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Skin {letters_black}» %skin%"
      - " {letters_black}▎ {letters}Pose {letters_black}» {info}%pose%"
      - " {letters_black}▎ {letters}Scale {letters_black}» {info}%scale%"
      - " {letters_black}▎ {letters}Glow {letters_black}» %glow%"
      - ""
      - "{warning}➥ Left-click {letters_black}» {letters}skin"
      - "{warning}➥ Right-click {letters_black}» {letters}pose, size, outline and sitting"
      - ""
    actions:
      - "left: exyliadisplays:npc_appearance"
      - "right: exyliadisplays:npc_appearance_body"

  equipment:
    slot: 20
    material: DIAMOND_CHESTPLATE
    name: "{primary}&lEQUIPMENT"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}What it wears and holds, taken"
      - " {letters_black}▎ {letters}from the item in {highlight}your hand{letters}."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Wears {letters_black}» %equipment%"
      - ""
      - "{warning}➥ Click to open"
      - ""
    actions:
      - "exyliadisplays:npc_open_equipment"

  label:
    slot: 21
    material: NAME_TAG
    name: "{primary}&lLABEL"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}The lines above its head, with"
      - " {letters_black}▎ {letters}every {highlight}hologram tag{letters}, or a whole"
      - " {letters_black}▎ {letters}hologram that follows it."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Label {letters_black}» %label%"
      - " {letters_black}▎ {letters}Gap {letters_black}» {info}%npc_height% {letters}blocks"
      - " {letters_black}▎ {letters}Hologram {letters_black}» %link%"
      - ""
      - "{warning}➥ Left-click {letters_black}» {letters}edit the label"
      - "{warning}➥ Right-click {letters_black}» {letters}link a hologram"
      - ""
    actions:
      - "left: exyliadisplays:npc_label"
      - "right: exyliadisplays:npc_link"

  animations:
    slot: 22
    material: FEATHER
    name: "{primary}&lANIMATIONS"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Gestures it plays: {highlight}wave{letters}, {highlight}nod{letters},"
      - " {letters_black}▎ {highlight}bow{letters}... or a whole-body {highlight}performance{letters},"
      - " {letters_black}▎ {letters}on a click, on its own, or to greet"
      - " {letters_black}▎ {letters}a player who walks up."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Left-click {letters_black}» %anim_left%"
      - " {letters_black}▎ {letters}Right-click {letters_black}» %anim_right%"
      - " {letters_black}▎ {letters}On its own {letters_black}» %anim_idle% {letters_black}· {info}%anim_idle_every% ⌚"
      - " {letters_black}▎ {letters}Greet {letters_black}» %anim_greet% {letters_black}· {info}%anim_greet_range% {letters}blocks"
      - " {letters_black}▎ {letters}Sitting {letters_black}» %sitting%"
      - " {letters_black}▎ {letters}Performances within {letters_black}» {info}%anim_perform_range% {letters}blocks"
      - ""
      - "{warning}➥ Left-click {letters_black}» {letters}what a click plays"
      - "{warning}➥ Right-click {letters_black}» {letters}on its own, and to greet"
      - "{warning}➥ Shift-left-click {letters_black}» {letters}pick a performance"
      - ""
    actions:
      - "left: exyliadisplays:npc_animations"
      - "right: exyliadisplays:npc_animations_auto"
      - "shift_left: exyliadisplays:npc_open_performances"

  interactions:
    slot: 23
    material: LEVER
    name: "{primary}&lINTERACTIONS"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}What a click does: send to a server,"
      - " {letters_black}▎ {letters}run commands, {highlight}speak {letters}in a bubble,"
      - " {letters_black}▎ {letters}swing, with {highlight}left {letters}and {highlight}right {letters}apart."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}On click {letters_black}» %actions%"
      - " {letters_black}▎ {letters}Used by {letters_black}» %use_permission%"
      - " {letters_black}▎ {letters}Cooldown {letters_black}» {info}%cooldown%s ⌚"
      - " {letters_black}▎ {letters}Turns to clicker {letters_black}» %face_clicker%"
      - ""
      - "{warning}➥ Left-click {letters_black}» {letters}what a click does"
      - "{warning}➥ Right-click {letters_black}» {letters}who may use it, and how often"
      - ""
    actions:
      - "left: exyliadisplays:npc_interactions"
      - "right: exyliadisplays:npc_interactions_rules"

  visibility:
    slot: 24
    material: ENDER_EYE
    name: "{primary}&lVISIBILITY"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Where its head turns, who sees"
      - " {letters_black}▎ {letters}it, and from how far."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Looks {letters_black}» {info}%look%"
      - " {letters_black}▎ {letters}Turn range {letters_black}» {info}%look_range% {letters}blocks"
      - " {letters_black}▎ {letters}Seen by {letters_black}» %permission%"
      - " {letters_black}▎ {letters}Distance {letters_black}» {info}%view_distance% {letters}blocks"
      - ""
      - "{warning}➥ Click to edit"
      - ""
    actions:
      - "exyliadisplays:npc_visibility"

  location:
    slot: 25
    material: COMPASS
    name: "{primary}&lLOCATION"
    lore:
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}World {letters_black}» {info}%world%"
      - " {letters_black}▎ {letters}Position {letters_black}» {info}%xyz%"
      - " {letters_black}▎ {letters}Facing {letters_black}» {info}%yaw%° {letters_black}· {info}%pitch%°"
      - ""
      - "{warning}➥ Left-click {letters_black}» {letters}exact position and rotation"
      - "{warning}➥ Right-click {letters_black}» {letters}move here"
      - "{warning}➥ Shift-left-click {letters_black}» {letters}centre on its block"
      - "{warning}➥ Shift-right-click {letters_black}» {letters}turn to face me"
      - ""
    actions:
      - "left: exyliadisplays:npc_location"
      - "right: exyliadisplays:npc_move_here"
      - "shift_left: exyliadisplays:npc_centre"
      - "shift_right: exyliadisplays:npc_face_me"

  teleport:
    slot: 36
    material: ENDER_PEARL
    name: "{primary}&lTELEPORT"
    lore:
      - ""
      - " {letters_black}▎ {letters}Go to it, facing it."
      - ""
      - "{warning}➥ Click to teleport"
      - ""
    actions:
      - "exyliadisplays:npc_teleport"

  clone:
    slot: 37
    material: PAPER
    name: "{primary}&lDUPLICATE"
    lore:
      - ""
      - " {letters_black}▎ {letters}A copy under a new name,"
      - " {letters_black}▎ {letters}in the same place."
      - ""
      - "{warning}➥ Click to duplicate"
      - ""
    actions:
      - "exyliadisplays:npc_clone"

  adjust:
    slot: 38
    material: SPYGLASS
    name: "{primary}&lFINE ADJUST"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Move, turn and scale it with the"
      - " {letters_black}▎ {highlight}mouse wheel {letters}while you look at it."
      - ""
      - "{secondary}Controls:"
      - " {letters_black}▎ {letters}Scroll {letters_black}» {info}change the value"
      - " {letters_black}▎ {letters}Sneak + scroll {letters_black}» {info}step size"
      - " {letters_black}▎ {letters}F {letters_black}» {info}next axis"
      - " {letters_black}▎ {letters}Sneak + click {letters_black}» {info}snap"
      - " {letters_black}▎ {letters}Click {letters_black}» {info}save"
      - ""
      - "{warning}➥ Click to start"
      - ""
    actions:
      - "exyliadisplays:npc_adjust"

  back:
    slot: 40
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - ""
      - " {letters_black}▎ {letters}Returns to every NPC."
      - ""
      - "{warning}➥ Click to go back"
      - ""
    actions:
      - "exyliadisplays:npc_open_list"

  undo:
    slot: 42
    material: CLOCK
    name: "{primary}&lUNDO"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Takes back the last change, made"
      - " {letters_black}▎ {letters}here, by command or in the file."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Changes to undo {letters_black}» {info}%npc_undo%"
      - ""
      - "{warning}➥ Click to undo"
      - ""
    actions:
      - "exyliadisplays:npc_undo"

  delete:
    slot: 44
    material: BARRIER
    name: "{error}&lDELETE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Removes it for good."
      - " {letters_black}You will be asked to confirm."
      - ""
      - "{error}➥ Click to delete"
      - ""
    actions:
      - "exyliadisplays:npc_delete"
