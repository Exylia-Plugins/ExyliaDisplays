# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One NPC: its state, and a card for each part of it.

title: "{primary}&lNPC {letters_black}» {highlight}%npc_name%"
size: 45
type: SIMPLE

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: "%npc_icon%"
    name: "<gradient:{primary}:{secondary_light}>%npc_name%</gradient>"
    lore:
      - "{letters_black}NPC status"
      - ""
      - "{primary}✦ Information"
      - "  {letters_black}· {info}{icon:sign} {letters}Label{letters_black}: %npc_preview%"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}State{letters_black}: %status%"
      - "  {letters_black}· {info}{icon:eye} {letters}Seen by now{letters_black}: {info}%npc_viewers% {letters}players"
      - ""
      - "{primary}» Left-click {letters_black}· {letters}show or hide"
      - "{primary}» Right-click {letters_black}· {letters}rename"
    actions:
      - "left: exyliadisplays:npc_toggle"
      - "right: exyliadisplays:npc_rename"

  appearance:
    slot: 19
    material: ARMOR_STAND
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Appearance</gradient>"
    lore:
      - "{letters_black}NPC setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Its skin, pose, size and outline."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:tag} {letters}Skin{letters_black}: %skin%"
      - "  {letters_black}· {info}{icon:tag} {letters}Pose{letters_black}: {info}%pose%"
      - "  {letters_black}· {info}{icon:iron} {letters}Scale{letters_black}: {info}%scale%"
      - "  {letters_black}· {info}{icon:glint} {letters}Glow{letters_black}: %glow%"
      - ""
      - "{primary}» Left-click {letters_black}· {letters}skin"
      - "{primary}» Right-click {letters_black}· {letters}pose, size, outline and sitting"
    actions:
      - "left: exyliadisplays:npc_appearance"
      - "right: exyliadisplays:npc_appearance_body"

  equipment:
    slot: 20
    material: DIAMOND_CHESTPLATE
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Equipment</gradient>"
    lore:
      - "{letters_black}NPC setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}What it wears and holds, taken"
      - " {letters}from the item in {highlight}your hand{letters}."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:armor} {letters}Wears{letters_black}: %equipment%"
      - ""
      - "{primary}» Click to open"
    actions:
      - "exyliadisplays:npc_open_equipment"

  label:
    slot: 21
    material: NAME_TAG
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Label</gradient>"
    lore:
      - "{letters_black}NPC setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}The lines above its head, with"
      - " {letters}every {highlight}hologram tag{letters}, or a whole"
      - " {letters}hologram that follows it."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:sign} {letters}Label{letters_black}: %label%"
      - "  {letters_black}· {info}{icon:iron} {letters}Gap{letters_black}: {info}%npc_height% {letters}blocks"
      - "  {letters_black}· {letters}Hologram{letters_black}: %link%"
      - ""
      - "{primary}» Left-click {letters_black}· {letters}edit the label"
      - "{primary}» Right-click {letters_black}· {letters}link a hologram"
    actions:
      - "left: exyliadisplays:npc_label"
      - "right: exyliadisplays:npc_link"

  animations:
    slot: 22
    material: FEATHER
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Animations</gradient>"
    lore:
      - "{letters_black}NPC setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Gestures it plays: {highlight}wave{letters}, {highlight}nod{letters},"
      - " {highlight}bow{letters}... or a whole-body"
      - " {highlight}performance{letters}, on a click,"
      - " {letters}on its own, or to greet"
      - " {letters}a player who walks up."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {letters}Left-click{letters_black}: %anim_left%"
      - "  {letters_black}· {letters}Right-click{letters_black}: %anim_right%"
      - "  {letters_black}· {info}{icon:note} {letters}On its own{letters_black}: %anim_idle% {letters_black}· {info}%anim_idle_every% ⌚"
      - "  {letters_black}· {info}{icon:note} {letters}Greet{letters_black}: %anim_greet% {letters_black}· {info}%anim_greet_range% {letters}blocks"
      - "  {letters_black}· {info}{icon:check} {letters}Sitting{letters_black}: %sitting%"
      - "  {letters_black}· {info}{icon:compass} {letters}Performances within{letters_black}: {info}%anim_perform_range% {letters}blocks"
      - "  {letters_black}· {info}{icon:note} {letters}Looping idle{letters_black}: %anim_idle_continuous%"
      - "  {letters_black}· {info}{icon:tag} {letters}Group{letters_black}: %group%"
      - "  {letters_black}· {info}{icon:redstone} {letters}State{letters_black}: %npc_motion%"
      - ""
      - "{primary}» Left-click {letters_black}· {letters}what a click plays"
      - "{primary}» Right-click {letters_black}· {letters}idle, greeting and group"
      - "{primary}» Shift-left-click {letters_black}· {letters}pick a performance"
      - "{primary}» Shift-right-click {letters_black}· {letters}pause or resume"
    actions:
      - "left: exyliadisplays:npc_animations"
      - "right: exyliadisplays:npc_animations_auto"
      - "shift_left: exyliadisplays:npc_open_performances"
      - "shift_right: exyliadisplays:npc_pause_toggle"

  interactions:
    slot: 23
    material: LEVER
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Interactions</gradient>"
    lore:
      - "{letters_black}NPC setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}What a click does: send to"
      - " {letters}a server, run commands,"
      - " {highlight}speak {letters}in a bubble, swing,"
      - " {letters}with {highlight}left {letters}and {highlight}right {letters}apart."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:book} {letters}On click{letters_black}: %actions%"
      - "  {letters_black}· {info}{icon:tag} {letters}Used by{letters_black}: %use_permission%"
      - "  {letters_black}· {info}{icon:clock} {letters}Cooldown{letters_black}: {info}%cooldown%s"
      - "  {letters_black}· {info}{icon:check} {letters}Turns to clicker{letters_black}: %face_clicker%"
      - ""
      - "{primary}» Left-click {letters_black}· {letters}what a click does"
      - "{primary}» Right-click {letters_black}· {letters}who may use it, and how often"
    actions:
      - "left: exyliadisplays:npc_interactions"
      - "right: exyliadisplays:npc_interactions_rules"

  visibility:
    slot: 24
    material: ENDER_EYE
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Visibility</gradient>"
    lore:
      - "{letters_black}NPC setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Where its head turns, who"
      - " {letters}sees it, and from how far."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:eye} {letters}Looks{letters_black}: {info}%look%"
      - "  {letters_black}· {info}{icon:compass} {letters}Turn range{letters_black}: {info}%look_range% {letters}blocks"
      - "  {letters_black}· {info}{icon:key} {letters}Seen by{letters_black}: %permission%"
      - "  {letters_black}· {info}{icon:compass} {letters}Distance{letters_black}: {info}%view_distance% {letters}blocks"
      - ""
      - "{primary}» Click to edit"
    actions:
      - "exyliadisplays:npc_visibility"

  location:
    slot: 25
    material: COMPASS
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Location</gradient>"
    lore:
      - "{letters_black}NPC setting"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:map} {letters}World{letters_black}: {info}%world%"
      - "  {letters_black}· {info}{icon:compass} {letters}Position{letters_black}: {info}%xyz%"
      - "  {letters_black}· {info}{icon:compass} {letters}Facing{letters_black}: {info}%yaw%° {letters_black}· {info}%pitch%°"
      - ""
      - "{primary}» Left-click {letters_black}· {letters}exact position and rotation"
      - "{primary}» Right-click {letters_black}· {letters}move here"
      - "{primary}» Shift-left-click {letters_black}· {letters}centre on its block"
      - "{primary}» Shift-right-click {letters_black}· {letters}turn to face me"
    actions:
      - "left: exyliadisplays:npc_location"
      - "right: exyliadisplays:npc_move_here"
      - "shift_left: exyliadisplays:npc_centre"
      - "shift_right: exyliadisplays:npc_face_me"

  teleport:
    slot: 36
    material: ENDER_PEARL
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Teleport</gradient>"
    lore:
      - "{letters_black}NPC action"
      - ""
      - "{primary}✎ Information"
      - " {letters}Go to it, facing it."
      - ""
      - "{primary}» Click to teleport"
    actions:
      - "exyliadisplays:npc_teleport"

  clone:
    slot: 37
    material: PAPER
    name: "{letters}NPC {letters_black}▸ <gradient:{success}:{success_light}>Duplicate</gradient>"
    lore:
      - "{letters_black}NPC action"
      - ""
      - "{success}✎ Information"
      - " {letters}A copy under a new name,"
      - " {letters}in the same place."
      - ""
      - "{success}» Click to duplicate"
    actions:
      - "exyliadisplays:npc_clone"

  adjust:
    slot: 38
    material: SPYGLASS
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Fine adjust</gradient>"
    lore:
      - "{letters_black}NPC action"
      - ""
      - "{primary}✎ Information"
      - " {letters}Move, turn and scale it with the"
      - " {highlight}mouse wheel {letters}while you look at it."
      - ""
      - "{primary}✦ Controls"
      - "  {letters_black}· {letters}Scroll{letters_black}: {info}change the value"
      - "  {letters_black}· {letters}Sneak + scroll{letters_black}: {info}step size"
      - "  {letters_black}· {letters}F{letters_black}: {info}next axis"
      - "  {letters_black}· {letters}Sneak + click{letters_black}: {info}snap"
      - "  {letters_black}· {letters}Click{letters_black}: {info}save"
      - ""
      - "{primary}» Click to start"
    actions:
      - "exyliadisplays:npc_adjust"

  back:
    slot: 40
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Back {letters_black}▸ <gradient:{error}:{error_light}>NPCs</gradient>"
    lore:
      - "{error}» Click to go back"
    actions:
      - "exyliadisplays:npc_open_list"

  undo:
    slot: 42
    material: CLOCK
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Undo</gradient>"
    lore:
      - "{letters_black}NPC action"
      - ""
      - "{primary}✎ Information"
      - " {letters}Takes back the last change, made"
      - " {letters}here, by command or in the file."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:iron} {letters}Changes to undo{letters_black}: {info}%npc_undo%"
      - ""
      - "{primary}» Click to undo"
    actions:
      - "exyliadisplays:npc_undo"

  delete:
    slot: 44
    material: BARRIER
    name: "{letters}NPC {letters_black}▸ <gradient:{error}:{error_light}>Delete</gradient>"
    lore:
      - "{letters_black}Danger zone"
      - ""
      - "{error}✎ Information"
      - " {letters}Removes it for good."
      - ""
      - "{error}» Click to delete"
      - "{letters_black}You will be asked to confirm."
    actions:
      - "exyliadisplays:npc_delete"
