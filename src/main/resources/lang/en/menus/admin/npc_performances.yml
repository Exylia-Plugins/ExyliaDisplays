# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The performances one NPC can play: ExyliaEmotes' solo emotes and the animation files in
# plugins/ExyliaDisplays/animations. A row goes on one of its triggers, or is tried on it.

title: "{primary}&lPERFORMANCES {letters_black}» {highlight}%npc_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No more performances"
    lore:
      - "{letters_black}Install {highlight}ExyliaEmotes{letters_black}, or drop animation"
      - "{letters_black}files in {highlight}plugins/ExyliaDisplays/animations{letters_black}."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← First page"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Last page →"

pagination:
  slots: '0-35'

  item_template:
    material: "%perf_icon%"
    name: "{letters}Performance {letters_black}▸ %perf_name%"
    lore:
      - "{letters_black}NPC performance"
      - ""
      - "{info}✦ Information"
      - "  {letters_black}· {info}{icon:tag} {letters}Kind{letters_black}: %perf_kind%"
      - "  {letters_black}· {info}{icon:quill} {letters}Written{letters_black}: {info}%perf_value%"
      - ""
      - "{info}{icon:click} Left-click {letters_black}· {letters}put it on a trigger"
      - "{info}{icon:right_click} Right-click {letters_black}· {letters}try it now"
    actions:
      - "left: exyliadisplays:npc_perform_pick"
      - "right: exyliadisplays:npc_perform_try"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{error}:{error_light}>← Previous</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{success}:{success_light}>Next →</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  info:
    slot: 45
    material: BOOK
    name: "<gradient:{primary}:{secondary_light}>Performances</gradient>"
    lore:
      - "{letters_black}Overview"
      - ""
      - "{primary}✦ Information"
      - "  {letters_black}· {info}{icon:iron} {letters}Available{letters_black}: {info}%perf_count%"
      - ""
      - "{primary}✎ Tip"
      - " {letters}A performance is a"
      - " {letters}whole-body animation. It"
      - " {letters}plays for players within"
      - " {info}%anim_perform_range% {letters}blocks;"
      - " {letters}a sitting NPC never performs."

  playback:
    slot: 46
    material: JUKEBOX
    name: "{letters}Performances {letters_black}▸ <gradient:{primary}:{secondary_light}>Playback</gradient>"
    lore:
      - "{letters_black}NPC setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Paused, it plays nothing on"
      - " {letters}its own: no idle, greeting or"
      - " {letters}click animation. Clicks and"
      - " {letters}their actions still work."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}State{letters_black}: %npc_motion%"
      - "  {letters_black}· {info}{icon:note} {letters}Performing now{letters_black}: %npc_performing%"
      - ""
      - "{primary}{icon:click} Left-click {letters_black}· {letters}pause or resume"
      - "{primary}{icon:right_click} Right-click {letters_black}· {letters}stop what it plays"
    actions:
      - "left: exyliadisplays:npc_playback_toggle"
      - "right: exyliadisplays:npc_stop"

  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Back {letters_black}▸ <gradient:{error}:{error_light}>NPC</gradient>"
    lore:
      - "{error}{icon:click} Click to go back"
    actions:
      - "exyliadisplays:npc_open_hub"
