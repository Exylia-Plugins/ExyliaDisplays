# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The performances one NPC can play: ExyliaEmotes' solo emotes and the animation files in
# plugins/ExyliaDisplays/animations. A row goes on one of its triggers, or is tried on it.

title: "{primary}&lPERFORMANCES {letters_black}» {highlight}%npc_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No more performances"
    lore:
      - ""
      - " {letters_black}▎ {letters}Install {highlight}ExyliaEmotes{letters}, or drop animation"
      - " {letters_black}▎ {letters}files in {highlight}plugins/ExyliaDisplays/animations{letters}."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%perf_icon%"
    name: "%perf_name%"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Kind {letters_black}» %perf_kind%"
      - " {letters_black}▎ {letters}Written {letters_black}» {info}%perf_value%"
      - ""
      - "{warning}➥ Left-click {letters_black}» {letters}put it on a trigger"
      - "{warning}➥ Right-click {letters_black}» {letters}try it now"
      - ""
    actions:
      - "left: exyliadisplays:npc_perform_pick"
      - "right: exyliadisplays:npc_perform_try"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - ""
        - " {letters_black}▎ {letters}Page {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lNEXT PAGE →'
      lore:
        - ""
        - " {letters_black}▎ {letters}Page {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - 'next_page'

items:
  info:
    slot: 45
    material: BOOK
    name: "{primary}&lPERFORMANCES"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Available {letters_black}» {info}%perf_count%"
      - ""
      - "{secondary}Tip:"
      - " {letters_black}▎ {letters}A performance is a whole-body"
      - " {letters_black}▎ {letters}animation. It plays for players within"
      - " {letters_black}▎ {info}%anim_perform_range% {letters}blocks; a sitting NPC"
      - " {letters_black}▎ {letters}never performs."
      - ""

  playback:
    slot: 46
    material: JUKEBOX
    name: "{primary}&lPLAYBACK"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Paused, it plays nothing on its own:"
      - " {letters_black}▎ {letters}no idle, greeting or click animation."
      - " {letters_black}▎ {letters}Clicks and their actions still work."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}State {letters_black}» %npc_motion%"
      - " {letters_black}▎ {letters}Performing now {letters_black}» %npc_performing%"
      - ""
      - "{warning}➥ Left-click {letters_black}» {letters}pause or resume"
      - "{warning}➥ Right-click {letters_black}» {letters}stop what it plays"
      - ""
    actions:
      - "left: exyliadisplays:npc_playback_toggle"
      - "right: exyliadisplays:npc_stop"

  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - ""
      - " {letters_black}▎ {letters}Returns to the NPC."
      - ""
      - "{warning}➥ Click to go back"
      - ""
    actions:
      - "exyliadisplays:npc_open_hub"
