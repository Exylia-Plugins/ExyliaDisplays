# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Every NPC on this server, and the button that creates a new one.

title: "{primary}&lNPCS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No more NPCs"
    lore:
      - ""
      - " {letters_black}▎ {letters}Create one to see it listed here."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%npc_icon%"
    name: "{primary}&l%npc_name%"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Label {letters_black}» %npc_preview%"
      - " {letters_black}▎ {letters}Skin {letters_black}» %npc_skin%"
      - " {letters_black}▎ {letters}World {letters_black}» {info}%npc_world%"
      - " {letters_black}▎ {letters}Position {letters_black}» {info}%npc_xyz%"
      - " {letters_black}▎ {letters}On click {letters_black}» %npc_actions%"
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}State {letters_black}» %npc_status%"
      - ""
      - "{warning}➥ Left-click {letters_black}» {letters}edit"
      - "{warning}➥ Shift-left-click {letters_black}» {letters}teleport"
      - "{error}➥ Right-click {letters_black}» {letters}delete"
      - ""
    actions:
      - "left: exyliadisplays:npc_edit"
      - "shift_left: exyliadisplays:npc_row_teleport"
      - "right: exyliadisplays:npc_row_delete"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - ""
        - " {letters_black}▎ {letters}Page {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lNEXT PAGE →'
      lore:
        - ""
        - " {letters_black}▎ {letters}Page {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - 'next_page'

items:
  create:
    slot: 45
    material: NETHER_STAR
    name: "{primary}&lCREATE NPC"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}A new NPC where you stand, from"
      - " {letters_black}▎ {letters}a {highlight}ready-made start {letters}and a skin."
      - ""
      - "{warning}➥ Click to create"
      - ""
    actions:
      - "exyliadisplays:npc_create"

  info:
    slot: 49
    material: BOOK
    name: "{primary}&lNPCS"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}NPCs {letters_black}» {info}%npc_count%"
      - ""
      - "{secondary}Tip:"
      - " {letters_black}▎ {letters}Everything here is also in"
      - " {letters_black}▎ {highlight}npcs.yml{letters}, and saving that"
      - " {letters_black}▎ {letters}file applies it at once."
      - ""
