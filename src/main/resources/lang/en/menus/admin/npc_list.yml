# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Every NPC on this server, and the button that creates a new one.

title: "{primary}&lNPCS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No more NPCs"
    lore:
      - "{letters_black}Create one to see it listed here."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%npc_icon%"
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>%npc_name%</gradient>"
    lore:
      - "{letters_black}NPC"
      - ""
      - "{primary}✦ Information"
      - "  {letters_black}· {info}{icon:sign} {letters}Label{letters_black}: %npc_preview%"
      - "  {letters_black}· {info}{icon:tag} {letters}Skin{letters_black}: %npc_skin%"
      - "  {letters_black}· {info}{icon:map} {letters}World{letters_black}: {info}%npc_world%"
      - "  {letters_black}· {info}{icon:compass} {letters}Position{letters_black}: {info}%npc_xyz%"
      - "  {letters_black}· {info}{icon:book} {letters}On click{letters_black}: %npc_actions%"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}State{letters_black}: %npc_status%"
      - ""
      - "{primary}» Left-click {letters_black}· {letters}edit"
      - "{primary}» Shift-left-click {letters_black}· {letters}teleport"
      - "{error}» Right-click {letters_black}· {letters}delete"
      - "{letters_black}You will be asked to confirm."
    actions:
      - "left: exyliadisplays:npc_edit"
      - "shift_left: exyliadisplays:npc_row_teleport"
      - "right: exyliadisplays:npc_row_delete"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{error}:{error_light}>← Previous</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{success}:{success_light}>Next →</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  create:
    slot: 45
    material: NETHER_STAR
    name: "{letters}NPCs {letters_black}▸ <gradient:{success}:{success_light}>Create NPC</gradient>"
    lore:
      - "{letters_black}New NPC"
      - ""
      - "{success}✎ Information"
      - " {letters}A new NPC where you stand, from"
      - " {letters}a {highlight}ready-made start {letters}and a skin."
      - ""
      - "{success}» Click to create"
    actions:
      - "exyliadisplays:npc_create"

  info:
    slot: 49
    material: BOOK
    name: "<gradient:{primary}:{secondary_light}>NPCs</gradient>"
    lore:
      - "{letters_black}Overview"
      - ""
      - "{primary}✦ Information"
      - "  {letters_black}· {info}{icon:iron} {letters}NPCs{letters_black}: {info}%npc_count%"
      - ""
      - "{primary}✎ Tip"
      - " {letters}Everything here is also in"
      - " {highlight}npcs.yml{letters}, and saving that"
      - " {letters}file applies it at once."

  settings:
    slot: 53
    material: "COMPARATOR"
    name: "{letters}Displays {letters_black}▸ <gradient:{primary}:{secondary_light}>Settings</gradient>"
    lore:
      - "{letters_black}Plugin settings"
      - ""
      - "{primary}✎ Information"
      - " {letters}Change this plugin's settings"
      - " {letters}without editing its {highlight}files{letters}."
      - ""
      - "{primary}» Click {letters_black}· {letters}Open settings"
    actions:
      - "exyliadisplays:npc_settings"
