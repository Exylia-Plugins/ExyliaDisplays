      lore:
        - ""
        - " {letters_black}▎ {letters}Page {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - 'next_page'

items:
  create:
    slot: 45
    material: NETHER_STAR
    name: "{primary}&lCREATE HOLOGRAM"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}A new hologram where you stand,"
      - " {letters_black}▎ {letters}from a {highlight}ready-made start{letters}."
      - ""
      - "{warning}➥ Click to create"
      - ""
    actions:
      - "exyliaholograms:create"

  info:
    slot: 49
    material: BOOK
    name: "{primary}&lHOLOGRAMS"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Holograms {letters_black}» {info}%holo_count%"
      - ""
      - "{secondary}Tip:"
      - " {letters_black}▎ {letters}Everything here is also in"
      - " {letters_black}▎ {highlight}holograms.yml{letters}, and saving that"
      - " {letters_black}▎ {letters}file applies it at once."
      - ""
