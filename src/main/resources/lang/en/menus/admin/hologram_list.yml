# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Every hologram on this server, and the button that creates a new one.

title: "{primary}&lHOLOGRAMS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No more holograms"
    lore:
      - ""
      - " {letters_black}▎ {letters}Create one to see it listed here."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%holo_icon%"
    name: "{primary}&l%holo_name%"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Reads {letters_black}» %holo_preview%"
      - " {letters_black}▎ {letters}World {letters_black}» {info}%holo_world%"
      - " {letters_black}▎ {letters}Position {letters_black}» {info}%holo_xyz%"
      - " {letters_black}▎ {letters}Lines {letters_black}» {info}%holo_lines%"
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}State {letters_black}» %holo_status%"
      - ""
      - "{warning}➥ Left-click {letters_black}» {letters}edit"
      - "{warning}➥ Shift-left-click {letters_black}» {letters}teleport"
      - "{error}➥ Right-click {letters_black}» {letters}delete"
      - ""
    actions:
      - "left: exyliaholograms:edit"
      - "shift_left: exyliaholograms:row_teleport"
      - "right: exyliaholograms:row_delete"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - ""
        - " {letters_black}▎ {letters}Page {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
