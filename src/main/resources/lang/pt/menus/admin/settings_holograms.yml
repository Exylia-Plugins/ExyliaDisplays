# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The hologram settings an admin tunes. Everything else is in config.yml.

title: "{primary}&lCONFIGURAÇÕES {letters_black}» {highlight}Hologramas"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: NAME_TAG
    name: "<gradient:{primary}:{secondary_light}>Hologramas</gradient>"
    lore:
      - "{letters_black}Configurações · Hologramas"
      - ""
      - "{primary}✎ Informações"
      - " {letters}Onde aparecem os hologramas"
      - " {letters}novos e de que distância"
      - " {letters}são vistos."

  holograms-spawn-height:
    slot: 12
    material: LADDER
    name: "{letters}Hologramas {letters_black}▸ <gradient:{primary}:{secondary_light}>Altura inicial</gradient>"
    lore:
      - "{letters_black}Hologramas · configuração"
      - ""
      - "{primary}✎ Informações"
      - " {letters}A quantos blocos acima dos seus"
      - " {letters}pés surge um novo holograma."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:map} {letters}Altura{letters_black}: %holograms_holograms_spawn_height%"
      - "  {letters_black}· {info}{icon:book} {letters}Padrão{letters_black}: %holograms_holograms_spawn_height_default%"
      - ""
      - "%holograms_holograms_spawn_height_click%"
    actions:
      - "exyliadisplays:setting holograms holograms.spawn-height"

  holograms-default-view-distance:
    slot: 13
    material: SPYGLASS
    name: "{letters}Hologramas {letters_black}▸ <gradient:{primary}:{secondary_light}>Distância de visão</gradient>"
    lore:
      - "{letters_black}Hologramas · configuração"
      - ""
      - "{primary}✎ Informações"
      - " {letters}De que distância um novo"
      - " {letters}holograma é visto, em blocos."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:compass} {letters}Distância{letters_black}: %holograms_holograms_default_view_distance%"
      - "  {letters_black}· {info}{icon:book} {letters}Padrão{letters_black}: %holograms_holograms_default_view_distance_default%"
      - ""
      - "%holograms_holograms_default_view_distance_click%"
    actions:
      - "exyliadisplays:setting holograms holograms.default-view-distance"

  holograms-near-radius:
    slot: 14
    material: COMPASS
    name: "{letters}Hologramas {letters_black}▸ <gradient:{primary}:{secondary_light}>Raio próximo</gradient>"
    lore:
      - "{letters_black}Hologramas · configuração"
      - ""
      - "{primary}✎ Informações"
      - " {letters}O raio de {highlight}/holoadmin near"
      - " {letters}{letters}quando nenhum é indicado."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:compass} {letters}Raio{letters_black}: %holograms_holograms_near_radius%"
      - "  {letters_black}· {info}{icon:book} {letters}Padrão{letters_black}: %holograms_holograms_near_radius_default%"
      - ""
      - "%holograms_holograms_near_radius_click%"
    actions:
      - "exyliadisplays:setting holograms holograms.near-radius"

