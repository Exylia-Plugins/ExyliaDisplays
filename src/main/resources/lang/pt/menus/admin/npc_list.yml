# NÃO EDITE — REGENERADO A CADA INICIALIZAÇÃO.
#
# Todos os NPCs deste servidor e o botão que cria um novo.

title: "{primary}&lNPCS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Não há mais NPCs"
    lore:
      - "{letters_black}Crie um para vê-lo listado aqui."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Primeira página"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Última página →"

pagination:
  slots: '0-35'

  item_template:
    material: "%npc_icon%"
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>%npc_name%</gradient>"
    lore:
      - "{letters_black}NPC"
      - ""
      - "{primary}✦ Informações"
      - "  {letters_black}· {info}{icon:sign} {letters}Rótulo{letters_black}: %npc_preview%"
      - "  {letters_black}· {info}{icon:tag} {letters}Skin{letters_black}: %npc_skin%"
      - "  {letters_black}· {info}{icon:map} {letters}Mundo{letters_black}: {info}%npc_world%"
      - "  {letters_black}· {info}{icon:compass} {letters}Posição{letters_black}: {info}%npc_xyz%"
      - "  {letters_black}· {info}{icon:book} {letters}Ao clicar{letters_black}: %npc_actions%"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Estado{letters_black}: %npc_status%"
      - ""
      - "{primary}{icon:click} Clique esquerdo {letters_black}· {letters}editar"
      - "{primary}{icon:click} Shift + clique esquerdo {letters_black}· {letters}teleportar"
      - "{error}{icon:right_click} Clique direito {letters_black}· {letters}excluir"
      - "{letters_black}Você precisará confirmar."
    actions:
      - "left: exyliadisplays:npc_edit"
      - "shift_left: exyliadisplays:npc_row_teleport"
      - "right: exyliadisplays:npc_row_delete"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{error}:{error_light}>← Anterior</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{success}:{success_light}>Próxima →</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  create:
    slot: 45
    material: NETHER_STAR
    name: "{letters}NPCs {letters_black}▸ <gradient:{success}:{success_light}>Criar NPC</gradient>"
    lore:
      - "{letters_black}Novo NPC"
      - ""
      - "{success}✎ Informações"
      - " {letters}Um novo NPC onde você está, com"
      - " {letters}um {highlight}modelo pronto {letters}e uma skin."
      - ""
      - "{success}{icon:click} Clique para criar"
    actions:
      - "exyliadisplays:npc_create"

  info:
    slot: 49
    material: BOOK
    name: "<gradient:{primary}:{secondary_light}>NPCs</gradient>"
    lore:
      - "{letters_black}Visão geral"
      - ""
      - "{primary}✦ Informações"
      - "  {letters_black}· {info}{icon:iron} {letters}NPCs{letters_black}: {info}%npc_count%"
      - ""
      - "{primary}✎ Dica"
      - " {letters}Tudo aqui também está em"
      - " {highlight}npcs.yml{letters}, e salvar esse"
      - " {letters}arquivo aplica na hora."

  settings:
    slot: 53
    material: "COMPARATOR"
    name: "{letters}Displays {letters_black}▸ <gradient:{primary}:{secondary_light}>Configurações</gradient>"
    lore:
      - "{letters_black}Ajustes do plugin"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Altera as configurações do"
      - " {letters}plugin sem editar seus {highlight}arquivos{letters}."
      - ""
      - "{primary}{icon:click} Clique {letters_black}· {letters}Abrir configurações"
    actions:
      - "exyliadisplays:npc_settings"
