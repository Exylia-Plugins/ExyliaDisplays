# NÃO EDITE — REGENERADO A CADA INICIALIZAÇÃO.
#
# O que um NPC veste e segura: um card por slot, preenchido com o item da sua mão.

title: "{primary}&lEQUIPAMENTO {letters_black}» {highlight}%npc_name%"
size: 36
type: SIMPLE

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
