# NÃO EDITE — REGENERADO A CADA INICIALIZAÇÃO.
#
# O que um NPC veste e segura: um card por slot, preenchido com o item da sua mão.

title: "{primary}&lEQUIPAMENTO {letters_black}» {highlight}%npc_name%"
size: 36
type: SIMPLE

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: "%npc_icon%"
    name: "<gradient:{primary}:{secondary_light}>%npc_name%</gradient>"
    lore:
      - "{letters_black}Equipamento do NPC"
      - ""
      - "{primary}✎ Informações"
      - " {letters}Segure um item e clique num slot"
      - " {letters}para equipá-lo. Itens encantados,"
      - " {letters}tingidos e custom mantêm o visual."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:armor} {letters}Veste{letters_black}: %equipment%"

  head:
    slot: 10
    material: "%npc_eq_head%"
    name: "{letters}Equipamento {letters_black}▸ <gradient:{primary}:{secondary_light}>Cabeça</gradient>"
    lore:
      - "{letters_black}Espaço de equipamento"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:armor} {letters}Slot{letters_black}: %npc_eq_head_state%"
      - ""
      - "{primary}» Clique esquerdo {letters_black}· {letters}vestir o item da sua mão"
      - "{error}» Clique direito {letters_black}· {letters}esvaziar"
    actions:
      - "left: exyliadisplays:npc_equip head"
      - "right: exyliadisplays:npc_unequip head"

