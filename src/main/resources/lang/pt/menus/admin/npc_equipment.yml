    slot: 4
    material: "%npc_icon%"
    name: "{primary}&l%npc_name%"
    lore:
      - ""
      - "{secondary}Informações:"
      - " {letters_black}▎ {letters}Segure um item e clique num slot"
      - " {letters_black}▎ {letters}para equipá-lo. Itens encantados,"
      - " {letters_black}▎ {letters}tingidos e custom mantêm o visual."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Veste {letters_black}» %equipment%"
      - ""

  head:
    slot: 10
    material: "%npc_eq_head%"
    name: "{primary}&lCABEÇA"
    lore:
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Slot {letters_black}» %npc_eq_head_state%"
      - ""
      - "{warning}➥ Clique esquerdo {letters_black}» {letters}vestir o item da sua mão"
      - "{error}➥ Clique direito {letters_black}» {letters}esvaziar"
