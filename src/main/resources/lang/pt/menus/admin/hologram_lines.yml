# NÃO EDITE — REGENERADO A CADA INICIALIZAÇÃO.
#
# As linhas de um holograma, de cima para baixo.

title: "{primary}&lLINHAS {letters_black}» {highlight}%holo_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Não há mais linhas"
    lore:
      - "{letters_black}Adicione texto, item, bloco ou cabeça abaixo."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%line_icon%"
    name: "{letters}Linha {letters_black}▸ <gradient:{primary}:{secondary_light}>#%line_number%</gradient>"
    lore:
      - "{letters_black}Linha do holograma"
      - ""
      - "{primary}✎ Texto"
      - " {letters}%line_text%"
      - ""
      - "{primary}✦ Tags"
      - " {info}%line_tags%%line_style%"
      - ""
      - "{primary}» Clique esquerdo {letters_black}· {letters}editar texto"
      - "{primary}» Clique direito {letters_black}· {letters}estilo, movimento, visibilidade"
      - "{primary}» Shift + clique esquerdo {letters_black}· {letters}subir"
      - "{primary}» Shift + clique direito {letters_black}· {letters}descer"
      - "{primary}» F {letters_black}· {letters}duplicar"
      - "{error}» Q {letters_black}· {letters}remover"
      - "{letters_black}Você precisará confirmar."
    actions:
      - "left: exyliadisplays:holo_line_text"
      - "right: exyliadisplays:holo_line_style"
      - "shift_left: exyliadisplays:holo_line_up"
      - "shift_right: exyliadisplays:holo_line_down"
      - "swap: exyliadisplays:holo_line_duplicate"
      - "drop: exyliadisplays:holo_line_delete"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{error}:{error_light}>← Anterior</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{success}:{success_light}>Próxima →</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  add-text:
    slot: 45
    material: OAK_SIGN
    name: "{letters}Linhas {letters_black}▸ <gradient:{success}:{success_light}>Adicionar texto</gradient>"
    lore:
      - "{letters_black}Nova linha"
      - ""
      - "{success}✎ Informações"
      - " {letters}Uma nova linha no final."
      - ""
      - "{success}» Clique para escrever"
    actions:
      - "exyliadisplays:holo_add_line"

  add-item:
    slot: 46
    material: ITEM_FRAME
    name: "{letters}Linhas {letters_black}▸ <gradient:{success}:{success_light}>Adicionar item</gradient>"
    lore:
      - "{letters_black}Nova linha"
      - ""
      - "{success}✎ Informações"
      - " {letters}Um item flutuante,"
      - " {letters}virado para o jogador."
      - ""
      - "{success}» Clique para escolher"
    actions:
      - "exyliadisplays:holo_add_item"

  add-block:
    slot: 47
    material: GRASS_BLOCK
    name: "{letters}Linhas {letters_black}▸ <gradient:{success}:{success_light}>Adicionar bloco</gradient>"
    lore:
      - "{letters_black}Nova linha"
      - ""
      - "{success}✎ Informações"
      - " {letters}Um bloco flutuante; dê {highlight}giro"
      - " {letters}no estilo dele para girá-lo."
      - ""
      - "{success}» Clique para escolher"
    actions:
      - "exyliadisplays:holo_add_block"

  add-head:
    slot: 51
    material: PLAYER_HEAD
    name: "{letters}Linhas {letters_black}▸ <gradient:{success}:{success_light}>Adicionar cabeça</gradient>"
    lore:
      - "{letters_black}Nova linha"
      - ""
      - "{success}✎ Informações"
      - " {letters}Uma cabeça de jogador, por"
      - " {letters}nome, UUID, textura ou URL"
      - " {letters}de skin. Deixe-a pequena"
      - " {letters}ou grande com o {highlight}tamanho{letters}."
      - ""
      - "{success}» Clique para escolher"
    actions:
      - "exyliadisplays:holo_add_head"

  pages:
    slot: 52
    material: BOOK
    name: "{letters}Linhas {letters_black}▸ <gradient:{primary}:{secondary_light}>Página</gradient> {letters_black}[{info}%holo_page%{letters_black}/{info}%holo_pages%{letters_black}]"
    lore:
      - "{letters_black}Páginas do holograma"
      - ""
      - "{primary}✎ Informações"
      - " {letters}Cada jogador vê uma página por"
      - " {letters}vez; um clique {highlight}[PAGE] next {letters}a vira."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:paper} {letters}Editando{letters_black}: {info}página %holo_page%"
      - "  {letters_black}· {info}{icon:clock} {letters}Vira a cada{letters_black}: {info}%holo_page_interval% ticks"
      - ""
      - "{primary}» Clique esquerdo {letters_black}· {letters}próxima página"
      - "{primary}» Clique direito {letters_black}· {letters}página anterior"
      - "{primary}» Shift + clique esquerdo {letters_black}· {letters}adicionar página"
      - "{primary}» Shift + clique direito {letters_black}· {letters}ações de clique da página"
      - "{error}» Q {letters_black}· {letters}remover esta página"
      - "{letters_black}Será pedida uma confirmação."
    actions:
      - "left: exyliadisplays:holo_page_next"
      - "right: exyliadisplays:holo_page_previous"
      - "shift_left: exyliadisplays:holo_page_add"
      - "shift_right: exyliadisplays:holo_page_click"
      - "drop: exyliadisplays:holo_page_delete"

  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Voltar {letters_black}▸ <gradient:{error}:{error_light}>Holograma</gradient>"
    lore:
      - "{error}» Clique para voltar"
    actions:
      - "exyliadisplays:holo_open_hub"

  all-lines:
    slot: 53
    material: WRITABLE_BOOK
    name: "{letters}Linhas {letters_black}▸ <gradient:{primary}:{secondary_light}>Editar tudo de uma vez</gradient>"
    lore:
      - "{letters_black}Ação do holograma"
      - ""
      - "{primary}✎ Informações"
      - " {letters}Todas as linhas numa caixa, uma"
      - " {letters}por linha: o jeito mais rápido de"
      - " {letters}escrever um holograma, com tags."
      - ""
      - "{primary}» Clique para abrir"
    actions:
      - "exyliadisplays:holo_all_lines"
