# NÃO EDITE — REGENERADO A CADA INICIALIZAÇÃO.
#
# As performances que um NPC pode fazer: os emotes solo do ExyliaEmotes e os arquivos de animação em
# plugins/ExyliaDisplays/animations. Cada item vai para um dos seus gatilhos ou é testado nele.

title: "{primary}&lPERFORMANCES {letters_black}» {highlight}%npc_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Não há mais performances"
    lore:
      - "{letters_black}Instale o {highlight}ExyliaEmotes{letters_black} ou coloque arquivos"
      - "{letters_black}de animação em {highlight}plugins/ExyliaDisplays/animations{letters_black}."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Primeira página"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Última página →"

pagination:
  slots: '0-35'

  item_template:
    material: "%perf_icon%"
    name: "{letters}Performance {letters_black}▸ %perf_name%"
    lore:
      - "{letters_black}Performance do NPC"
      - ""
      - "{info}✦ Informações"
      - "  {letters_black}· {info}{icon:tag} {letters}Tipo{letters_black}: %perf_kind%"
      - "  {letters_black}· {info}{icon:quill} {letters}Escrito{letters_black}: {info}%perf_value%"
      - ""
      - "{info}{icon:click} Clique esquerdo {letters_black}· {letters}colocar num gatilho"
      - "{info}{icon:right_click} Clique direito {letters_black}· {letters}testar agora"
    actions:
      - "left: exyliadisplays:npc_perform_pick"
      - "right: exyliadisplays:npc_perform_try"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{error}:{error_light}>← Anterior</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{success}:{success_light}>Próxima →</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  info:
    slot: 45
    material: BOOK
    name: "<gradient:{primary}:{secondary_light}>Performances</gradient>"
    lore:
      - "{letters_black}Visão geral"
      - ""
      - "{primary}✦ Informações"
      - "  {letters_black}· {info}{icon:iron} {letters}Disponíveis{letters_black}: {info}%perf_count%"
      - ""
      - "{primary}✎ Dica"
      - " {letters}Uma performance é uma"
      - " {letters}animação de corpo inteiro."
      - " {letters}Toca para jogadores a até"
      - " {info}%anim_perform_range%"
      - " {letters}blocos; um NPC sentado"
      - " {letters}nunca faz performances."

  playback:
    slot: 46
    material: JUKEBOX
    name: "{letters}Performances {letters_black}▸ <gradient:{primary}:{secondary_light}>Reprodução</gradient>"
    lore:
      - "{letters_black}Ajuste do NPC"
      - ""
      - "{primary}✎ Informações"
      - " {letters}Pausado, não toca nada sozinho:"
      - " {letters}nem idle, nem saudação, nem"
      - " {letters}animação de clique. Cliques e"
      - " {letters}suas ações continuam funcionando."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Estado{letters_black}: %npc_motion%"
      - "  {letters_black}· {info}{icon:note} {letters}Em performance{letters_black}: %npc_performing%"
      - ""
      - "{primary}{icon:click} Clique esquerdo {letters_black}· {letters}pausar ou retomar"
      - "{primary}{icon:right_click} Clique direito {letters_black}· {letters}parar o que toca"
    actions:
      - "left: exyliadisplays:npc_playback_toggle"
      - "right: exyliadisplays:npc_stop"

  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Voltar {letters_black}▸ <gradient:{error}:{error_light}>NPC</gradient>"
    lore:
      - "{error}{icon:click} Clique para voltar"
    actions:
      - "exyliadisplays:npc_open_hub"
