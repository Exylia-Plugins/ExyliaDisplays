# NÃO EDITE — REGENERADO A CADA INICIALIZAÇÃO.
#
# Um NPC: seu estado e um card para cada parte dele.

title: "{primary}&lNPC {letters_black}» {highlight}%npc_name%"
size: 45
type: SIMPLE

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: "%npc_icon%"
    name: "{primary}&l%npc_name%"
    lore:
      - ""
      - "{secondary}Informações:"
      - " {letters_black}▎ {letters}Rótulo {letters_black}» %npc_preview%"
      - " {letters_black}▎ {letters}Skin {letters_black}» %skin%"
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Estado {letters_black}» %status%"
      - " {letters_black}▎ {letters}Vendo agora {letters_black}» {info}%npc_viewers% {letters}jogadores"
      - ""
      - "{warning}➥ Clique esquerdo {letters_black}» {letters}mostrar ou ocultar"
      - "{warning}➥ Clique direito {letters_black}» {letters}renomear"
      - ""
    actions:
      - "left: exyliadisplays:npc_toggle"
      - "right: exyliadisplays:npc_rename"

  appearance:
    slot: 19
    material: ARMOR_STAND
    name: "{primary}&lAPARÊNCIA"
    lore:
      - ""
      - "{secondary}Informações:"
      - " {letters_black}▎ {letters}Sua skin, pose, tamanho e contorno."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Skin {letters_black}» %skin%"
      - " {letters_black}▎ {letters}Pose {letters_black}» {info}%pose%"
      - " {letters_black}▎ {letters}Escala {letters_black}» {info}%scale%"
      - " {letters_black}▎ {letters}Brilho {letters_black}» %glow%"
      - ""
      - "{warning}➥ Clique esquerdo {letters_black}» {letters}skin"
      - "{warning}➥ Clique direito {letters_black}» {letters}pose, tamanho, contorno e sentar"
      - ""
    actions:
      - "left: exyliadisplays:npc_appearance"
      - "right: exyliadisplays:npc_appearance_body"

  equipment:
    slot: 20
    material: DIAMOND_CHESTPLATE
    name: "{primary}&lEQUIPAMENTO"
    lore:
      - ""
      - "{secondary}Informações:"
      - " {letters_black}▎ {letters}O que ele veste e segura, tirado"
      - " {letters_black}▎ {letters}do item na {highlight}sua mão{letters}."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Veste {letters_black}» %equipment%"
      - ""
      - "{warning}➥ Clique para abrir"
      - ""
    actions:
      - "exyliadisplays:npc_open_equipment"

  label:
    slot: 21
    material: NAME_TAG
    name: "{primary}&lRÓTULO"
    lore:
      - ""
      - "{secondary}Informações:"
      - " {letters_black}▎ {letters}As linhas sobre a cabeça, com"
      - " {letters_black}▎ {letters}toda {highlight}tag de holograma{letters}, ou um"
      - " {letters_black}▎ {letters}holograma inteiro que o segue."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Rótulo {letters_black}» %label%"
      - " {letters_black}▎ {letters}Espaço {letters_black}» {info}%npc_height% {letters}blocos"
      - " {letters_black}▎ {letters}Holograma {letters_black}» %link%"
      - ""
      - "{warning}➥ Clique esquerdo {letters_black}» {letters}editar o rótulo"
      - "{warning}➥ Clique direito {letters_black}» {letters}vincular um holograma"
      - ""
    actions:
      - "left: exyliadisplays:npc_label"
      - "right: exyliadisplays:npc_link"

  animations:
    slot: 22
    material: FEATHER
    name: "{primary}&lANIMAÇÕES"
    lore:
      - ""
      - "{secondary}Informações:"
      - " {letters_black}▎ {letters}Gestos que faz: {highlight}acenar{letters}, {highlight}assentir{letters},"
      - " {letters_black}▎ {highlight}reverência{letters}... ou uma {highlight}performance{letters} completa,"
      - " {letters_black}▎ {letters}ao clicar, sozinho, ou para saudar"
      - " {letters_black}▎ {letters}um jogador que se aproxima."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Clique esquerdo {letters_black}» %anim_left%"
      - " {letters_black}▎ {letters}Clique direito {letters_black}» %anim_right%"
      - " {letters_black}▎ {letters}Sozinho {letters_black}» %anim_idle% {letters_black}· {info}%anim_idle_every% ⌚"
      - " {letters_black}▎ {letters}Saudar {letters_black}» %anim_greet% {letters_black}· {info}%anim_greet_range% {letters}blocos"
      - " {letters_black}▎ {letters}Sentado {letters_black}» %sitting%"
      - " {letters_black}▎ {letters}Performances até {letters_black}» {info}%anim_perform_range% {letters}blocos"
      - " {letters_black}▎ {letters}Idle em loop {letters_black}» %anim_idle_continuous%"
      - " {letters_black}▎ {letters}Grupo {letters_black}» %group%"
      - " {letters_black}▎ {letters}Estado {letters_black}» %npc_motion%"
      - ""
      - "{warning}➥ Clique esquerdo {letters_black}» {letters}o que um clique toca"
      - "{warning}➥ Clique direito {letters_black}» {letters}idle, saudação e grupo"
      - "{warning}➥ Shift + clique esquerdo {letters_black}» {letters}escolher performance"
      - "{warning}➥ Shift + clique direito {letters_black}» {letters}pausar ou retomar"
      - ""
    actions:
      - "left: exyliadisplays:npc_animations"
      - "right: exyliadisplays:npc_animations_auto"
      - "shift_left: exyliadisplays:npc_open_performances"
      - "shift_right: exyliadisplays:npc_pause_toggle"

  interactions:
    slot: 23
    material: LEVER
    name: "{primary}&lINTERAÇÕES"
    lore:
      - ""
      - "{secondary}Informações:"
      - " {letters_black}▎ {letters}O que um clique faz: enviar a um servidor,"
      - " {letters_black}▎ {letters}rodar comandos, {highlight}falar {letters}num balão,"
      - " {letters_black}▎ {letters}golpear, com {highlight}esquerdo {letters}e {highlight}direito {letters}separados."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Ao clicar {letters_black}» %actions%"
      - " {letters_black}▎ {letters}Usado por {letters_black}» %use_permission%"
      - " {letters_black}▎ {letters}Cooldown {letters_black}» {info}%cooldown%s ⌚"
      - " {letters_black}▎ {letters}Vira para quem clica {letters_black}» %face_clicker%"
      - ""
      - "{warning}➥ Clique esquerdo {letters_black}» {letters}o que um clique faz"
      - "{warning}➥ Clique direito {letters_black}» {letters}quem pode usar e com que frequência"
      - ""
    actions:
      - "left: exyliadisplays:npc_interactions"
      - "right: exyliadisplays:npc_interactions_rules"

  visibility:
    slot: 24
    material: ENDER_EYE
    name: "{primary}&lVISIBILIDADE"
    lore:
      - ""
      - "{secondary}Informações:"
      - " {letters_black}▎ {letters}Para onde a cabeça vira, quem o"
      - " {letters_black}▎ {letters}vê e de que distância."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Olha {letters_black}» {info}%look%"
      - " {letters_black}▎ {letters}Alcance do giro {letters_black}» {info}%look_range% {letters}blocos"
      - " {letters_black}▎ {letters}Visto por {letters_black}» %permission%"
      - " {letters_black}▎ {letters}Distância {letters_black}» {info}%view_distance% {letters}blocos"
      - ""
      - "{warning}➥ Clique para editar"
      - ""
    actions:
      - "exyliadisplays:npc_visibility"

  location:
    slot: 25
    material: COMPASS
    name: "{primary}&lLOCALIZAÇÃO"
    lore:
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Mundo {letters_black}» {info}%world%"
      - " {letters_black}▎ {letters}Posição {letters_black}» {info}%xyz%"
      - " {letters_black}▎ {letters}Orientação {letters_black}» {info}%yaw%° {letters_black}· {info}%pitch%°"
      - ""
      - "{warning}➥ Clique esquerdo {letters_black}» {letters}posição e rotação exatas"
      - "{warning}➥ Clique direito {letters_black}» {letters}mover para cá"
      - "{warning}➥ Shift + clique esquerdo {letters_black}» {letters}centralizar no bloco"
      - "{warning}➥ Shift + clique direito {letters_black}» {letters}virar para mim"
      - ""
    actions:
      - "left: exyliadisplays:npc_location"
      - "right: exyliadisplays:npc_move_here"
      - "shift_left: exyliadisplays:npc_centre"
      - "shift_right: exyliadisplays:npc_face_me"

  teleport:
    slot: 36
    material: ENDER_PEARL
    name: "{primary}&lTELEPORTAR"
    lore:
      - ""
      - " {letters_black}▎ {letters}Vá até ele, de frente para ele."
      - ""
      - "{warning}➥ Clique para teleportar"
      - ""
    actions:
      - "exyliadisplays:npc_teleport"

  clone:
    slot: 37
    material: PAPER
    name: "{primary}&lDUPLICAR"
    lore:
      - ""
      - " {letters_black}▎ {letters}Uma cópia com um novo nome,"
      - " {letters_black}▎ {letters}no mesmo lugar."
      - ""
      - "{warning}➥ Clique para duplicar"
      - ""
    actions:
      - "exyliadisplays:npc_clone"

  adjust:
    slot: 38
    material: SPYGLASS
    name: "{primary}&lAJUSTE FINO"
    lore:
      - ""
      - "{secondary}Informações:"
      - " {letters_black}▎ {letters}Mova, gire e redimensione com a"
      - " {letters_black}▎ {highlight}roda do mouse {letters}enquanto olha para ele."
      - ""
      - "{secondary}Controles:"
      - " {letters_black}▎ {letters}Rolar {letters_black}» {info}mudar o valor"
      - " {letters_black}▎ {letters}Agachar + rolar {letters_black}» {info}tamanho do passo"
      - " {letters_black}▎ {letters}F {letters_black}» {info}próximo eixo"
      - " {letters_black}▎ {letters}Agachar + clique {letters_black}» {info}encaixar"
      - " {letters_black}▎ {letters}Clique {letters_black}» {info}salvar"
      - ""
      - "{warning}➥ Clique para começar"
      - ""
    actions:
      - "exyliadisplays:npc_adjust"

  back:
    slot: 40
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lVOLTAR'
    lore:
      - ""
      - " {letters_black}▎ {letters}Volta para todos os NPCs."
      - ""
      - "{warning}➥ Clique para voltar"
      - ""
    actions:
      - "exyliadisplays:npc_open_list"

  undo:
    slot: 42
    material: CLOCK
    name: "{primary}&lDESFAZER"
    lore:
      - ""
      - "{secondary}Informações:"
      - " {letters_black}▎ {letters}Desfaz a última mudança, feita"
      - " {letters_black}▎ {letters}aqui, por comando ou no arquivo."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Mudanças para desfazer {letters_black}» {info}%npc_undo%"
      - ""
      - "{warning}➥ Clique para desfazer"
      - ""
    actions:
      - "exyliadisplays:npc_undo"

  delete:
    slot: 44
    material: BARRIER
    name: "{error}&lEXCLUIR"
    lore:
      - ""
      - " {letters_black}▎ {letters}Remove de vez."
      - " {letters_black}Será pedida uma confirmação."
      - ""
      - "{error}➥ Clique para excluir"
      - ""
    actions:
      - "exyliadisplays:npc_delete"
