# NÃO EDITE — REGENERADO A CADA INICIALIZAÇÃO.
#
# Um NPC: seu estado e um card para cada parte dele.

title: "{primary}&lNPC {letters_black}» {highlight}%npc_name%"
size: 45
type: SIMPLE

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: "%npc_icon%"
    name: "<gradient:{primary}:{secondary_light}>%npc_name%</gradient>"
    lore:
      - "{letters_black}Status do NPC"
      - ""
      - "{primary}✦ Informações"
      - "  {letters_black}· {info}{icon:sign} {letters}Rótulo{letters_black}: %npc_preview%"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Estado{letters_black}: %status%"
      - "  {letters_black}· {info}{icon:eye} {letters}Vendo agora{letters_black}: {info}%npc_viewers% {letters}jogadores"
      - ""
      - "{primary}» Clique esquerdo {letters_black}· {letters}mostrar ou ocultar"
      - "{primary}» Clique direito {letters_black}· {letters}renomear"
    actions:
      - "left: exyliadisplays:npc_toggle"
      - "right: exyliadisplays:npc_rename"

  appearance:
    slot: 19
    material: ARMOR_STAND
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Aparência</gradient>"
    lore:
      - "{letters_black}Ajuste do NPC"
      - ""
      - "{primary}✎ Informações"
      - " {letters}Sua skin, pose, tamanho e contorno."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:tag} {letters}Skin{letters_black}: %skin%"
      - "  {letters_black}· {info}{icon:tag} {letters}Pose{letters_black}: {info}%pose%"
      - "  {letters_black}· {info}{icon:iron} {letters}Escala{letters_black}: {info}%scale%"
      - "  {letters_black}· {info}{icon:glint} {letters}Brilho{letters_black}: %glow%"
      - ""
      - "{primary}» Clique esquerdo {letters_black}· {letters}skin"
      - "{primary}» Clique direito {letters_black}· {letters}pose, tamanho, contorno e sentar"
    actions:
      - "left: exyliadisplays:npc_appearance"
      - "right: exyliadisplays:npc_appearance_body"

  equipment:
    slot: 20
    material: DIAMOND_CHESTPLATE
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Equipamento</gradient>"
    lore:
      - "{letters_black}Ajuste do NPC"
      - ""
      - "{primary}✎ Informações"
      - " {letters}O que ele veste e segura,"
      - " {letters}tirado do item na {highlight}sua mão{letters}."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:armor} {letters}Veste{letters_black}: %equipment%"
      - ""
      - "{primary}» Clique para abrir"
    actions:
      - "exyliadisplays:npc_open_equipment"

  label:
    slot: 21
    material: NAME_TAG
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Rótulo</gradient>"
    lore:
      - "{letters_black}Ajuste do NPC"
      - ""
      - "{primary}✎ Informações"
      - " {letters}As linhas sobre a cabeça, com"
      - " {letters}toda {highlight}tag de holograma{letters}, ou um"
      - " {letters}holograma inteiro que o segue."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:sign} {letters}Rótulo{letters_black}: %label%"
      - "  {letters_black}· {info}{icon:iron} {letters}Espaço{letters_black}: {info}%npc_height% {letters}blocos"
      - "  {letters_black}· {letters}Holograma{letters_black}: %link%"
      - ""
      - "{primary}» Clique esquerdo {letters_black}· {letters}editar o rótulo"
      - "{primary}» Clique direito {letters_black}· {letters}vincular um holograma"
    actions:
      - "left: exyliadisplays:npc_label"
      - "right: exyliadisplays:npc_link"

  animations:
    slot: 22
    material: FEATHER
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Animações</gradient>"
    lore:
      - "{letters_black}Ajuste do NPC"
      - ""
      - "{primary}✎ Informações"
      - " {letters}Gestos que faz: {highlight}acenar{letters}, {highlight}assentir{letters},"
      - " {highlight}reverência{letters}... ou uma"
      - " {highlight}performance{letters} completa, ao"
      - " {letters}clicar, sozinho, ou para saudar"
      - " {letters}um jogador que se aproxima."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {letters}Clique esquerdo{letters_black}: %anim_left%"
      - "  {letters_black}· {letters}Clique direito{letters_black}: %anim_right%"
      - "  {letters_black}· {info}{icon:note} {letters}Sozinho{letters_black}: %anim_idle% {letters_black}· {info}%anim_idle_every% ⌚"
      - "  {letters_black}· {info}{icon:note} {letters}Saudar{letters_black}: %anim_greet% {letters_black}· {info}%anim_greet_range% {letters}blocos"
      - "  {letters_black}· {info}{icon:check} {letters}Sentado{letters_black}: %sitting%"
      - "  {letters_black}· {info}{icon:compass} {letters}Performances até{letters_black}: {info}%anim_perform_range% {letters}blocos"
      - "  {letters_black}· {info}{icon:note} {letters}Idle em loop{letters_black}: %anim_idle_continuous%"
      - "  {letters_black}· {info}{icon:tag} {letters}Grupo{letters_black}: %group%"
      - "  {letters_black}· {info}{icon:redstone} {letters}Estado{letters_black}: %npc_motion%"
      - ""
      - "{primary}» Clique esquerdo {letters_black}· {letters}o que um clique toca"
      - "{primary}» Clique direito {letters_black}· {letters}idle, saudação e grupo"
      - "{primary}» Shift + clique esquerdo {letters_black}· {letters}escolher performance"
      - "{primary}» Shift + clique direito {letters_black}· {letters}pausar ou retomar"
    actions:
      - "left: exyliadisplays:npc_animations"
      - "right: exyliadisplays:npc_animations_auto"
      - "shift_left: exyliadisplays:npc_open_performances"
      - "shift_right: exyliadisplays:npc_pause_toggle"

  interactions:
    slot: 23
    material: LEVER
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Interações</gradient>"
    lore:
      - "{letters_black}Ajuste do NPC"
      - ""
      - "{primary}✎ Informações"
      - " {letters}O que um clique faz: enviar a"
      - " {letters}um servidor, rodar comandos,"
      - " {highlight}falar {letters}num balão, golpear, com"
      - " {highlight}esquerdo {letters}e {highlight}direito {letters}separados."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:book} {letters}Ao clicar{letters_black}: %actions%"
      - "  {letters_black}· {info}{icon:tag} {letters}Usado por{letters_black}: %use_permission%"
      - "  {letters_black}· {info}{icon:clock} {letters}Cooldown{letters_black}: {info}%cooldown%s"
      - "  {letters_black}· {info}{icon:check} {letters}Vira para quem clica{letters_black}: %face_clicker%"
      - ""
      - "{primary}» Clique esquerdo {letters_black}· {letters}o que um clique faz"
      - "{primary}» Clique direito {letters_black}· {letters}quem pode usar e com que frequência"
    actions:
      - "left: exyliadisplays:npc_interactions"
      - "right: exyliadisplays:npc_interactions_rules"

  visibility:
    slot: 24
    material: ENDER_EYE
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Visibilidade</gradient>"
    lore:
      - "{letters_black}Ajuste do NPC"
      - ""
      - "{primary}✎ Informações"
      - " {letters}Para onde a cabeça vira, quem"
      - " {letters}o vê e de que distância."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:eye} {letters}Olha{letters_black}: {info}%look%"
      - "  {letters_black}· {info}{icon:compass} {letters}Alcance do giro{letters_black}: {info}%look_range% {letters}blocos"
      - "  {letters_black}· {info}{icon:key} {letters}Visto por{letters_black}: %permission%"
      - "  {letters_black}· {info}{icon:compass} {letters}Distância{letters_black}: {info}%view_distance% {letters}blocos"
      - ""
      - "{primary}» Clique para editar"
    actions:
      - "exyliadisplays:npc_visibility"

  location:
    slot: 25
    material: COMPASS
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Localização</gradient>"
    lore:
      - "{letters_black}Ajuste do NPC"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:map} {letters}Mundo{letters_black}: {info}%world%"
      - "  {letters_black}· {info}{icon:compass} {letters}Posição{letters_black}: {info}%xyz%"
      - "  {letters_black}· {info}{icon:compass} {letters}Orientação{letters_black}: {info}%yaw%° {letters_black}· {info}%pitch%°"
      - ""
      - "{primary}» Clique esquerdo {letters_black}· {letters}posição e rotação exatas"
      - "{primary}» Clique direito {letters_black}· {letters}mover para cá"
      - "{primary}» Shift + clique esquerdo {letters_black}· {letters}centralizar no bloco"
      - "{primary}» Shift + clique direito {letters_black}· {letters}virar para mim"
    actions:
      - "left: exyliadisplays:npc_location"
      - "right: exyliadisplays:npc_move_here"
      - "shift_left: exyliadisplays:npc_centre"
      - "shift_right: exyliadisplays:npc_face_me"

  teleport:
    slot: 36
    material: ENDER_PEARL
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Teleportar</gradient>"
    lore:
      - "{letters_black}Ação do NPC"
      - ""
      - "{primary}✎ Informações"
      - " {letters}Vá até ele, de frente para ele."
      - ""
      - "{primary}» Clique para teleportar"
    actions:
      - "exyliadisplays:npc_teleport"

  clone:
    slot: 37
    material: PAPER
    name: "{letters}NPC {letters_black}▸ <gradient:{success}:{success_light}>Duplicar</gradient>"
    lore:
      - "{letters_black}Ação do NPC"
      - ""
      - "{success}✎ Informações"
      - " {letters}Uma cópia com um novo"
      - " {letters}nome, no mesmo lugar."
      - ""
      - "{success}» Clique para duplicar"
    actions:
      - "exyliadisplays:npc_clone"

  adjust:
    slot: 38
    material: SPYGLASS
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Ajuste fino</gradient>"
    lore:
      - "{letters_black}Ação do NPC"
      - ""
      - "{primary}✎ Informações"
      - " {letters}Mova, gire e redimensione com a"
      - " {highlight}roda do mouse {letters}enquanto"
      - " {letters}olha para ele."
      - ""
      - "{primary}✦ Controles"
      - "  {letters_black}· {letters}Rolar{letters_black}: {info}mudar o valor"
      - "  {letters_black}· {letters}Agachar + rolar{letters_black}: {info}tamanho do passo"
      - "  {letters_black}· {letters}F{letters_black}: {info}próximo eixo"
      - "  {letters_black}· {letters}Agachar + clique{letters_black}: {info}encaixar"
      - "  {letters_black}· {letters}Clique{letters_black}: {info}salvar"
      - ""
      - "{primary}» Clique para começar"
    actions:
      - "exyliadisplays:npc_adjust"

  back:
    slot: 40
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Voltar {letters_black}▸ <gradient:{error}:{error_light}>NPCs</gradient>"
    lore:
      - "{error}» Clique para voltar"
    actions:
      - "exyliadisplays:npc_open_list"

  undo:
    slot: 42
    material: CLOCK
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>Desfazer</gradient>"
    lore:
      - "{letters_black}Ação do NPC"
      - ""
      - "{primary}✎ Informações"
      - " {letters}Desfaz a última mudança, feita"
      - " {letters}aqui, por comando ou no arquivo."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:iron} {letters}Mudanças para desfazer{letters_black}: {info}%npc_undo%"
      - ""
      - "{primary}» Clique para desfazer"
    actions:
      - "exyliadisplays:npc_undo"

  delete:
    slot: 44
    material: BARRIER
    name: "{letters}NPC {letters_black}▸ <gradient:{error}:{error_light}>Excluir</gradient>"
    lore:
      - "{letters_black}Zona de perigo"
      - ""
      - "{error}✎ Informações"
      - " {letters}Remove de vez."
      - ""
      - "{error}» Clique para excluir"
      - "{letters_black}Será pedida uma confirmação."
    actions:
      - "exyliadisplays:npc_delete"
