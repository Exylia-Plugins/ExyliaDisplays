# NÃO EDITE — REGENERADO A CADA INICIALIZAÇÃO.
#
# Todos os hologramas deste servidor e o botão que cria um novo.

title: "{primary}&lHOLOGRAMAS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Não há mais hologramas"
    lore:
      - ""
      - " {letters_black}▎ {letters}Crie um para vê-lo listado aqui."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%holo_icon%"
    name: "{primary}&l%holo_name%"
    lore:
      - ""
      - "{secondary}Informações:"
      - " {letters_black}▎ {letters}Texto {letters_black}» %holo_preview%"
      - " {letters_black}▎ {letters}Mundo {letters_black}» {info}%holo_world%"
      - " {letters_black}▎ {letters}Posição {letters_black}» {info}%holo_xyz%"
      - " {letters_black}▎ {letters}Linhas {letters_black}» {info}%holo_lines%"
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Estado {letters_black}» %holo_status%"
      - ""
      - "{warning}➥ Clique esquerdo {letters_black}» {letters}editar"
      - "{warning}➥ Shift + clique esquerdo {letters_black}» {letters}teleportar"
      - "{error}➥ Clique direito {letters_black}» {letters}excluir"
      - ""
    actions:
      - "left: exyliadisplays:holo_edit"
      - "shift_left: exyliadisplays:holo_row_teleport"
      - "right: exyliadisplays:holo_row_delete"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PÁGINA ANTERIOR'
      lore:
        - ""
        - " {letters_black}▎ {letters}Página {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lPRÓXIMA PÁGINA →'
      lore:
        - ""
        - " {letters_black}▎ {letters}Página {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - 'next_page'

items:
  create:
    slot: 45
    material: NETHER_STAR
    name: "{primary}&lCRIAR HOLOGRAMA"
    lore:
      - ""
      - "{secondary}Informações:"
      - " {letters_black}▎ {letters}Um novo holograma onde você está,"
      - " {letters_black}▎ {letters}a partir de um {highlight}modelo pronto{letters}."
      - ""
      - "{warning}➥ Clique para criar"
      - ""
    actions:
      - "exyliadisplays:holo_create"

  info:
    slot: 49
    material: BOOK
    name: "{primary}&lHOLOGRAMAS"
    lore:
      - ""
      - "{secondary}Informações:"
      - " {letters_black}▎ {letters}Hologramas {letters_black}» {info}%holo_count%"
      - ""
      - "{secondary}Dica:"
      - " {letters_black}▎ {letters}Tudo aqui também está em"
      - " {letters_black}▎ {highlight}holograms.yml{letters}, e salvar esse"
      - " {letters_black}▎ {letters}arquivo aplica na hora."
      - ""
