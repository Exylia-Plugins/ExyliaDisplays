# NÃO EDITE — REGENERADO A CADA INICIALIZAÇÃO.
#
# Todos os hologramas deste servidor e o botão que cria um novo.

title: "{primary}&lHOLOGRAMAS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Não há mais hologramas"
    lore:
      - "{letters_black}Crie um para vê-lo listado aqui."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%holo_icon%"
    name: "{letters}Holograma {letters_black}▸ <gradient:{primary}:{secondary_light}>%holo_name%</gradient>"
    lore:
      - "{letters_black}Holograma"
      - ""
      - "{primary}✦ Informações"
      - "  {letters_black}· {info}{icon:sign} {letters}Texto{letters_black}: %holo_preview%"
      - "  {letters_black}· {info}{icon:map} {letters}Mundo{letters_black}: {info}%holo_world%"
      - "  {letters_black}· {info}{icon:compass} {letters}Posição{letters_black}: {info}%holo_xyz%"
      - "  {letters_black}· {info}{icon:book} {letters}Linhas{letters_black}: {info}%holo_lines%"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Estado{letters_black}: %holo_status%"
      - ""
      - "{primary}» Clique esquerdo {letters_black}· {letters}editar"
      - "{primary}» Shift + clique esquerdo {letters_black}· {letters}teleportar"
      - "{error}» Clique direito {letters_black}· {letters}excluir"
      - "{letters_black}Você precisará confirmar."
    actions:
      - "left: exyliadisplays:holo_edit"
      - "shift_left: exyliadisplays:holo_row_teleport"
      - "right: exyliadisplays:holo_row_delete"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{error}:{error_light}>← Anterior</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{success}:{success_light}>Próxima →</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  create:
    slot: 45
    material: NETHER_STAR
    name: "{letters}Hologramas {letters_black}▸ <gradient:{success}:{success_light}>Criar holograma</gradient>"
    lore:
      - "{letters_black}Novo holograma"
      - ""
      - "{success}✎ Informações"
      - " {letters}Um novo holograma onde você está,"
      - " {letters}a partir de um {highlight}modelo pronto{letters}."
      - ""
      - "{success}» Clique para criar"
    actions:
      - "exyliadisplays:holo_create"

  info:
    slot: 49
    material: BOOK
    name: "<gradient:{primary}:{secondary_light}>Hologramas</gradient>"
    lore:
      - "{letters_black}Visão geral"
      - ""
      - "{primary}✦ Informações"
      - "  {letters_black}· {info}{icon:iron} {letters}Hologramas{letters_black}: {info}%holo_count%"
      - ""
      - "{primary}✎ Dica"
      - " {letters}Tudo aqui também está em"
      - " {highlight}holograms.yml{letters}, e salvar esse"
      - " {letters}arquivo aplica na hora."

  settings:
    slot: 53
    material: "COMPARATOR"
    name: "{letters}Displays {letters_black}▸ <gradient:{primary}:{secondary_light}>Configurações</gradient>"
    lore:
      - "{letters_black}Ajustes do plugin"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Altera as configurações do"
      - " {letters}plugin sem editar seus {highlight}arquivos{letters}."
      - ""
      - "{primary}» Clique {letters_black}· {letters}Abrir configurações"
    actions:
      - "exyliadisplays:holo_settings"
