# NÃO EDITE — REGENERADO A CADA INICIALIZAÇÃO.
#
# Um holograma: seu estado e um card para cada parte dele.

title: "{primary}&lHOLOGRAMA {letters_black}» {highlight}%holo_name%"
size: 45
type: SIMPLE

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: "%holo_toggle_icon%"
    name: "{primary}&l%holo_name%"
    lore:
      - ""
      - "{secondary}Informações:"
      - " {letters_black}▎ {letters}Texto {letters_black}» %holo_preview%"
      - " {letters_black}▎ {letters}Linhas {letters_black}» {info}%lines%"
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Estado {letters_black}» %status%"
      - ""
      - "{warning}➥ Clique esquerdo {letters_black}» {letters}mostrar ou ocultar"
      - "{warning}➥ Clique direito {letters_black}» {letters}renomear"
      - ""
    actions:
      - "left: exyliadisplays:holo_toggle"
      - "right: exyliadisplays:holo_rename"

  lines:
    slot: 19
    material: WRITABLE_BOOK
    name: "{primary}&lLINHAS"
    lore:
      - ""
      - "{secondary}Informações:"
      - " {letters_black}▎ {letters}Textos, itens e blocos, cada um com"
      - " {letters_black}▎ {highlight}tamanho{letters}, {highlight}movimento {letters}e {highlight}quem vê{letters}."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Linhas {letters_black}» {info}%lines%"
      - ""
      - "{warning}➥ Clique para editar"
      - ""
    actions:
      - "exyliadisplays:holo_open_lines"

  appearance:
    slot: 20
    material: GLOW_INK_SAC
    name: "{primary}&lAPARÊNCIA"
    lore:
      - ""
      - "{secondary}Informações:"
      - " {letters_black}▎ {letters}Como o holograma inteiro é exibido."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Orientação {letters_black}» {info}%holo_billboard%"
      - " {letters_black}▎ {letters}Escala {letters_black}» {info}%holo_scale%"
      - " {letters_black}▎ {letters}Espaçamento {letters_black}» {info}%holo_spacing%"
      - " {letters_black}▎ {letters}Sombra {letters_black}» %holo_shadow%"
      - ""
      - "{warning}➥ Clique esquerdo {letters_black}» {letters}forma e tamanho"
      - "{warning}➥ Clique direito {letters_black}» {letters}cor e luz"
      - ""
    actions:
      - "left: exyliadisplays:holo_appearance"
      - "right: exyliadisplays:holo_appearance_light"

  distance:
    slot: 21
    material: TARGET
    name: "{primary}&lTAMANHO POR DISTÂNCIA"
    lore:
      - ""
      - "{secondary}Informações:"
      - " {letters_black}▎ {letters}Cresce com a distância de quem vê,"
      - " {letters_black}▎ {letters}para ficar {highlight}legível {letters}de longe."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Cresce {letters_black}» %holo_distance%"
      - ""
      - "{warning}➥ Clique para editar"
      - ""
    actions:
      - "exyliadisplays:holo_distance_scale"

  visibility:
    slot: 22
    material: ENDER_EYE
    name: "{primary}&lVISIBILIDADE"
    lore:
      - ""
      - "{secondary}Informações:"
      - " {letters_black}▎ {letters}Quem vê, de que distância e"
      - " {letters_black}▎ {letters}com que frequência atualiza."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Visto por {letters_black}» %permission%"
      - " {letters_black}▎ {letters}Distância {letters_black}» {info}%view_distance%"
      - " {letters_black}▎ {letters}Por jogador {letters_black}» %per_player%"
      - " {letters_black}▎ {letters}Atualização {letters_black}» {info}%holo_interval% {letters}ticks"
      - " {letters_black}▎ {letters}Jogadores {letters_black}» %visibility%"
      - ""
      - "{warning}➥ Clique esquerdo {letters_black}» {letters}editar"
      - "{warning}➥ Clique direito {letters_black}» {letters}todos ou só jogadores escolhidos"
      - ""
    actions:
      - "left: exyliadisplays:holo_visibility"
      - "right: exyliadisplays:holo_visibility_mode"

  click:
    slot: 23
    material: LEVER
    name: "{primary}&lAÇÕES DE CLIQUE"
    lore:
      - ""
      - "{secondary}Informações:"
      - " {letters_black}▎ {letters}O que um clique faz, o visual do {highlight}painel"
      - " {letters_black}▎ {highlight}de botões {letters}e os {highlight}botões {letters}que linhas"
      - " {letters_black}▎ {letters}soltas usam com {highlight}<button:name>{letters}."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Ao clicar {letters_black}» %click%"
      - " {letters_black}▎ {letters}Visual {letters_black}» %holo_click_style%"
      - " {letters_black}▎ {letters}Botões {letters_black}» %holo_buttons%"
      - " {letters_black}▎ {letters}Cresce até {letters_black}» {info}%holo_hover%x"
      - ""
      - "{warning}➥ Clique esquerdo {letters_black}» {letters}ações"
      - "{warning}➥ Clique direito {letters_black}» {letters}visual e som"
      - "{warning}➥ Shift + clique {letters_black}» {letters}botões"
      - ""
    actions:
      - "left: exyliadisplays:holo_click"
      - "right: exyliadisplays:holo_click_look"
      - "shift_left: exyliadisplays:holo_buttons"
      - "shift_right: exyliadisplays:holo_buttons"

  location:
    slot: 24
    material: COMPASS
    name: "{primary}&lLOCALIZAÇÃO"
    lore:
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Mundo {letters_black}» {info}%world%"
      - " {letters_black}▎ {letters}Posição {letters_black}» {info}%xyz%"
      - " {letters_black}▎ {letters}Orientação {letters_black}» {info}%facing%"
      - ""
      - "{warning}➥ Clique esquerdo {letters_black}» {letters}posição e rotação exatas"
      - "{warning}➥ Clique direito {letters_black}» {letters}mover para cá"
      - "{warning}➥ Shift + clique esquerdo {letters_black}» {letters}centralizar no bloco"
      - "{warning}➥ Shift + clique direito {letters_black}» {letters}virar para mim"
      - ""
    actions:
      - "left: exyliadisplays:holo_location"
      - "right: exyliadisplays:holo_move_here"
      - "shift_left: exyliadisplays:holo_centre"
      - "shift_right: exyliadisplays:holo_face"

  attach:
    slot: 25
    material: LEAD
    name: "{primary}&lPRESO A"
    lore:
      - ""
      - "{secondary}Informações:"
      - " {letters_black}▎ {letters}Monta em um {highlight}jogador {letters}ou {highlight}mob{letters},"
      - " {letters_black}▎ {letters}seguindo-o aonde ele for."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Monta em {letters_black}» %attached%"
      - " {letters_black}▎ {letters}Altura {letters_black}» {info}%attach_offset%"
      - ""
      - "{warning}➥ Clique esquerdo {letters_black}» {letters}escolher onde monta"
      - "{warning}➥ Clique direito {letters_black}» {letters}voltar à sua posição"
      - ""
    actions:
      - "left: exyliadisplays:holo_attach"
      - "right: exyliadisplays:holo_detach"

  teleport:
    slot: 36
    material: ENDER_PEARL
    name: "{primary}&lTELEPORTAR"
    lore:
      - ""
      - " {letters_black}▎ {letters}Vá até ele, de frente para ele."
      - ""
      - "{warning}➥ Clique para teleportar"
      - ""
    actions:
      - "exyliadisplays:holo_teleport"

  clone:
    slot: 37
    material: PAPER
    name: "{primary}&lDUPLICAR"
    lore:
      - ""
      - " {letters_black}▎ {letters}Uma cópia com um novo nome,"
      - " {letters_black}▎ {letters}no mesmo lugar."
      - ""
      - "{warning}➥ Clique para duplicar"
      - ""
    actions:
      - "exyliadisplays:holo_clone"

  adjust:
    slot: 38
    material: SPYGLASS
    name: "{primary}&lAJUSTE FINO"
    lore:
      - ""
      - "{secondary}Informações:"
      - " {letters_black}▎ {letters}Mova, gire e redimensione com a"
      - " {letters_black}▎ {highlight}roda do mouse {letters}enquanto olha para ele."
      - ""
      - "{secondary}Controles:"
      - " {letters_black}▎ {letters}Rolar {letters_black}» {info}mudar o valor"
      - " {letters_black}▎ {letters}Agachar + rolar {letters_black}» {info}tamanho do passo"
      - " {letters_black}▎ {letters}F {letters_black}» {info}próximo eixo"
      - " {letters_black}▎ {letters}Agachar + clique {letters_black}» {info}encaixar"
      - " {letters_black}▎ {letters}Clique {letters_black}» {info}salvar"
      - ""
      - "{warning}➥ Clique para começar"
      - ""
    actions:
      - "exyliadisplays:holo_adjust"

  back:
    slot: 40
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lVOLTAR'
    lore:
      - ""
      - " {letters_black}▎ {letters}Volta para todos os hologramas."
      - ""
      - "{warning}➥ Clique para voltar"
      - ""
    actions:
      - "exyliadisplays:holo_open_list"

  templates:
    slot: 41
    material: PAINTING
    name: "{primary}&lMODELOS"
    lore:
      - ""
      - "{secondary}Informações:"
      - " {letters_black}▎ {letters}Guarde este visual para reutilizar,"
      - " {letters_black}▎ {letters}ou aplique um já salvo."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Modelos salvos {letters_black}» {info}%holo_templates%"
      - ""
      - "{warning}➥ Clique esquerdo {letters_black}» {letters}salvar este visual"
      - "{warning}➥ Clique direito {letters_black}» {letters}aplicar um modelo"
      - ""
    actions:
      - "left: exyliadisplays:holo_template_save"
      - "right: exyliadisplays:holo_template_apply"

  undo:
    slot: 42
    material: CLOCK
    name: "{primary}&lDESFAZER"
    lore:
      - ""
      - "{secondary}Informações:"
      - " {letters_black}▎ {letters}Desfaz a última mudança, feita"
      - " {letters_black}▎ {letters}aqui, por comando ou no arquivo."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Mudanças para desfazer {letters_black}» {info}%holo_undo%"
      - ""
      - "{warning}➥ Clique para desfazer"
      - ""
    actions:
      - "exyliadisplays:holo_undo"

  delete:
    slot: 44
    material: BARRIER
    name: "{error}&lEXCLUIR"
    lore:
      - ""
      - " {letters_black}▎ {letters}Remove de vez."
      - " {letters_black}Será pedida uma confirmação."
      - ""
      - "{error}➥ Clique para excluir"
      - ""
    actions:
      - "exyliadisplays:holo_delete"
