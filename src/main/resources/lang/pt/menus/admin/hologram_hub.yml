# NÃO EDITE — REGENERADO A CADA INICIALIZAÇÃO.
#
# Um holograma: seu estado e um card para cada parte dele.

title: "{primary}&lHOLOGRAMA {letters_black}» {highlight}%holo_name%"
size: 36
type: SIMPLE

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: "%holo_toggle_icon%"
    name: "<gradient:{primary}:{secondary_light}>%holo_name%</gradient>"
    lore:
      - "{letters_black}Status do holograma"
      - ""
      - "{primary}✦ Informações"
      - "  {letters_black}· {info}{icon:sign} {letters}Texto{letters_black}: %holo_preview%"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Estado{letters_black}: %status%"
      - "  {letters_black}· {info}{icon:eye} {letters}Vendo agora{letters_black}: {info}%holo_viewers% {letters}jogadores"
      - ""
      - "{primary}{icon:click} Clique esquerdo {letters_black}· {letters}mostrar ou ocultar"
      - "{primary}{icon:right_click} Clique direito {letters_black}· {letters}renomear"
    actions:
      - "left: exyliadisplays:holo_toggle"
      - "right: exyliadisplays:holo_rename"

  lines:
    slot: 11
    material: WRITABLE_BOOK
    name: "{letters}Holograma {letters_black}▸ <gradient:{primary}:{secondary_light}>Linhas</gradient>"
    lore:
      - "{letters_black}Ajuste do holograma"
      - ""
      - "{primary}✎ Informações"
      - " {letters}Textos, itens e blocos, cada um com"
      - " {highlight}tamanho{letters}, {highlight}movimento {letters}e {highlight}quem vê{letters}."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:book} {letters}Linhas{letters_black}: {info}%lines%"
      - ""
      - "{primary}{icon:click} Clique para editar"
    actions:
      - "exyliadisplays:holo_open_lines"

  appearance:
    slot: 12
    material: GLOW_INK_SAC
    name: "{letters}Holograma {letters_black}▸ <gradient:{primary}:{secondary_light}>Aparência</gradient>"
    lore:
      - "{letters_black}Ajuste do holograma"
      - ""
      - "{primary}✎ Informações"
      - " {letters}Como o holograma inteiro é exibido."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:compass} {letters}Orientação{letters_black}: {info}%holo_billboard%"
      - "  {letters_black}· {info}{icon:iron} {letters}Escala{letters_black}: {info}%holo_scale%"
      - "  {letters_black}· {info}{icon:iron} {letters}Espaçamento{letters_black}: {info}%holo_spacing%"
      - "  {letters_black}· {info}{icon:redstone} {letters}Sombra{letters_black}: %holo_shadow%"
      - ""
      - "{primary}{icon:click} Clique esquerdo {letters_black}· {letters}forma e tamanho"
      - "{primary}{icon:right_click} Clique direito {letters_black}· {letters}cor e luz"
    actions:
      - "left: exyliadisplays:holo_appearance"
      - "right: exyliadisplays:holo_appearance_light"

  distance:
    slot: 14
    material: TARGET
    name: "{letters}Holograma {letters_black}▸ <gradient:{primary}:{secondary_light}>Tamanho por distância</gradient>"
    lore:
      - "{letters_black}Ajuste do holograma"
      - ""
      - "{primary}✎ Informações"
      - " {letters}Cresce com a distância de quem"
      - " {letters}vê, para ficar {highlight}legível {letters}de longe."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:iron} {letters}Cresce{letters_black}: %holo_distance%"
      - ""
      - "{primary}{icon:click} Clique para editar"
    actions:
      - "exyliadisplays:holo_distance_scale"

  visibility:
    slot: 15
    material: ENDER_EYE
    name: "{letters}Holograma {letters_black}▸ <gradient:{primary}:{secondary_light}>Visibilidade</gradient>"
    lore:
      - "{letters_black}Ajuste do holograma"
      - ""
      - "{primary}✎ Informações"
      - " {letters}Quem vê, de que distância e"
      - " {letters}com que frequência atualiza."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:key} {letters}Visto por{letters_black}: %permission%"
      - "  {letters_black}· {info}{icon:compass} {letters}Distância{letters_black}: {info}%view_distance%"
      - "  {letters_black}· {info}{icon:eye} {letters}Por jogador{letters_black}: %per_player%"
      - "  {letters_black}· {info}{icon:clock} {letters}Atualização{letters_black}: {info}%holo_interval% {letters}ticks"
      - "  {letters_black}· {info}{icon:eye} {letters}Jogadores{letters_black}: %visibility%"
      - ""
      - "{primary}{icon:click} Clique esquerdo {letters_black}· {letters}editar"
      - "{primary}{icon:right_click} Clique direito {letters_black}· {letters}todos ou só jogadores escolhidos"
    actions:
      - "left: exyliadisplays:holo_visibility"
      - "right: exyliadisplays:holo_visibility_mode"

  click:
    slot: 20
    material: LEVER
    name: "{letters}Holograma {letters_black}▸ <gradient:{primary}:{secondary_light}>Ações de clique</gradient>"
    lore:
      - "{letters_black}Ajuste do holograma"
      - ""
      - "{primary}✎ Informações"
      - " {letters}O que um clique faz,"
      - " {letters}o visual do {highlight}painel"
      - " {highlight}de botões {letters}e os {highlight}botões {letters}que"
      - " {letters}linhas soltas usam com {highlight}<button:name>{letters}."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:book} {letters}Ao clicar{letters_black}: %click%"
      - "  {letters_black}· {info}{icon:eye} {letters}Visual{letters_black}: %holo_click_style%"
      - "  {letters_black}· {info}{icon:iron} {letters}Botões{letters_black}: %holo_buttons%"
      - "  {letters_black}· {info}{icon:iron} {letters}Cresce até{letters_black}: {info}%holo_hover%x"
      - ""
      - "{primary}{icon:click} Clique esquerdo {letters_black}· {letters}ações"
      - "{primary}{icon:right_click} Clique direito {letters_black}· {letters}visual e som"
      - "{primary}{icon:click} Shift + clique {letters_black}· {letters}botões"
    actions:
      - "left: exyliadisplays:holo_click"
      - "right: exyliadisplays:holo_click_look"
      - "shift_left: exyliadisplays:holo_buttons"
      - "shift_right: exyliadisplays:holo_buttons"

  location:
    slot: 21
    material: COMPASS
    name: "{letters}Holograma {letters_black}▸ <gradient:{primary}:{secondary_light}>Localização</gradient>"
    lore:
      - "{letters_black}Ajuste do holograma"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:map} {letters}Mundo{letters_black}: {info}%world%"
      - "  {letters_black}· {info}{icon:compass} {letters}Posição{letters_black}: {info}%xyz%"
      - "  {letters_black}· {info}{icon:compass} {letters}Orientação{letters_black}: {info}%facing%"
      - ""
      - "{primary}{icon:click} Clique esquerdo {letters_black}· {letters}posição e rotação exatas"
      - "{primary}{icon:right_click} Clique direito {letters_black}· {letters}movê-lo · vá lá e sneak-clique"
      - "{primary}{icon:click} Shift + clique esquerdo {letters_black}· {letters}centralizar no bloco"
      - "{primary}{icon:right_click} Shift + clique direito {letters_black}· {letters}virar para mim"
    actions:
      - "left: exyliadisplays:holo_location"
      - "right: exyliadisplays:holo_move_here"
      - "shift_left: exyliadisplays:holo_centre"
      - "shift_right: exyliadisplays:holo_face"

  attach:
    slot: 23
    material: LEAD
    name: "{letters}Holograma {letters_black}▸ <gradient:{primary}:{secondary_light}>Preso a</gradient>"
    lore:
      - "{letters_black}Ajuste do holograma"
      - ""
      - "{primary}✎ Informações"
      - " {letters}Monta em um {highlight}jogador {letters}ou {highlight}mob{letters},"
      - " {letters}seguindo-o aonde ele for."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:tag} {letters}Monta em{letters_black}: %attached%"
      - "  {letters_black}· {info}{icon:iron} {letters}Altura{letters_black}: {info}%attach_offset%"
      - ""
      - "{primary}{icon:click} Clique esquerdo {letters_black}· {letters}escolher onde monta"
      - "{primary}{icon:right_click} Clique direito {letters_black}· {letters}voltar à sua posição"
    actions:
      - "left: exyliadisplays:holo_attach"
      - "right: exyliadisplays:holo_detach"

  leaderboard:
    slot: 24
    material: GOLDEN_HELMET
    glow: "%holo_board_glow%"
    name: "{letters}Holograma {letters_black}▸ <gradient:{highlight}:{warning_light}>Ranking</gradient>"
    lore:
      - "{letters_black}Ajuste do holograma"
      - ""
      - "{highlight}✎ Informações"
      - " {letters}Transforma em uma {highlight}lista de tops {letters}que"
      - " {letters}guarda seus próprios valores: abates,"
      - " {letters}tempo de jogo, dinheiro e mais."
      - ""
      - "{highlight}✦ Status"
      - "  {letters_black}· {highlight}{icon:star} {letters}Rankings{letters_black}: %holo_board%"
      - "  {letters_black}· {highlight}{icon:book} {letters}Posições{letters_black}: {highlight}%holo_board_rows%"
      - ""
      - "{highlight}{icon:click} Clique esquerdo {letters_black}· {letters}estatísticas, períodos e linhas"
      - "{letters_black}Cada estatística e período é uma página."
      - "{highlight}{icon:right_click} Clique direito {letters_black}· {letters}ligar ou desligar"
      - "{letters_black}Suas próprias linhas ficam guardadas para depois."
    actions:
      - "left: exyliadisplays:holo_leaderboard"
      - "right: exyliadisplays:holo_leaderboard_toggle"

  teleport:
    slot: 27
    material: ENDER_PEARL
    name: "{letters}Holograma {letters_black}▸ <gradient:{primary}:{secondary_light}>Teleportar</gradient>"
    lore:
      - "{letters_black}Ação do holograma"
      - ""
      - "{primary}✎ Informações"
      - " {letters}Vá até ele, de frente para ele."
      - ""
      - "{primary}{icon:click} Clique para teleportar"
    actions:
      - "exyliadisplays:holo_teleport"

  clone:
    slot: 28
    material: PAPER
    name: "{letters}Holograma {letters_black}▸ <gradient:{success}:{success_light}>Duplicar</gradient>"
    lore:
      - "{letters_black}Ação do holograma"
      - ""
      - "{success}✎ Informações"
      - " {letters}Uma cópia com um novo"
      - " {letters}nome, no mesmo lugar."
      - ""
      - "{success}{icon:click} Clique para duplicar"
    actions:
      - "exyliadisplays:holo_clone"

  adjust:
    slot: 29
    material: SPYGLASS
    name: "{letters}Holograma {letters_black}▸ <gradient:{primary}:{secondary_light}>Ajuste fino</gradient>"
    lore:
      - "{letters_black}Ação do holograma"
      - ""
      - "{primary}✎ Informações"
      - " {letters}Mova, gire e redimensione com a"
      - " {highlight}roda do mouse {letters}enquanto"
      - " {letters}olha para ele."
      - ""
      - "{primary}✦ Controles"
      - "  {letters_black}· {letters}Rolar{letters_black}: {info}mudar o valor"
      - "  {letters_black}· {letters}Agachar + rolar{letters_black}: {info}tamanho do passo"
      - "  {letters_black}· {letters}F{letters_black}: {info}próximo eixo"
      - "  {letters_black}· {letters}Agachar + clique{letters_black}: {info}encaixar"
      - "  {letters_black}· {letters}Clique{letters_black}: {info}salvar"
      - ""
      - "{primary}{icon:click} Clique para começar"
    actions:
      - "exyliadisplays:holo_adjust"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Voltar {letters_black}▸ <gradient:{error}:{error_light}>Hologramas</gradient>"
    lore:
      - "{error}{icon:click} Clique para voltar"
    actions:
      - "exyliadisplays:holo_open_list"

  templates:
    slot: 32
    material: PAINTING
    name: "{letters}Holograma {letters_black}▸ <gradient:{primary}:{secondary_light}>Modelos</gradient>"
    lore:
      - "{letters_black}Ajuste do holograma"
      - ""
      - "{primary}✎ Informações"
      - " {letters}Guarde este visual"
      - " {letters}para reutilizar, ou"
      - " {letters}aplique um já salvo."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:book} {letters}Modelos salvos{letters_black}: {info}%holo_templates%"
      - ""
      - "{primary}{icon:click} Clique esquerdo {letters_black}· {letters}salvar este visual"
      - "{primary}{icon:right_click} Clique direito {letters_black}· {letters}aplicar um modelo"
    actions:
      - "left: exyliadisplays:holo_template_save"
      - "right: exyliadisplays:holo_template_apply"

  undo:
    slot: 33
    material: CLOCK
    name: "{letters}Holograma {letters_black}▸ <gradient:{primary}:{secondary_light}>Desfazer</gradient>"
    lore:
      - "{letters_black}Ação do holograma"
      - ""
      - "{primary}✎ Informações"
      - " {letters}Desfaz a última mudança, feita"
      - " {letters}aqui, por comando ou no arquivo."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:iron} {letters}Mudanças para desfazer{letters_black}: {info}%holo_undo%"
      - ""
      - "{primary}{icon:click} Clique para desfazer"
    actions:
      - "exyliadisplays:holo_undo"

  delete:
    slot: 35
    material: BARRIER
    name: "{letters}Holograma {letters_black}▸ <gradient:{error}:{error_light}>Excluir</gradient>"
    lore:
      - "{letters_black}Zona de perigo"
      - ""
      - "{error}✎ Informações"
      - " {letters}Remove de vez."
      - ""
      - "{error}{icon:click} Clique para excluir"
      - "{letters_black}Será pedida uma confirmação."
    actions:
      - "exyliadisplays:holo_delete"
