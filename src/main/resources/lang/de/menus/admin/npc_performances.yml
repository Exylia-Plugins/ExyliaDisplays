# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Die Performances, die ein NPC abspielen kann: die Solo-Emotes von ExyliaEmotes und die Animationsdateien in
# plugins/ExyliaDisplays/animations. Eine Zeile wird auf einen ihrer Trigger gelegt oder darauf ausprobiert.

title: "{primary}&lPERFORMANCES {letters_black}» {highlight}%npc_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Keine weiteren Performances"
    lore:
      - "{letters_black}Installiere {highlight}ExyliaEmotes{letters_black} oder lege Animations-"
      - "{letters_black}dateien in {highlight}plugins/ExyliaDisplays/animations{letters_black}."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Erste Seite"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Letzte Seite →"

pagination:
  slots: '0-35'

  item_template:
    material: "%perf_icon%"
    name: "{letters}Performance {letters_black}▸ %perf_name%"
    lore:
      - "{letters_black}NPC-Performance"
      - ""
      - "{info}✦ Informationen"
      - "  {letters_black}· {info}{icon:tag} {letters}Art{letters_black}: %perf_kind%"
      - "  {letters_black}· {info}{icon:quill} {letters}Geschrieben{letters_black}: {info}%perf_value%"
      - ""
      - "{info}{icon:click} Linksklick {letters_black}· {letters}auf Trigger legen"
      - "{info}{icon:right_click} Rechtsklick {letters_black}· {letters}jetzt ausprobieren"
    actions:
      - "left: exyliadisplays:npc_perform_pick"
      - "right: exyliadisplays:npc_perform_try"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Seite {letters_black}▸ <gradient:{error}:{error_light}>← Zurück</gradient>"
      lore:
        - "  {letters_black}· {letters}Seite{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Seite {letters_black}▸ <gradient:{success}:{success_light}>Weiter →</gradient>"
      lore:
        - "  {letters_black}· {letters}Seite{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  info:
    slot: 45
    material: BOOK
    name: "<gradient:{primary}:{secondary_light}>Performances</gradient>"
    lore:
      - "{letters_black}Übersicht"
      - ""
      - "{primary}✦ Informationen"
      - "  {letters_black}· {info}{icon:iron} {letters}Verfügbar{letters_black}: {info}%perf_count%"
      - ""
      - "{primary}✎ Tipp"
      - " {letters}Eine Performance ist eine"
      - " {letters}Ganzkörper-Animation. Sie"
      - " {letters}läuft für Spieler im Umkreis von"
      - " {info}%anim_perform_range% {letters}Blöcken;"
      - " {letters}ein sitzender NPC performt nie."

  playback:
    slot: 46
    material: JUKEBOX
    name: "{letters}Performances {letters_black}▸ <gradient:{primary}:{secondary_light}>Wiedergabe</gradient>"
    lore:
      - "{letters_black}NPC-Einstellung"
      - ""
      - "{primary}✎ Informationen"
      - " {letters}Pausiert spielt er von selbst"
      - " {letters}nichts ab: keine Idle-, Begrü-"
      - " {letters}ßungs- oder Klick-Animation."
      - " {letters}Klicks und Aktionen gehen weiter."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Zustand{letters_black}: %npc_motion%"
      - "  {letters_black}· {info}{icon:note} {letters}Spielt gerade{letters_black}: %npc_performing%"
      - ""
      - "{primary}{icon:click} Linksklick {letters_black}· {letters}pausieren / fortsetzen"
      - "{primary}{icon:right_click} Rechtsklick {letters_black}· {letters}Wiedergabe stoppen"
    actions:
      - "left: exyliadisplays:npc_playback_toggle"
      - "right: exyliadisplays:npc_stop"

  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Zurück {letters_black}▸ <gradient:{error}:{error_light}>NPC</gradient>"
    lore:
      - "{error}{icon:click} Klicke, um zurückzugehen"
    actions:
      - "exyliadisplays:npc_open_hub"
