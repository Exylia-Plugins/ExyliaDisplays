# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Die NPC-Einstellungen, die ein Admin anpasst. Alles andere steht in der config.yml.

title: "{primary}&lSETTINGS {letters_black}» {highlight}NPCs"
size: 27
type: SIMPLE

open_sounds:
