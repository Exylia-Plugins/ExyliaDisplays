      - ""
      - "{primary}✎ Information"
      - " {letters}Wie neue NPCs aussehen, sich"
      - " {letters}ausrichten und sprechen."

  npcs-default-view-distance:
    slot: 10
    material: SPYGLASS
    name: "{letters}NPCs {letters_black}▸ <gradient:{primary}:{secondary_light}>Sichtweite</gradient>"
    lore:
