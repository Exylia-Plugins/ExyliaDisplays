      - ""
      - "{primary}✎ Information"
      - " {letters}Alle Zeilen in einem Feld, eine"
      - " {letters}pro Reihe: am schnellsten für ein"
      - " {letters}ganzes Hologramm, samt Tags."
      - ""
      - "{primary}{icon:click} Klicke zum Öffnen"
    actions:
      - "exyliadisplays:holo_all_lines"
