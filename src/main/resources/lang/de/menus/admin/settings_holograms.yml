      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %holograms_holograms_default_view_distance_default%"
      - ""
      - "%holograms_holograms_default_view_distance_click%"
    actions:
      - "exyliadisplays:setting holograms holograms.default-view-distance"

  holograms-near-radius:
    slot: 14
    material: COMPASS
    name: "{letters}Hologramme {letters_black}▸ <gradient:{primary}:{secondary_light}>Nah-Radius</gradient>"
    lore:
      - "{letters_black}Hologramm-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Der Radius, den {highlight}/holoadmin near"
      - " {letters}{letters}ohne Angabe verwendet."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:compass} {letters}Radius{letters_black}: %holograms_holograms_near_radius%"
