# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Die Hologramm-Einstellungen, die ein Admin anpasst. Alles andere steht in der config.yml.

title: "{primary}&lEINSTELLUNGEN {letters_black}» {highlight}Hologramme"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: NAME_TAG
    name: "<gradient:{primary}:{secondary_light}>Hologramme</gradient>"
    lore:
      - "{letters_black}Hologramm-Einstellungen"
      - ""
      - "{primary}✎ Information"
      - " {letters}Wo neue Hologramme stehen und"
      - " {letters}wie weit man sie sieht."

  holograms-spawn-height:
    slot: 12
    material: LADDER
    name: "{letters}Hologramme {letters_black}▸ <gradient:{primary}:{secondary_light}>Spawn-Höhe</gradient>"
    lore:
      - "{letters_black}Hologramm-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Wie weit über deinen Füßen ein"
      - " {letters}neues Hologramm steht (Blöcke)."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:map} {letters}Höhe{letters_black}: %holograms_holograms_spawn_height%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %holograms_holograms_spawn_height_default%"
      - ""
      - "%holograms_holograms_spawn_height_click%"
    actions:
      - "exyliadisplays:setting holograms holograms.spawn-height"

  holograms-default-view-distance:
    slot: 13
    material: SPYGLASS
    name: "{letters}Hologramme {letters_black}▸ <gradient:{primary}:{secondary_light}>Sichtweite</gradient>"
