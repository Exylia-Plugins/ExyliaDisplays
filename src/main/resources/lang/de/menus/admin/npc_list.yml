# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Jeder NPC auf diesem Server und der Button, um einen neuen zu erstellen.

title: "{primary}&lNPCS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Keine weiteren NPCs"
    lore:
      - "{letters_black}Erstelle einen, um ihn hier zu sehen."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Erste Seite"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Letzte Seite →"

pagination:
  slots: '0-35'

  item_template:
    material: "%npc_icon%"
    name: "{letters}NPC {letters_black}▸ <gradient:{primary}:{secondary_light}>%npc_name%</gradient>"
    lore:
      - "{letters_black}NPC"
      - ""
      - "{primary}✦ Informationen"
      - "  {letters_black}· {info}{icon:sign} {letters}Label{letters_black}: %npc_preview%"
      - "  {letters_black}· {info}{icon:tag} {letters}Skin{letters_black}: %npc_skin%"
      - "  {letters_black}· {info}{icon:map} {letters}Welt{letters_black}: {info}%npc_world%"
      - "  {letters_black}· {info}{icon:compass} {letters}Position{letters_black}: {info}%npc_xyz%"
      - "  {letters_black}· {info}{icon:book} {letters}Bei Klick{letters_black}: %npc_actions%"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Zustand{letters_black}: %npc_status%"
      - ""
      - "{primary}{icon:click} Linksklick {letters_black}· {letters}bearbeiten"
      - "{primary}{icon:click} Shift-Linksklick {letters_black}· {letters}teleportieren"
      - "{error}{icon:right_click} Rechtsklick {letters_black}· {letters}löschen"
      - "{letters_black}Du musst es bestätigen."
    actions:
      - "left: exyliadisplays:npc_edit"
      - "shift_left: exyliadisplays:npc_row_teleport"
      - "right: exyliadisplays:npc_row_delete"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Seite {letters_black}▸ <gradient:{error}:{error_light}>← Zurück</gradient>"
      lore:
        - "  {letters_black}· {letters}Seite{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Seite {letters_black}▸ <gradient:{success}:{success_light}>Weiter →</gradient>"
      lore:
        - "  {letters_black}· {letters}Seite{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  create:
    slot: 45
    material: NETHER_STAR
    name: "{letters}NPCs {letters_black}▸ <gradient:{success}:{success_light}>NPC erstellen</gradient>"
    lore:
      - "{letters_black}Neuer NPC"
      - ""
      - "{success}✎ Informationen"
      - " {letters}Ein neuer NPC dort, wo du stehst,"
      - " {letters}mit {highlight}fertigem Startpunkt {letters}und Skin."
      - ""
      - "{success}{icon:click} Klicken zum Erstellen"
    actions:
      - "exyliadisplays:npc_create"

  info:
    slot: 49
    material: BOOK
    name: "<gradient:{primary}:{secondary_light}>NPCs</gradient>"
    lore:
      - "{letters_black}Übersicht"
      - ""
      - "{primary}✦ Informationen"
      - "  {letters_black}· {info}{icon:iron} {letters}NPCs{letters_black}: {info}%npc_count%"
      - ""
      - "{primary}✎ Tipp"
      - " {letters}Alles hier steht auch in"
      - " {highlight}npcs.yml{letters}. Speicherst du"
      - " {letters}die Datei, gilt es sofort."

  settings:
    slot: 53
    material: "COMPARATOR"
    name: "{letters}Displays {letters_black}▸ <gradient:{primary}:{secondary_light}>Einstellungen</gradient>"
    lore:
      - "{letters_black}Plugin-Einstellungen"
      - ""
      - "{primary}✎ Informationen"
      - " {letters}Ändere die Einstellungen dieses"
      - " {letters}Plugins ohne {highlight}Dateien {letters}zu bearbeiten."
      - ""
      - "{primary}{icon:click} Klicken {letters_black}· {letters}Einstellungen öffnen"
    actions:
      - "exyliadisplays:npc_settings"
