      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:book} {letters}Zeilen{letters_black}: {info}%lines%"
      - ""
      - "{primary}{icon:click} Klicke zum Bearbeiten"
    actions:
      - "exyliadisplays:holo_open_lines"

  appearance:
    slot: 12
    material: GLOW_INK_SAC
    name: "{letters}Hologramm {letters_black}▸ <gradient:{primary}:{secondary_light}>Aussehen</gradient>"
    lore:
      - "{letters_black}Hologramm-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Wie das ganze Hologramm aussieht."
