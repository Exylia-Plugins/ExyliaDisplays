    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: "%holo_toggle_icon%"
    name: "<gradient:{primary}:{secondary_light}>%holo_name%</gradient>"
    lore:
      - "{letters_black}Hologramm-Status"
      - ""
      - "{primary}✦ Information"
      - "  {letters_black}· {info}{icon:sign} {letters}Text{letters_black}: %holo_preview%"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Zustand{letters_black}: %status%"
      - "  {letters_black}· {info}{icon:eye} {letters}Gerade sichtbar für{letters_black}: {info}%holo_viewers% {letters}Spieler"
      - ""
      - "{primary}{icon:click} Linksklick {letters_black}· {letters}ein- oder ausblenden"
      - "{primary}{icon:right_click} Rechtsklick {letters_black}· {letters}umbenennen"
    actions:
      - "left: exyliadisplays:holo_toggle"
      - "right: exyliadisplays:holo_rename"

  lines:
    slot: 11
    material: WRITABLE_BOOK
    name: "{letters}Hologramm {letters_black}▸ <gradient:{primary}:{secondary_light}>Zeilen</gradient>"
