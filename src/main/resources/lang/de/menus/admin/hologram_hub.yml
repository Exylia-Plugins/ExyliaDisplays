    material: LEVER
    name: "{letters}Hologramm {letters_black}▸ <gradient:{primary}:{secondary_light}>Klickaktionen</gradient>"
    lore:
      - "{letters_black}Hologramm-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Was ein Klick auslöst, wie das {highlight}Button-"
      - " {highlight}Panel {letters}aussieht und welche {highlight}Buttons"
      - " {letters}einzelne Zeilen mit {highlight}<button:name> {letters}nutzen."
      - ""
      - "{primary}✦ Status"
