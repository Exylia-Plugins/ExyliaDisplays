      - ""
      - "{primary}✎ Information"
      - " {letters}Aus: Listen aktualisieren sich"
      - " {letters}nicht und bleiben leer. Neustart nötig."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Modul{letters_black}: %modules_modules_leaderboards%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %modules_modules_leaderboards_default%"
      - ""
      - "%modules_modules_leaderboards_click%"
    actions:
      - "exyliadisplays:setting modules modules.leaderboards"

  modules-npcs:
    slot: 14
    material: ARMOR_STAND
    name: "{letters}Module {letters_black}▸ <gradient:{primary}:{secondary_light}>NPCs</gradient>"
    lore:
      - "{letters_black}Modul-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Aus: keine NPCs, Befehle"
      - " {letters}oder Menüs. Neustart nötig."
