# NE PAS MODIFIER — RÉGÉNÉRÉ À CHAQUE DÉMARRAGE.
#
# Les lignes d'un hologramme, de haut en bas.

title: "{primary}&lLIGNES {letters_black}» {highlight}%holo_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Plus aucune ligne"
    lore:
      - "{letters_black}Ajoute un texte, un item, un bloc ou une tête en bas."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Première page"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Dernière page →"

pagination:
  slots: '0-35'

  item_template:
    material: "%line_icon%"
    name: "{letters}Ligne {letters_black}▸ <gradient:{primary}:{secondary_light}>#%line_number%</gradient>"
    lore:
      - "{letters_black}Ligne de l'hologramme"
      - ""
      - "{primary}✎ Affiche"
      - " {letters}%line_text%"
      - ""
      - "{primary}✦ Tags"
      - " {info}%line_tags%%line_style%"
      - ""
      - "{primary}{icon:click} Clic gauche {letters_black}· {letters}modifier le texte"
      - "{primary}{icon:right_click} Clic droit {letters_black}· {letters}style, mouvement, visibilité"
      - "{primary}{icon:click} Shift-clic gauche {letters_black}· {letters}monter"
      - "{primary}{icon:right_click} Shift-clic droit {letters_black}· {letters}descendre"
      - "{primary}{icon:click} F {letters_black}· {letters}dupliquer"
      - "{error}{icon:click} Q {letters_black}· {letters}supprimer"
      - "{letters_black}Une confirmation te sera demandée."
    actions:
      - "left: exyliadisplays:holo_line_text"
      - "right: exyliadisplays:holo_line_style"
      - "shift_left: exyliadisplays:holo_line_up"
      - "shift_right: exyliadisplays:holo_line_down"
      - "swap: exyliadisplays:holo_line_duplicate"
      - "drop: exyliadisplays:holo_line_delete"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{error}:{error_light}>← Précédente</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{success}:{success_light}>Suivante →</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  add-text:
    slot: 45
    material: OAK_SIGN
    name: "{letters}Lignes {letters_black}▸ <gradient:{success}:{success_light}>Ajouter du texte</gradient>"
    lore:
      - "{letters_black}Nouvelle ligne"
      - ""
      - "{success}✎ Informations"
      - " {letters}Une nouvelle ligne en bas."
      - ""
      - "{success}{icon:click} Clique pour l'écrire"
    actions:
      - "exyliadisplays:holo_add_line"

  add-item:
    slot: 46
    material: ITEM_FRAME
    name: "{letters}Lignes {letters_black}▸ <gradient:{success}:{success_light}>Ajouter un item</gradient>"
    lore:
      - "{letters_black}Nouvelle ligne"
      - ""
      - "{success}✎ Informations"
      - " {letters}Un item flottant, face au joueur."
      - ""
      - "{success}{icon:click} Clique pour le choisir"
    actions:
      - "exyliadisplays:holo_add_item"

  add-block:
    slot: 47
    material: GRASS_BLOCK
    name: "{letters}Lignes {letters_black}▸ <gradient:{success}:{success_light}>Ajouter un bloc</gradient>"
    lore:
      - "{letters_black}Nouvelle ligne"
      - ""
      - "{success}✎ Informations"
      - " {letters}Un bloc flottant ; donne-lui"
      - " {letters}une {highlight}rotation {letters}dans son style"
      - " {letters}pour le faire tourner."
      - ""
      - "{success}{icon:click} Clique pour le choisir"
    actions:
      - "exyliadisplays:holo_add_block"

  add-head:
    slot: 51
    material: PLAYER_HEAD
    name: "{letters}Lignes {letters_black}▸ <gradient:{success}:{success_light}>Ajouter une tête</gradient>"
    lore:
      - "{letters_black}Nouvelle ligne"
      - ""
      - "{success}✎ Informations"
      - " {letters}Une tête de joueur, par nom, UUID,"
      - " {letters}texture ou URL de skin. Rends-la"
      - " {letters}petite ou grande avec sa {highlight}taille{letters}."
      - ""
      - "{success}{icon:click} Clique pour la choisir"
    actions:
      - "exyliadisplays:holo_add_head"

  pages:
    slot: 52
    material: BOOK
    name: "{letters}Lignes {letters_black}▸ <gradient:{primary}:{secondary_light}>Page</gradient> {letters_black}[{info}%holo_page%{letters_black}/{info}%holo_pages%{letters_black}]"
    lore:
      - "{letters_black}Pages de l'hologramme"
      - ""
      - "{primary}✎ Information"
      - " {letters}Chaque joueur voit une"
      - " {letters}page à la fois ; un clic"
      - " {highlight}[PAGE] next {letters}la tourne."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:paper} {letters}Modification{letters_black}: {info}page %holo_page%"
      - "  {letters_black}· {info}{icon:clock} {letters}Tourne toutes les{letters_black}: {info}%holo_page_interval% ticks"
      - ""
      - "{primary}{icon:click} Clic gauche {letters_black}· {letters}page suivante"
      - "{primary}{icon:right_click} Clic droit {letters_black}· {letters}page précédente"
      - "{primary}{icon:click} Shift-clic gauche {letters_black}· {letters}ajouter une page"
      - "{primary}{icon:right_click} Shift-clic droit {letters_black}· {letters}actions au clic de cette page"
      - "{error}{icon:click} Q {letters_black}· {letters}supprimer cette page"
      - "{letters_black}Une confirmation te sera demandée."
    actions:
      - "left: exyliadisplays:holo_page_next"
      - "right: exyliadisplays:holo_page_previous"
      - "shift_left: exyliadisplays:holo_page_add"
      - "shift_right: exyliadisplays:holo_page_click"
      - "drop: exyliadisplays:holo_page_delete"

  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Retour {letters_black}▸ <gradient:{error}:{error_light}>Hologramme</gradient>"
    lore:
      - "{error}{icon:click} Clique pour revenir"
    actions:
      - "exyliadisplays:holo_open_hub"

  all-lines:
    slot: 53
    material: WRITABLE_BOOK
    name: "{letters}Lignes {letters_black}▸ <gradient:{primary}:{secondary_light}>Tout modifier d'un coup</gradient>"
    lore:
      - "{letters_black}Action de l'hologramme"
      - ""
      - "{primary}✎ Information"
      - " {letters}Toutes les lignes dans une"
      - " {letters}boîte, une par rangée : le"
      - " {letters}plus rapide pour écrire tout"
      - " {letters}un hologramme, tags compris."
      - ""
      - "{primary}{icon:click} Clique pour ouvrir"
    actions:
      - "exyliadisplays:holo_all_lines"
