# NE PAS MODIFIER — RÉGÉNÉRÉ À CHAQUE DÉMARRAGE.
#
# Tous les PNJ du serveur, et le bouton pour en créer un.

title: "{primary}&lPNJ {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Plus aucun PNJ"
    lore:
      - "{letters_black}Crées-en un pour le voir ici."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%npc_icon%"
    name: "{letters}PNJ {letters_black}▸ <gradient:{primary}:{secondary_light}>%npc_name%</gradient>"
    lore:
      - "{letters_black}PNJ"
      - ""
      - "{primary}✦ Information"
      - "  {letters_black}· {info}{icon:sign} {letters}Étiquette{letters_black}: %npc_preview%"
      - "  {letters_black}· {info}{icon:tag} {letters}Skin{letters_black}: %npc_skin%"
      - "  {letters_black}· {info}{icon:map} {letters}Monde{letters_black}: {info}%npc_world%"
      - "  {letters_black}· {info}{icon:compass} {letters}Position{letters_black}: {info}%npc_xyz%"
      - "  {letters_black}· {info}{icon:book} {letters}Au clic{letters_black}: %npc_actions%"
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:redstone} {letters}État{letters_black}: %npc_status%"
      - ""
      - "{primary}» Clic gauche {letters_black}· {letters}modifier"
      - "{primary}» Shift-clic gauche {letters_black}· {letters}se téléporter"
      - "{error}» Clic droit {letters_black}· {letters}supprimer"
      - "{letters_black}Une confirmation te sera demandée."
    actions:
      - "left: exyliadisplays:npc_edit"
      - "shift_left: exyliadisplays:npc_row_teleport"
      - "right: exyliadisplays:npc_row_delete"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{error}:{error_light}>← Précédente</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{success}:{success_light}>Suivante →</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  create:
    slot: 45
    material: NETHER_STAR
    name: "{letters}PNJ {letters_black}▸ <gradient:{success}:{success_light}>Créer un PNJ</gradient>"
    lore:
      - "{letters_black}Nouveau PNJ"
      - ""
      - "{success}✎ Information"
      - " {letters}Un nouveau PNJ là où tu"
      - " {letters}es, à partir d'un {highlight}modèle"
      - " {highlight}de départ {letters}et d'un skin."
      - ""
      - "{success}» Clique pour créer"
    actions:
      - "exyliadisplays:npc_create"

  info:
    slot: 49
    material: BOOK
    name: "<gradient:{primary}:{secondary_light}>PNJ</gradient>"
    lore:
      - "{letters_black}Aperçu"
      - ""
      - "{primary}✦ Information"
      - "  {letters_black}· {info}{icon:iron} {letters}PNJ{letters_black}: {info}%npc_count%"
      - ""
      - "{primary}✎ Astuce"
      - " {letters}Tout ceci se trouve aussi dans"
      - " {highlight}npcs.yml{letters}, et enregistrer ce"
      - " {letters}fichier l'applique aussitôt."

  settings:
    slot: 53
    material: "COMPARATOR"
    name: "{letters}Displays {letters_black}▸ <gradient:{primary}:{secondary_light}>Paramètres</gradient>"
    lore:
      - "{letters_black}Réglages du plugin"
      - ""
      - "{primary}✎ Information"
      - " {letters}Modifie les paramètres du plugin"
      - " {letters}sans éditer ses {highlight}fichiers{letters}."
      - ""
      - "{primary}» Clic {letters_black}· {letters}Ouvrir les paramètres"
    actions:
      - "exyliadisplays:npc_settings"
