# NE PAS MODIFIER — RÉGÉNÉRÉ À CHAQUE DÉMARRAGE.
#
# Un hologramme : son état, et une carte pour chacune de ses parties.

title: "{primary}&lHOLOGRAMME {letters_black}» {highlight}%holo_name%"
size: 36
type: SIMPLE

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: "%holo_toggle_icon%"
    name: "<gradient:{primary}:{secondary_light}>%holo_name%</gradient>"
    lore:
      - "{letters_black}État de l'hologramme"
      - ""
      - "{primary}✦ Information"
      - "  {letters_black}· {info}{icon:sign} {letters}Affiche{letters_black}: %holo_preview%"
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:redstone} {letters}État{letters_black}: %status%"
      - "  {letters_black}· {info}{icon:eye} {letters}Vu en ce moment{letters_black}: {info}%holo_viewers% {letters}joueurs"
      - ""
      - "{primary}{icon:click} Clic gauche {letters_black}· {letters}afficher ou masquer"
      - "{primary}{icon:right_click} Clic droit {letters_black}· {letters}renommer"
    actions:
      - "left: exyliadisplays:holo_toggle"
      - "right: exyliadisplays:holo_rename"

  lines:
    slot: 11
    material: WRITABLE_BOOK
    name: "{letters}Hologramme {letters_black}▸ <gradient:{primary}:{secondary_light}>Lignes</gradient>"
    lore:
      - "{letters_black}Réglage de l'hologramme"
      - ""
      - "{primary}✎ Information"
      - " {letters}Textes, items et blocs, chacun avec"
      - " {highlight}taille{letters}, {highlight}mouvement {letters}et {highlight}qui le voit{letters}."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:book} {letters}Lignes{letters_black}: {info}%lines%"
      - ""
      - "{primary}{icon:click} Clique pour modifier"
    actions:
      - "exyliadisplays:holo_open_lines"

  appearance:
    slot: 12
    material: GLOW_INK_SAC
    name: "{letters}Hologramme {letters_black}▸ <gradient:{primary}:{secondary_light}>Apparence</gradient>"
    lore:
      - "{letters_black}Réglage de l'hologramme"
      - ""
      - "{primary}✎ Information"
      - " {letters}Comment tout"
      - " {letters}l'hologramme est rendu."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:compass} {letters}Orientation{letters_black}: {info}%holo_billboard%"
      - "  {letters_black}· {info}{icon:iron} {letters}Échelle{letters_black}: {info}%holo_scale%"
      - "  {letters_black}· {info}{icon:iron} {letters}Espacement{letters_black}: {info}%holo_spacing%"
      - "  {letters_black}· {info}{icon:redstone} {letters}Ombre{letters_black}: %holo_shadow%"
      - ""
      - "{primary}{icon:click} Clic gauche {letters_black}· {letters}forme et taille"
      - "{primary}{icon:right_click} Clic droit {letters_black}· {letters}couleur et lumière"
    actions:
      - "left: exyliadisplays:holo_appearance"
      - "right: exyliadisplays:holo_appearance_light"

  distance:
    slot: 14
    material: TARGET
    name: "{letters}Hologramme {letters_black}▸ <gradient:{primary}:{secondary_light}>Taille selon la distance</gradient>"
    lore:
      - "{letters_black}Réglage de l'hologramme"
      - ""
      - "{primary}✎ Information"
      - " {letters}Grandit selon la"
      - " {letters}distance du joueur, pour"
      - " {letters}rester {highlight}lisible {letters}de loin."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:iron} {letters}Grandit{letters_black}: %holo_distance%"
      - ""
      - "{primary}{icon:click} Clique pour modifier"
    actions:
      - "exyliadisplays:holo_distance_scale"

  visibility:
    slot: 15
    material: ENDER_EYE
    name: "{letters}Hologramme {letters_black}▸ <gradient:{primary}:{secondary_light}>Visibilité</gradient>"
    lore:
      - "{letters_black}Réglage de l'hologramme"
      - ""
      - "{primary}✎ Information"
      - " {letters}Qui le voit, à quelle"
      - " {letters}distance, et à quelle"
      - " {letters}fréquence il se rafraîchit."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:key} {letters}Visible par{letters_black}: %permission%"
      - "  {letters_black}· {info}{icon:compass} {letters}Distance{letters_black}: {info}%view_distance%"
      - "  {letters_black}· {info}{icon:eye} {letters}Par joueur{letters_black}: %per_player%"
      - "  {letters_black}· {info}{icon:clock} {letters}Rafraîchit{letters_black}: {info}%holo_interval% {letters}ticks"
      - "  {letters_black}· {info}{icon:eye} {letters}Joueurs{letters_black}: %visibility%"
      - ""
      - "{primary}{icon:click} Clic gauche {letters_black}· {letters}modifier"
      - "{primary}{icon:right_click} Clic droit {letters_black}· {letters}tout le monde ou joueurs choisis"
    actions:
      - "left: exyliadisplays:holo_visibility"
      - "right: exyliadisplays:holo_visibility_mode"

  click:
    slot: 21
    material: LEVER
    name: "{letters}Hologramme {letters_black}▸ <gradient:{primary}:{secondary_light}>Actions au clic</gradient>"
    lore:
      - "{letters_black}Réglage de l'hologramme"
      - ""
      - "{primary}✎ Information"
      - " {letters}Ce que fait un clic,"
      - " {letters}l'aspect du {highlight}panneau"
      - " {highlight}de boutons{letters}, et les {highlight}boutons"
      - " {letters}que les lignes lancent avec {highlight}<button:name>{letters}."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:book} {letters}Au clic{letters_black}: %click%"
      - "  {letters_black}· {info}{icon:eye} {letters}Aspect{letters_black}: %holo_click_style%"
      - "  {letters_black}· {info}{icon:iron} {letters}Boutons{letters_black}: %holo_buttons%"
      - "  {letters_black}· {info}{icon:iron} {letters}Grandit à{letters_black}: {info}%holo_hover%x"
      - ""
      - "{primary}{icon:click} Clic gauche {letters_black}· {letters}actions"
      - "{primary}{icon:right_click} Clic droit {letters_black}· {letters}aspect et son"
      - "{primary}{icon:click} Shift-clic {letters_black}· {letters}boutons"
    actions:
      - "left: exyliadisplays:holo_click"
      - "right: exyliadisplays:holo_click_look"
      - "shift_left: exyliadisplays:holo_buttons"
      - "shift_right: exyliadisplays:holo_buttons"

  location:
    slot: 22
    material: COMPASS
    name: "{letters}Hologramme {letters_black}▸ <gradient:{primary}:{secondary_light}>Emplacement</gradient>"
    lore:
      - "{letters_black}Réglage de l'hologramme"
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:map} {letters}Monde{letters_black}: {info}%world%"
      - "  {letters_black}· {info}{icon:compass} {letters}Position{letters_black}: {info}%xyz%"
      - "  {letters_black}· {info}{icon:compass} {letters}Orientation{letters_black}: {info}%facing%"
      - ""
      - "{primary}{icon:click} Clic gauche {letters_black}· {letters}position et rotation exactes"
      - "{primary}{icon:right_click} Clic droit {letters_black}· {letters}déplacer ici"
      - "{primary}{icon:click} Shift-clic gauche {letters_black}· {letters}centrer sur son bloc"
      - "{primary}{icon:right_click} Shift-clic droit {letters_black}· {letters}tourner vers moi"
    actions:
      - "left: exyliadisplays:holo_location"
      - "right: exyliadisplays:holo_move_here"
      - "shift_left: exyliadisplays:holo_centre"
      - "shift_right: exyliadisplays:holo_face"

  attach:
    slot: 23
    material: LEAD
    name: "{letters}Hologramme {letters_black}▸ <gradient:{primary}:{secondary_light}>Attaché à</gradient>"
    lore:
      - "{letters_black}Réglage de l'hologramme"
      - ""
      - "{primary}✎ Information"
      - " {letters}Suit un {highlight}joueur {letters}ou un {highlight}mob{letters}, et"
      - " {letters}se déplace partout avec lui."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:tag} {letters}Suit{letters_black}: %attached%"
      - "  {letters_black}· {info}{icon:iron} {letters}Hauteur{letters_black}: {info}%attach_offset%"
      - ""
      - "{primary}{icon:click} Clic gauche {letters_black}· {letters}choisir ce qu'il suit"
      - "{primary}{icon:right_click} Clic droit {letters_black}· {letters}revenir à son emplacement"
    actions:
      - "left: exyliadisplays:holo_attach"
      - "right: exyliadisplays:holo_detach"

  teleport:
    slot: 27
    material: ENDER_PEARL
    name: "{letters}Hologramme {letters_black}▸ <gradient:{primary}:{secondary_light}>Téléportation</gradient>"
    lore:
      - "{letters_black}Action de l'hologramme"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Va jusqu'à lui, face à lui."
      - ""
      - "{primary}{icon:click} Clique pour te téléporter"
    actions:
      - "exyliadisplays:holo_teleport"

  clone:
    slot: 28
    material: PAPER
    name: "{letters}Hologramme {letters_black}▸ <gradient:{success}:{success_light}>Dupliquer</gradient>"
    lore:
      - "{letters_black}Action de l'hologramme"
      - ""
      - "{success}✎ Informations"
      - " {letters}Une copie sous un nouveau"
      - " {letters}nom, au même endroit."
      - ""
      - "{success}{icon:click} Clique pour dupliquer"
    actions:
      - "exyliadisplays:holo_clone"

  adjust:
    slot: 29
    material: SPYGLASS
    name: "{letters}Hologramme {letters_black}▸ <gradient:{primary}:{secondary_light}>Réglage fin</gradient>"
    lore:
      - "{letters_black}Action de l'hologramme"
      - ""
      - "{primary}✎ Information"
      - " {letters}Déplace, tourne et"
      - " {letters}redimensionne-le à la"
      - " {highlight}molette {letters}en le regardant."
      - ""
      - "{primary}✦ Commandes"
      - "  {letters_black}· {letters}Molette{letters_black}: {info}changer la valeur"
      - "  {letters_black}· {letters}Accroupi + molette{letters_black}: {info}taille du pas"
      - "  {letters_black}· {letters}F{letters_black}: {info}axe suivant"
      - "  {letters_black}· {letters}Accroupi + clic{letters_black}: {info}aligner"
      - "  {letters_black}· {letters}Clic{letters_black}: {info}enregistrer"
      - ""
      - "{primary}{icon:click} Clique pour commencer"
    actions:
      - "exyliadisplays:holo_adjust"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Retour {letters_black}▸ <gradient:{error}:{error_light}>Hologrammes</gradient>"
    lore:
      - "{error}{icon:click} Clique pour revenir"
    actions:
      - "exyliadisplays:holo_open_list"

  templates:
    slot: 32
    material: PAINTING
    name: "{letters}Hologramme {letters_black}▸ <gradient:{primary}:{secondary_light}>Modèles</gradient>"
    lore:
      - "{letters_black}Réglage de l'hologramme"
      - ""
      - "{primary}✎ Information"
      - " {letters}Garde cet aspect pour le"
      - " {letters}réutiliser, ou applique-lui"
      - " {letters}un modèle enregistré."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:book} {letters}Modèles enregistrés{letters_black}: {info}%holo_templates%"
      - ""
      - "{primary}{icon:click} Clic gauche {letters_black}· {letters}enregistrer cet aspect"
      - "{primary}{icon:right_click} Clic droit {letters_black}· {letters}appliquer un modèle"
    actions:
      - "left: exyliadisplays:holo_template_save"
      - "right: exyliadisplays:holo_template_apply"

  undo:
    slot: 33
    material: CLOCK
    name: "{letters}Hologramme {letters_black}▸ <gradient:{primary}:{secondary_light}>Annuler</gradient>"
    lore:
      - "{letters_black}Action de l'hologramme"
      - ""
      - "{primary}✎ Information"
      - " {letters}Annule la dernière"
      - " {letters}modification, faite ici, par"
      - " {letters}commande ou dans le fichier."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:iron} {letters}Modifications à annuler{letters_black}: {info}%holo_undo%"
      - ""
      - "{primary}{icon:click} Clique pour annuler"
    actions:
      - "exyliadisplays:holo_undo"

  delete:
    slot: 35
    material: BARRIER
    name: "{letters}Hologramme {letters_black}▸ <gradient:{error}:{error_light}>Supprimer</gradient>"
    lore:
      - "{letters_black}Zone dangereuse"
      - ""
      - "{error}✎ Informations"
      - " {letters}Le supprime définitivement."
      - ""
      - "{error}{icon:click} Clique pour supprimer"
      - "{letters_black}Une confirmation te sera demandée."
    actions:
      - "exyliadisplays:holo_delete"
