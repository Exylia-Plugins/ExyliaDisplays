# NE PAS MODIFIER — RÉGÉNÉRÉ À CHAQUE DÉMARRAGE.
#
# Un hologramme : son état, et une carte pour chacune de ses parties.

title: "{primary}&lHOLOGRAMME {letters_black}» {highlight}%holo_name%"
size: 45
type: SIMPLE

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: "%holo_toggle_icon%"
    name: "{primary}&l%holo_name%"
    lore:
      - ""
      - "{secondary}Information :"
      - " {letters_black}▎ {letters}Affiche {letters_black}» %holo_preview%"
      - " {letters_black}▎ {letters}Lignes {letters_black}» {info}%lines%"
      - ""
      - "{secondary}Statut :"
      - " {letters_black}▎ {letters}État {letters_black}» %status%"
      - ""
      - "{warning}➥ Clic gauche {letters_black}» {letters}afficher ou masquer"
      - "{warning}➥ Clic droit {letters_black}» {letters}renommer"
      - ""
    actions:
      - "left: exyliadisplays:holo_toggle"
      - "right: exyliadisplays:holo_rename"

  lines:
    slot: 19
    material: WRITABLE_BOOK
    name: "{primary}&lLIGNES"
    lore:
      - ""
      - "{secondary}Information :"
      - " {letters_black}▎ {letters}Textes, items et blocs, chacun avec"
      - " {letters_black}▎ {highlight}taille{letters}, {highlight}mouvement {letters}et {highlight}qui le voit{letters}."
      - ""
      - "{secondary}Statut :"
      - " {letters_black}▎ {letters}Lignes {letters_black}» {info}%lines%"
      - ""
      - "{warning}➥ Clique pour modifier"
      - ""
    actions:
      - "exyliadisplays:holo_open_lines"

  appearance:
    slot: 20
    material: GLOW_INK_SAC
    name: "{primary}&lAPPARENCE"
    lore:
      - ""
      - "{secondary}Information :"
      - " {letters_black}▎ {letters}Comment tout l'hologramme est rendu."
      - ""
      - "{secondary}Statut :"
      - " {letters_black}▎ {letters}Orientation {letters_black}» {info}%holo_billboard%"
      - " {letters_black}▎ {letters}Échelle {letters_black}» {info}%holo_scale%"
      - " {letters_black}▎ {letters}Espacement {letters_black}» {info}%holo_spacing%"
      - " {letters_black}▎ {letters}Ombre {letters_black}» %holo_shadow%"
      - ""
      - "{warning}➥ Clic gauche {letters_black}» {letters}forme et taille"
      - "{warning}➥ Clic droit {letters_black}» {letters}couleur et lumière"
      - ""
    actions:
      - "left: exyliadisplays:holo_appearance"
      - "right: exyliadisplays:holo_appearance_light"

  distance:
    slot: 21
    material: TARGET
    name: "{primary}&lTAILLE SELON LA DISTANCE"
    lore:
      - ""
      - "{secondary}Information :"
      - " {letters_black}▎ {letters}Grandit selon la distance du joueur,"
      - " {letters_black}▎ {letters}pour rester {highlight}lisible {letters}de loin."
      - ""
      - "{secondary}Statut :"
      - " {letters_black}▎ {letters}Grandit {letters_black}» %holo_distance%"
      - ""
      - "{warning}➥ Clique pour modifier"
      - ""
    actions:
      - "exyliadisplays:holo_distance_scale"

  visibility:
    slot: 22
    material: ENDER_EYE
    name: "{primary}&lVISIBILITÉ"
    lore:
      - ""
      - "{secondary}Information :"
      - " {letters_black}▎ {letters}Qui le voit, à quelle distance, et"
      - " {letters_black}▎ {letters}à quelle fréquence il se rafraîchit."
      - ""
      - "{secondary}Statut :"
      - " {letters_black}▎ {letters}Visible par {letters_black}» %permission%"
      - " {letters_black}▎ {letters}Distance {letters_black}» {info}%view_distance%"
      - " {letters_black}▎ {letters}Par joueur {letters_black}» %per_player%"
      - " {letters_black}▎ {letters}Rafraîchit {letters_black}» {info}%holo_interval% {letters}ticks"
      - " {letters_black}▎ {letters}Joueurs {letters_black}» %visibility%"
      - ""
      - "{warning}➥ Clic gauche {letters_black}» {letters}modifier"
      - "{warning}➥ Clic droit {letters_black}» {letters}tout le monde ou joueurs choisis"
      - ""
    actions:
      - "left: exyliadisplays:holo_visibility"
      - "right: exyliadisplays:holo_visibility_mode"

  click:
    slot: 23
    material: LEVER
    name: "{primary}&lACTIONS AU CLIC"
    lore:
      - ""
      - "{secondary}Information :"
      - " {letters_black}▎ {letters}Ce que fait un clic, l'aspect du {highlight}panneau"
      - " {letters_black}▎ {highlight}de boutons{letters}, et les {highlight}boutons {letters}que les"
      - " {letters_black}▎ {letters}lignes lancent avec {highlight}<button:name>{letters}."
      - ""
      - "{secondary}Statut :"
      - " {letters_black}▎ {letters}Au clic {letters_black}» %click%"
      - " {letters_black}▎ {letters}Aspect {letters_black}» %holo_click_style%"
      - " {letters_black}▎ {letters}Boutons {letters_black}» %holo_buttons%"
      - " {letters_black}▎ {letters}Grandit à {letters_black}» {info}%holo_hover%x"
      - ""
      - "{warning}➥ Clic gauche {letters_black}» {letters}actions"
      - "{warning}➥ Clic droit {letters_black}» {letters}aspect et son"
      - "{warning}➥ Shift-clic {letters_black}» {letters}boutons"
      - ""
    actions:
      - "left: exyliadisplays:holo_click"
      - "right: exyliadisplays:holo_click_look"
      - "shift_left: exyliadisplays:holo_buttons"
      - "shift_right: exyliadisplays:holo_buttons"

  location:
    slot: 24
    material: COMPASS
    name: "{primary}&lEMPLACEMENT"
    lore:
      - ""
      - "{secondary}Statut :"
      - " {letters_black}▎ {letters}Monde {letters_black}» {info}%world%"
      - " {letters_black}▎ {letters}Position {letters_black}» {info}%xyz%"
      - " {letters_black}▎ {letters}Orientation {letters_black}» {info}%facing%"
      - ""
      - "{warning}➥ Clic gauche {letters_black}» {letters}position et rotation exactes"
      - "{warning}➥ Clic droit {letters_black}» {letters}déplacer ici"
      - "{warning}➥ Shift-clic gauche {letters_black}» {letters}centrer sur son bloc"
      - "{warning}➥ Shift-clic droit {letters_black}» {letters}tourner vers moi"
      - ""
    actions:
      - "left: exyliadisplays:holo_location"
      - "right: exyliadisplays:holo_move_here"
      - "shift_left: exyliadisplays:holo_centre"
      - "shift_right: exyliadisplays:holo_face"

  attach:
    slot: 25
    material: LEAD
    name: "{primary}&lATTACHÉ À"
    lore:
      - ""
      - "{secondary}Information :"
      - " {letters_black}▎ {letters}Suit un {highlight}joueur {letters}ou un {highlight}mob{letters},"
      - " {letters_black}▎ {letters}et se déplace partout avec lui."
      - ""
      - "{secondary}Statut :"
      - " {letters_black}▎ {letters}Suit {letters_black}» %attached%"
      - " {letters_black}▎ {letters}Hauteur {letters_black}» {info}%attach_offset%"
      - ""
      - "{warning}➥ Clic gauche {letters_black}» {letters}choisir ce qu'il suit"
      - "{warning}➥ Clic droit {letters_black}» {letters}revenir à son emplacement"
      - ""
    actions:
      - "left: exyliadisplays:holo_attach"
      - "right: exyliadisplays:holo_detach"

  teleport:
    slot: 36
    material: ENDER_PEARL
    name: "{primary}&lTÉLÉPORTATION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Va jusqu'à lui, face à lui."
      - ""
      - "{warning}➥ Clique pour te téléporter"
      - ""
    actions:
      - "exyliadisplays:holo_teleport"

  clone:
    slot: 37
    material: PAPER
    name: "{primary}&lDUPLIQUER"
    lore:
      - ""
      - " {letters_black}▎ {letters}Une copie sous un nouveau nom,"
      - " {letters_black}▎ {letters}au même endroit."
      - ""
      - "{warning}➥ Clique pour dupliquer"
      - ""
    actions:
      - "exyliadisplays:holo_clone"

  adjust:
    slot: 38
    material: SPYGLASS
    name: "{primary}&lRÉGLAGE FIN"
    lore:
      - ""
      - "{secondary}Information :"
      - " {letters_black}▎ {letters}Déplace, tourne et redimensionne-le à la"
      - " {letters_black}▎ {highlight}molette {letters}en le regardant."
      - ""
      - "{secondary}Commandes :"
      - " {letters_black}▎ {letters}Molette {letters_black}» {info}changer la valeur"
      - " {letters_black}▎ {letters}Accroupi + molette {letters_black}» {info}taille du pas"
      - " {letters_black}▎ {letters}F {letters_black}» {info}axe suivant"
      - " {letters_black}▎ {letters}Accroupi + clic {letters_black}» {info}aligner"
      - " {letters_black}▎ {letters}Clic {letters_black}» {info}enregistrer"
      - ""
      - "{warning}➥ Clique pour commencer"
      - ""
    actions:
      - "exyliadisplays:holo_adjust"

  back:
    slot: 40
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lRETOUR'
    lore:
      - ""
      - " {letters_black}▎ {letters}Revient à tous les hologrammes."
      - ""
      - "{warning}➥ Clique pour revenir"
      - ""
    actions:
      - "exyliadisplays:holo_open_list"

  templates:
    slot: 41
    material: PAINTING
    name: "{primary}&lMODÈLES"
    lore:
      - ""
      - "{secondary}Information :"
      - " {letters_black}▎ {letters}Garde cet aspect pour le réutiliser,"
      - " {letters_black}▎ {letters}ou applique-lui un modèle enregistré."
      - ""
      - "{secondary}Statut :"
      - " {letters_black}▎ {letters}Modèles enregistrés {letters_black}» {info}%holo_templates%"
      - ""
      - "{warning}➥ Clic gauche {letters_black}» {letters}enregistrer cet aspect"
      - "{warning}➥ Clic droit {letters_black}» {letters}appliquer un modèle"
      - ""
    actions:
      - "left: exyliadisplays:holo_template_save"
      - "right: exyliadisplays:holo_template_apply"

  undo:
    slot: 42
    material: CLOCK
    name: "{primary}&lANNULER"
    lore:
      - ""
      - "{secondary}Information :"
      - " {letters_black}▎ {letters}Annule la dernière modification, faite"
      - " {letters_black}▎ {letters}ici, par commande ou dans le fichier."
      - ""
      - "{secondary}Statut :"
      - " {letters_black}▎ {letters}Modifications à annuler {letters_black}» {info}%holo_undo%"
      - ""
      - "{warning}➥ Clique pour annuler"
      - ""
    actions:
      - "exyliadisplays:holo_undo"

  delete:
    slot: 44
    material: BARRIER
    name: "{error}&lSUPPRIMER"
    lore:
      - ""
      - " {letters_black}▎ {letters}Le supprime définitivement."
      - " {letters_black}Une confirmation te sera demandée."
      - ""
      - "{error}➥ Clique pour supprimer"
      - ""
    actions:
      - "exyliadisplays:holo_delete"
