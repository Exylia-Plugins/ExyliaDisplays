# NE PAS MODIFIER — RÉGÉNÉRÉ À CHAQUE DÉMARRAGE.
#
# Tous les hologrammes du serveur, et le bouton pour en créer un.

title: "{primary}&lHOLOGRAMMES {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Plus aucun hologramme"
    lore:
      - "{letters_black}Crées-en un pour le voir ici."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Première page"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Dernière page →"

pagination:
  slots: '0-35'

  item_template:
    material: "%holo_icon%"
    name: "{letters}Hologramme {letters_black}▸ <gradient:{primary}:{secondary_light}>%holo_name%</gradient>"
    lore:
      - "{letters_black}Hologramme"
      - ""
      - "{primary}✦ Information"
      - "  {letters_black}· {info}{icon:sign} {letters}Affiche{letters_black}: %holo_preview%"
      - "  {letters_black}· {info}{icon:map} {letters}Monde{letters_black}: {info}%holo_world%"
      - "  {letters_black}· {info}{icon:compass} {letters}Position{letters_black}: {info}%holo_xyz%"
      - "  {letters_black}· {info}{icon:book} {letters}Lignes{letters_black}: {info}%holo_lines%"
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:redstone} {letters}État{letters_black}: %holo_status%"
      - ""
      - "{primary}{icon:click} Clic gauche {letters_black}· {letters}modifier"
      - "{primary}{icon:click} Shift-clic gauche {letters_black}· {letters}se téléporter"
      - "{error}{icon:right_click} Clic droit {letters_black}· {letters}supprimer"
      - "{letters_black}Une confirmation te sera demandée."
    actions:
      - "left: exyliadisplays:holo_edit"
      - "shift_left: exyliadisplays:holo_row_teleport"
      - "right: exyliadisplays:holo_row_delete"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{error}:{error_light}>← Précédente</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{success}:{success_light}>Suivante →</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  create:
    slot: 45
    material: NETHER_STAR
    name: "{letters}Hologrammes {letters_black}▸ <gradient:{success}:{success_light}>Créer un hologramme</gradient>"
    lore:
      - "{letters_black}Nouvel hologramme"
      - ""
      - "{success}✎ Information"
      - " {letters}Un nouvel hologramme là où tu es,"
      - " {letters}à partir d'un {highlight}modèle de départ{letters}."
      - ""
      - "{success}{icon:click} Clique pour créer"
    actions:
      - "exyliadisplays:holo_create"

  info:
    slot: 49
    material: BOOK
    name: "<gradient:{primary}:{secondary_light}>Hologrammes</gradient>"
    lore:
      - "{letters_black}Aperçu"
      - ""
      - "{primary}✦ Information"
      - "  {letters_black}· {info}{icon:iron} {letters}Hologrammes{letters_black}: {info}%holo_count%"
      - ""
      - "{primary}✎ Astuce"
      - " {letters}Tout ceci se trouve aussi dans"
      - " {highlight}holograms.yml{letters}, et enregistrer"
      - " {letters}ce fichier l'applique aussitôt."

  settings:
    slot: 53
    material: "COMPARATOR"
    name: "{letters}Displays {letters_black}▸ <gradient:{primary}:{secondary_light}>Paramètres</gradient>"
    lore:
      - "{letters_black}Réglages du plugin"
      - ""
      - "{primary}✎ Information"
      - " {letters}Modifie les paramètres du plugin"
      - " {letters}sans éditer ses {highlight}fichiers{letters}."
      - ""
      - "{primary}{icon:click} Clic {letters_black}· {letters}Ouvrir les paramètres"
    actions:
      - "exyliadisplays:holo_settings"
