# NE PAS MODIFIER — RÉGÉNÉRÉ À CHAQUE DÉMARRAGE.
#
# Les performances qu'un PNJ peut jouer : les emotes solo d'ExyliaEmotes et les fichiers
# d'animation de plugins/ExyliaDisplays/animations. Une ligne va sur un de ses déclencheurs,
# ou s'essaie sur lui.

title: "{primary}&lPERFORMANCES {letters_black}» {highlight}%npc_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Plus aucune performance"
    lore:
      - "{letters_black}Installe {highlight}ExyliaEmotes{letters_black}, ou dépose des fichiers"
      - "{letters_black}d'animation dans {highlight}plugins/ExyliaDisplays/animations{letters_black}."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Première page"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Dernière page →"

pagination:
  slots: '0-35'

  item_template:
    material: "%perf_icon%"
    name: "{letters}Performance {letters_black}▸ %perf_name%"
    lore:
      - "{letters_black}Performance du PNJ"
      - ""
      - "{info}✦ Information"
      - "  {letters_black}· {info}{icon:tag} {letters}Type{letters_black}: %perf_kind%"
      - "  {letters_black}· {info}{icon:quill} {letters}Écrit{letters_black}: {info}%perf_value%"
      - ""
      - "{info}{icon:click} Clic gauche {letters_black}· {letters}l'assigner à un déclencheur"
      - "{info}{icon:right_click} Clic droit {letters_black}· {letters}l'essayer maintenant"
    actions:
      - "left: exyliadisplays:npc_perform_pick"
      - "right: exyliadisplays:npc_perform_try"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{error}:{error_light}>← Précédente</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{success}:{success_light}>Suivante →</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  info:
    slot: 45
    material: BOOK
    name: "<gradient:{primary}:{secondary_light}>Performances</gradient>"
    lore:
      - "{letters_black}Aperçu"
      - ""
      - "{primary}✦ Information"
      - "  {letters_black}· {info}{icon:iron} {letters}Disponibles{letters_black}: {info}%perf_count%"
      - ""
      - "{primary}✎ Astuce"
      - " {letters}Une performance est une"
      - " {letters}animation du corps entier,"
      - " {letters}jouée pour les joueurs à"
      - " {info}%anim_perform_range%"
      - " {letters}blocs ou moins ; un PNJ"
      - " {letters}assis ne joue jamais."

  playback:
    slot: 46
    material: JUKEBOX
    name: "{letters}Performances {letters_black}▸ <gradient:{primary}:{secondary_light}>Lecture</gradient>"
    lore:
      - "{letters_black}Réglage du PNJ"
      - ""
      - "{primary}✎ Information"
      - " {letters}En pause, il ne joue rien tout"
      - " {letters}seul : ni idle, ni accueil, ni"
      - " {letters}animation de clic. Les clics et"
      - " {letters}leurs actions fonctionnent."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:redstone} {letters}État{letters_black}: %npc_motion%"
      - "  {letters_black}· {info}{icon:note} {letters}En performance{letters_black}: %npc_performing%"
      - ""
      - "{primary}{icon:click} Clic gauche {letters_black}· {letters}pause ou reprise"
      - "{primary}{icon:right_click} Clic droit {letters_black}· {letters}arrêter ce qu'il joue"
    actions:
      - "left: exyliadisplays:npc_playback_toggle"
      - "right: exyliadisplays:npc_stop"

  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Retour {letters_black}▸ <gradient:{error}:{error_light}>PNJ</gradient>"
    lore:
      - "{error}{icon:click} Clique pour revenir"
    actions:
      - "exyliadisplays:npc_open_hub"
