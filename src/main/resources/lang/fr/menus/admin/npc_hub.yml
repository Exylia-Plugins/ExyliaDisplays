# NE PAS MODIFIER — RÉGÉNÉRÉ À CHAQUE DÉMARRAGE.
#
# Un PNJ : son état, et une carte pour chacune de ses parties.

title: "{primary}&lPNJ {letters_black}» {highlight}%npc_name%"
size: 36
type: SIMPLE

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: "%npc_icon%"
    name: "<gradient:{primary}:{secondary_light}>%npc_name%</gradient>"
    lore:
      - "{letters_black}État du PNJ"
      - ""
      - "{primary}✦ Information"
      - "  {letters_black}· {info}{icon:sign} {letters}Étiquette{letters_black}: %npc_preview%"
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:redstone} {letters}État{letters_black}: %status%"
      - "  {letters_black}· {info}{icon:eye} {letters}Vu en ce moment{letters_black}: {info}%npc_viewers% {letters}joueurs"
      - ""
      - "{primary}{icon:click} Clic gauche {letters_black}· {letters}afficher ou masquer"
      - "{primary}{icon:right_click} Clic droit {letters_black}· {letters}renommer"
    actions:
      - "left: exyliadisplays:npc_toggle"
      - "right: exyliadisplays:npc_rename"

  appearance:
    slot: 11
    material: ARMOR_STAND
    name: "{letters}PNJ {letters_black}▸ <gradient:{primary}:{secondary_light}>Apparence</gradient>"
    lore:
      - "{letters_black}Réglage du PNJ"
      - ""
      - "{primary}✎ Information"
      - " {letters}Son skin, sa pose, sa"
      - " {letters}taille et son contour."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:tag} {letters}Skin{letters_black}: %skin%"
      - "  {letters_black}· {info}{icon:tag} {letters}Pose{letters_black}: {info}%pose%"
      - "  {letters_black}· {info}{icon:iron} {letters}Échelle{letters_black}: {info}%scale%"
      - "  {letters_black}· {info}{icon:glint} {letters}Lueur{letters_black}: %glow%"
      - ""
      - "{primary}{icon:click} Clic gauche {letters_black}· {letters}skin"
      - "{primary}{icon:right_click} Clic droit {letters_black}· {letters}pose, taille, contour et assis"
    actions:
      - "left: exyliadisplays:npc_appearance"
      - "right: exyliadisplays:npc_appearance_body"

  equipment:
    slot: 12
    material: DIAMOND_CHESTPLATE
    name: "{letters}PNJ {letters_black}▸ <gradient:{primary}:{secondary_light}>Équipement</gradient>"
    lore:
      - "{letters_black}Réglage du PNJ"
      - ""
      - "{primary}✎ Information"
      - " {letters}Ce qu'il porte et tient,"
      - " {letters}pris de l'item dans {highlight}ta main{letters}."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:armor} {letters}Porte{letters_black}: %equipment%"
      - ""
      - "{primary}{icon:click} Clique pour ouvrir"
    actions:
      - "exyliadisplays:npc_open_equipment"

  label:
    slot: 14
    material: NAME_TAG
    name: "{letters}PNJ {letters_black}▸ <gradient:{primary}:{secondary_light}>Étiquette</gradient>"
    lore:
      - "{letters_black}Réglage du PNJ"
      - ""
      - "{primary}✎ Information"
      - " {letters}Les lignes au-dessus de sa tête,"
      - " {letters}avec chaque {highlight}tag d'hologramme{letters}, ou"
      - " {letters}tout un hologramme qui le suit."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:sign} {letters}Étiquette{letters_black}: %label%"
      - "  {letters_black}· {info}{icon:iron} {letters}Écart{letters_black}: {info}%npc_height% {letters}blocs"
      - "  {letters_black}· {info}{icon:book} {letters}Hologramme{letters_black}: %link%"
      - ""
      - "{primary}{icon:click} Clic gauche {letters_black}· {letters}modifier l'étiquette"
      - "{primary}{icon:right_click} Clic droit {letters_black}· {letters}lier un hologramme"
    actions:
      - "left: exyliadisplays:npc_label"
      - "right: exyliadisplays:npc_link"

  animations:
    slot: 15
    material: FEATHER
    name: "{letters}PNJ {letters_black}▸ <gradient:{primary}:{secondary_light}>Animations</gradient>"
    lore:
      - "{letters_black}Réglage du PNJ"
      - ""
      - "{primary}✎ Information"
      - " {letters}Les gestes qu'il joue"
      - " {letters}: {highlight}saluer{letters}, {highlight}acquiescer{letters},"
      - " {highlight}s'incliner{letters}... ou une"
      - " {highlight}performance {letters}complète, au clic,"
      - " {letters}tout seul, ou pour accueillir"
      - " {letters}un joueur qui s'approche."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:click} {letters}Clic gauche{letters_black}: %anim_left%"
      - "  {letters_black}· {info}{icon:right_click} {letters}Clic droit{letters_black}: %anim_right%"
      - "  {letters_black}· {info}{icon:note} {letters}Tout seul{letters_black}: %anim_idle% {letters_black}· {info}%anim_idle_every%"
      - "  {letters_black}· {info}{icon:note} {letters}Accueil{letters_black}: %anim_greet% {letters_black}· {info}%anim_greet_range% {letters}blocs"
      - "  {letters_black}· {info}{icon:check} {letters}Assis{letters_black}: %sitting%"
      - "  {letters_black}· {info}{icon:compass} {letters}Performances à moins de{letters_black}: {info}%anim_perform_range% {letters}blocs"
      - "  {letters_black}· {info}{icon:note} {letters}Idle en boucle{letters_black}: %anim_idle_continuous%"
      - "  {letters_black}· {info}{icon:tag} {letters}Groupe{letters_black}: %group%"
      - "  {letters_black}· {info}{icon:redstone} {letters}État{letters_black}: %npc_motion%"
      - ""
      - "{primary}{icon:click} Clic gauche {letters_black}· {letters}ce que joue un clic"
      - "{primary}{icon:right_click} Clic droit {letters_black}· {letters}idle, accueil et groupe"
      - "{primary}{icon:click} Shift-clic gauche {letters_black}· {letters}choisir une performance"
      - "{primary}{icon:right_click} Shift-clic droit {letters_black}· {letters}mettre en pause ou reprendre"
    actions:
      - "left: exyliadisplays:npc_animations"
      - "right: exyliadisplays:npc_animations_auto"
      - "shift_left: exyliadisplays:npc_open_performances"
      - "shift_right: exyliadisplays:npc_pause_toggle"

  interactions:
    slot: 21
    material: LEVER
    name: "{letters}PNJ {letters_black}▸ <gradient:{primary}:{secondary_light}>Interactions</gradient>"
    lore:
      - "{letters_black}Réglage du PNJ"
      - ""
      - "{primary}✎ Information"
      - " {letters}Ce que fait un clic : envoyer vers"
      - " {letters}un serveur, lancer des commandes,"
      - " {highlight}parler {letters}dans une bulle, frapper,"
      - " {letters}avec {highlight}gauche {letters}et {highlight}droit {letters}séparés."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:book} {letters}Au clic{letters_black}: %actions%"
      - "  {letters_black}· {info}{icon:tag} {letters}Utilisé par{letters_black}: %use_permission%"
      - "  {letters_black}· {info}{icon:clock} {letters}Cooldown{letters_black}: {info}%cooldown%s"
      - "  {letters_black}· {info}{icon:check} {letters}Se tourne vers le joueur{letters_black}: %face_clicker%"
      - ""
      - "{primary}{icon:click} Clic gauche {letters_black}· {letters}ce que fait un clic"
      - "{primary}{icon:right_click} Clic droit {letters_black}· {letters}qui peut l'utiliser, et à quelle fréquence"
    actions:
      - "left: exyliadisplays:npc_interactions"
      - "right: exyliadisplays:npc_interactions_rules"

  visibility:
    slot: 22
    material: ENDER_EYE
    name: "{letters}PNJ {letters_black}▸ <gradient:{primary}:{secondary_light}>Visibilité</gradient>"
    lore:
      - "{letters_black}Réglage du PNJ"
      - ""
      - "{primary}✎ Information"
      - " {letters}Où sa tête se tourne, qui le"
      - " {letters}voit, et à quelle distance."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:eye} {letters}Regarde{letters_black}: {info}%look%"
      - "  {letters_black}· {info}{icon:compass} {letters}Portée du regard{letters_black}: {info}%look_range% {letters}blocs"
      - "  {letters_black}· {info}{icon:key} {letters}Visible par{letters_black}: %permission%"
      - "  {letters_black}· {info}{icon:compass} {letters}Distance{letters_black}: {info}%view_distance% {letters}blocs"
      - ""
      - "{primary}{icon:click} Clique pour modifier"
    actions:
      - "exyliadisplays:npc_visibility"

  location:
    slot: 23
    material: COMPASS
    name: "{letters}PNJ {letters_black}▸ <gradient:{primary}:{secondary_light}>Emplacement</gradient>"
    lore:
      - "{letters_black}Réglage du PNJ"
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:map} {letters}Monde{letters_black}: {info}%world%"
      - "  {letters_black}· {info}{icon:compass} {letters}Position{letters_black}: {info}%xyz%"
      - "  {letters_black}· {info}{icon:compass} {letters}Orientation{letters_black}: {info}%yaw%° {letters_black}· {info}%pitch%°"
      - ""
      - "{primary}{icon:click} Clic gauche {letters_black}· {letters}position et rotation exactes"
      - "{primary}{icon:right_click} Clic droit {letters_black}· {letters}le déplacer · va là et sneak-clic"
      - "{primary}{icon:click} Shift-clic gauche {letters_black}· {letters}centrer sur son bloc"
      - "{primary}{icon:right_click} Shift-clic droit {letters_black}· {letters}tourner vers moi"
    actions:
      - "left: exyliadisplays:npc_location"
      - "right: exyliadisplays:npc_move_here"
      - "shift_left: exyliadisplays:npc_centre"
      - "shift_right: exyliadisplays:npc_face_me"

  teleport:
    slot: 27
    material: ENDER_PEARL
    name: "{letters}PNJ {letters_black}▸ <gradient:{primary}:{secondary_light}>Téléportation</gradient>"
    lore:
      - "{letters_black}Action du PNJ"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Va jusqu'à lui, face à lui."
      - ""
      - "{primary}{icon:click} Clique pour te téléporter"
    actions:
      - "exyliadisplays:npc_teleport"

  clone:
    slot: 28
    material: PAPER
    name: "{letters}PNJ {letters_black}▸ <gradient:{success}:{success_light}>Dupliquer</gradient>"
    lore:
      - "{letters_black}Action du PNJ"
      - ""
      - "{success}✎ Informations"
      - " {letters}Une copie sous un nouveau"
      - " {letters}nom, au même endroit."
      - ""
      - "{success}{icon:click} Clique pour dupliquer"
    actions:
      - "exyliadisplays:npc_clone"

  adjust:
    slot: 29
    material: SPYGLASS
    name: "{letters}PNJ {letters_black}▸ <gradient:{primary}:{secondary_light}>Réglage fin</gradient>"
    lore:
      - "{letters_black}Action du PNJ"
      - ""
      - "{primary}✎ Information"
      - " {letters}Déplace, tourne et"
      - " {letters}redimensionne-le à la"
      - " {highlight}molette {letters}en le regardant."
      - ""
      - "{primary}✦ Commandes"
      - "  {letters_black}· {letters}Molette{letters_black}: {info}changer la valeur"
      - "  {letters_black}· {letters}Accroupi + molette{letters_black}: {info}taille du pas"
      - "  {letters_black}· {letters}F{letters_black}: {info}axe suivant"
      - "  {letters_black}· {letters}Accroupi + clic{letters_black}: {info}aligner"
      - "  {letters_black}· {letters}Clic{letters_black}: {info}enregistrer"
      - ""
      - "{primary}{icon:click} Clique pour commencer"
    actions:
      - "exyliadisplays:npc_adjust"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Retour {letters_black}▸ <gradient:{error}:{error_light}>PNJ</gradient>"
    lore:
      - "{error}{icon:click} Clique pour revenir"
    actions:
      - "exyliadisplays:npc_open_list"

  undo:
    slot: 33
    material: CLOCK
    name: "{letters}PNJ {letters_black}▸ <gradient:{primary}:{secondary_light}>Annuler</gradient>"
    lore:
      - "{letters_black}Action du PNJ"
      - ""
      - "{primary}✎ Information"
      - " {letters}Annule la dernière"
      - " {letters}modification, faite ici, par"
      - " {letters}commande ou dans le fichier."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:iron} {letters}Modifications à annuler{letters_black}: {info}%npc_undo%"
      - ""
      - "{primary}{icon:click} Clique pour annuler"
    actions:
      - "exyliadisplays:npc_undo"

  delete:
    slot: 35
    material: BARRIER
    name: "{letters}PNJ {letters_black}▸ <gradient:{error}:{error_light}>Supprimer</gradient>"
    lore:
      - "{letters_black}Zone dangereuse"
      - ""
      - "{error}✎ Informations"
      - " {letters}Le supprime définitivement."
      - ""
      - "{error}{icon:click} Clique pour supprimer"
      - "{letters_black}Une confirmation te sera demandée."
    actions:
      - "exyliadisplays:npc_delete"
